const SUPABASE='https://nasdgjalsfxnwymqicio.supabase.co';
const KEY='sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3';

async function post(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(payload)});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||'Solicitud rechazada');return j}
const api=p=>post(API,p);
function flash(msg){state.flash=msg;render();setTimeout(()=>{if(state.flash===msg){state.flash='';render()}},3000)}
function setBusy(v){state.busy=v;render()}
function fmtDate(v){try{return new Intl.DateTimeFormat('es-CL',{dateStyle:'medium'}).format(new Date(v))}catch{return ''}}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>flash('Copiado al portapapeles')).catch(()=>{})}

async function loadPublic(){renderPublicLoading();try{const d=await api({action:'publicCard',token:publicToken});renderPublic(d.card)}catch(e){renderPublicError(e.message)}}
function renderPublicLoading(){app.innerHTML=`<main class="min-h-screen flex items-center justify-center p-4"><div class="glass rounded-3xl p-8 text-center w-full max-w-md">${BRAND}<div class="text-xs text-slate-400">Loyalty</div><div class="mt-5 animate-pulse text-slate-400">Cargando tarjeta…</div></div></main>`}
function renderPublicError(msg){app.innerHTML=`<main class="min-h-screen flex items-center justify-center p-4"><div class="glass rounded-3xl p-8 text-center w-full max-w-md"><div class="text-xl font-black">Tarjeta no disponible</div><p class="text-slate-400 text-sm mt-2">${esc(msg)}</p></div></main>`}
function renderPublic(c){
 const req=Math.max(1,Number(c.program.stampsRequired||10)),progress=Math.min(req,Math.max(0,Number(c.balance)||0)),percent=Math.min(100,Math.round((progress/req)*100));
 const paused=!c.program.active||c.enrollmentStatus!=='active'||c.state!=='assigned';
 app.innerHTML=`<main class="min-h-screen p-4 sm:p-8"><div class="max-w-md mx-auto space-y-4">
   <div class="text-center pt-3">${BRAND}<h1 class="text-2xl font-black mt-1">Loyalty</h1></div>
   <section class="glass rounded-[28px] p-5 overflow-hidden relative"><div class="absolute -top-16 -right-12 w-40 h-40 rounded-full bg-blue-600/20 blur-3xl"></div>
    <div class="relative"><div class="flex justify-between gap-3"><div><div class="text-xs text-slate-400">${esc(c.program.name)}</div><div class="text-xl font-black mt-1">${esc(c.memberName)}</div></div><span class="chip ${paused?'!text-amber-300':'!text-emerald-300'}">${paused?'Pausada':'Activa'}</span></div>
    <div class="grid grid-cols-2 gap-3 mt-5"><div class="rounded-2xl bg-slate-950/55 border border-slate-800 p-4"><div class="text-3xl font-black text-blue-300">${c.balance}</div><div class="text-xs text-slate-500 mt-1">${c.program.mode==='stamps'?'sellos/puntos':'puntos'}</div></div><div class="rounded-2xl bg-slate-950/55 border border-slate-800 p-4"><div class="text-3xl font-black">${c.visits}</div><div class="text-xs text-slate-500 mt-1">visitas verificadas</div></div></div>
    ${c.program.mode==='stamps'?`<div class="mt-5"><div class="flex justify-between text-xs mb-2"><span class="text-slate-400">Avance</span><b>${progress}/${req}</b></div><div class="h-2.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-blue-600 to-cyan-400" style="width:${percent}%"></div></div></div>`:''}
    <div class="mt-5 rounded-2xl bg-white p-3 w-fit mx-auto"><div id="publicQr"></div></div><div class="text-center text-[10px] text-slate-500 mt-2">${esc(c.cardNumber)}</div>

async function login(pin){const credential=localStorage.getItem('tocaqui_device_credential_v1')||'';if(!credential)throw new Error('Este navegador todavía no está autorizado. Usa un código de vinculación.');const d=await post(WORKSHOP,{action:'login',credential,pin});state.session=d.session;sessionStorage.setItem('tocaqui_workshop_session',d.session);await loadOverview()}
async function resumeAuthorizedDevice(){
 const credential=localStorage.getItem('tocaqui_device_credential_v1')||'';
 if(!/^[a-f0-9]{64}$/.test(credential))return false;
 try{
  const d=await post(WORKSHOP,{action:'resume',credential});
  state.session=d.session;sessionStorage.setItem('tocaqui_workshop_session',d.session);return true;
 }catch(e){
  if(/revocado|no autorizado/i.test(e.message||''))localStorage.removeItem('tocaqui_device_credential_v1');
  return false;
 }
}

t-xs text-slate-400">PVC vertical · 54 × 86 mm · una cara</p></div><button id="issuePurchase" class="btn btn-primary">Generar código de compra</button><button id="printRewardDesign" class="btn btn-secondary"><i class="fa-solid fa-print"></i> Imprimir</button></div><div class="loyalty-design-stage"><div id="rewardDesign" class="reward-pvc"><i class="fa-solid fa-gift reward-symbol"></i><div class="reward-title">TARJETA DE RECOMPENSAS</div><strong>${esc(p.name)}</strong><div class="reward-caption">${p.mode==='stamps'?'Acumula sellos en cada visita':'Acumula puntos en cada visita'}</div><div class="reward-qr-frame"></div><div class="reward-scan">ESCANEA AQUÍ</div><div class="reward-nfc"><i class="fa-solid fa-wifi"></i> ACERCA TU TELÉFONO</div>${BRAND}</div></div><p class="text-[10px] text-slate-400">Plantilla física sin QR asignado. El enlace individual se genera al emitir una tarjeta.</p></section><div class="grid xl:grid-cols-2 gap-4"><section class="panel p-5"><h2 class="font-bold">Registrar cliente final / emitir tarjeta</h2><p class="text-[10px] text-slate-500 mt-1">Este es el consumidor que acumulará sellos o puntos dentro de <b class="text-slate-300">${esc(p.name)}</b>.</p><form id="enrollForm" class="space-y-3 mt-3"><input class="field" name="name" required placeholder="Nombre del cliente final"><input class="field" name="email" type="email" placeholder="Correo (opcional)"><input class="field" name="phone" inputmode="tel" placeholder="Teléfono (opcional)"><label class="block"><span class="text-[10px] text-slate-400">Soporte de la tarjeta</span><select class="field mt-1" name="tag"><option value="">Tarjeta web solamente</option>${state.tags.filter(t=>!t.linked).map(t=>`<option value="${t.id}">${esc(t.id)} · ${esc(t.businessName||t.batchId||t.status)}</option>`).join('')}</select><span class="text-[9px] text-slate-500">Opcional: vincula un TAG físico NFC/QR disponible.</span></label><button class="btn btn-primary w-full">Crear tarjeta Loyalty</button></form></section><section class="panel p-5"><div class="flex items-start justify-between gap-3"><div><h2 class="font-bold">Recompensas del programa</h2><p class="text-[10px] text-slate-500 mt-1">Cada recompensa que guardes queda asignada automáticamente a <b class="text-slate-300">${esc(p.name)}</b> y estará disponible para todos sus clientes inscritos.</p></div><span class="chip">Programa completo</span></div><form id="rewardForm" class="space-y-3 mt-3"><input class="field" name="name" required placeholder="Ej: Café gratis"><textarea class="field" name="description" placeholder="Qué recibe el cliente"></textarea><label class="block"><span class="text-[10px] text-slate-400">${p.mode==='stamps'?'Sellos necesarios para canjear':'Puntos necesarios para canjear'}</span><input class="field mt-1" name="cost" type="number" min="1" required value="${p.mode==='stamps'?p.stamps_required:10}"><span class="text-[9px] text-slate-500">Al alcanzar este saldo, el premio aparecerá como disponible para el cliente.</span></label><button class="btn btn-primary w-full">Guardar recompensa en este programa</button></form><div class="space-y-2 mt-4">${(d.rewards||[]).map(r=>`<div class="rounded-xl border border-slate-800 p-3 flex justify-between gap-3"><div><b class="text-sm">${esc(r.name)}</b><div class="text-[10px] text-slate-500">${esc(r.description||'')}</div><div class="flex flex-wrap gap-1.5 mt-1"><span class="text-[9px] ${r.active?'text-emerald-300':'text-amber-300'}">${r.active?'Activa':'Pausada'}</span><span class="text-[9px] text-cyan-300">· Todos los clientes de ${esc(p.name)}</span></div></div><div class="text-right"><div class="text-blue-300 font-bold">${r.cost_points} <span class="text-[9px] font-normal">${p.mode==='stamps'?'sellos':'pts'}</span></div><button type="button" class="text-[10px] mt-2 text-slate-400 underline" data-toggle-reward="${r.id}" data-active="${r.active?'false':'true'}">${r.active?'Pausar':'Reactivar'}</button></div></div>`).join('')}</div></section></div><section class="panel p-5"><div class="flex justify-between"><div><h2 class="font-bold">Clientes inscritos</h2><p class="text-xs text-slate-500 mt-1">Visitas, saldo, canjes y estado de tarjeta.</p></div><span class="chip">${d.enrollments?.length||0}</span></div><div class="space-y-3 mt-4">${d.enrollments?.length?d.enrollments.map(e=>memberRow(e,d.rewards,p)).join(''):'<div class="text-sm text-slate-500">Aún no hay clientes inscritos.</div>'}</div></section>`}</section></main>${state.lastIssued?`<div class="fixed inset-0 z-50 bg-black/75 p-4 flex items-center justify-center"><div class="glass rounded-3xl p-5 max-w-md w-full"><div class="flex justify-between"><h3 class="font-black">Tarjeta emitida</h3><button id="closeIssued">✕</button></div><p class="text-sm text-slate-400 mt-2">Guarda o comparte este enlace. Si vinculaste un TAG, ya quedó apuntando a esta tarjeta.</p><div class="rounded-xl bg-slate-950 border border-slate-800 p-3 text-xs break-all mt-3">${esc(state.lastIssued.publicUrl)}</div><div class="flex gap-2 mt-3"><button id="copyIssued" class="btn btn-primary flex-1">Copiar enlace</button><a target="_blank" rel="noopener" href="${esc(state.lastIssued.publicUrl)}" class="btn btn-secondary flex-1">Abrir tarjeta</a></div></div></div>`:''}${state.flash?`<div class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-5 sm:max-w-sm glass rounded-2xl p-4 z-[60] text-sm font-semibold">${esc(state.flash)}</div>`:''}</div>`}

function render(){if(publicToken)return;if(!state.session){app.innerHTML=loginView();bindLogin();return}app.innerHTML=adminView();bindAdmin()}
function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',async e=>{e.preventDefault();setBusy(true);try{await login(new FormData(e.target).get('pin'));}catch(err){flash(err.message)}finally{state.busy=false;render()}});document.getElementById('pairForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await pair(String(new FormData(e.target).get('code')||''))}catch(err){flash(err.message)}})}
let requestSignature='';
async function refreshRequests(){const el=document.getElementById('myRequests');if(!el)return;try{const d=await api({action:'myRequests',token:publicToken});const sig=JSON.stringify(d.requests);el.innerHTML=d.requests.map(r=>'<div class="border border-slate-700 rounded-xl p-2 text-xs">Boleta '+esc(r.folio)+' · '+(r.status==='approved'?'Aprobada · +'+r.awarded:r.status==='rejected'?'Rechazada':'Pendiente de aprobación')+'</div>').join('');if(requestSignature&&sig!==requestSignature){const old=JSON.parse(requestSignature);if(d.requests.some(r=>r.status==='approved'&&!old.some(o=>o.id===r.id&&o.status==='approved'))){requestSignature=sig;await loadPublic();return}}requestSignature=sig}catch{}}
async function refreshInbox(){const el=document.getElementById('approvalInbox'),pid=state.selected;if(!el||!pid)return;try{const d=await api({action:'listRequests',session:state.session,programId:pid});if(!el.isConnected||pid!==state.selected)return;el.innerHTML=d.requests.map(r=>'<article class="border border-slate-700 rounded-xl p-3 mb-2"><b>'+esc(r.display_name)+'</b><div class="text-xs text-slate-400">'+esc(new Date(r.created_at).toLocaleString('es-CL'))+' · '+esc(r.card_number)+'</div><div class="text-sm">Boleta '+esc(r.folio)+' · $'+Number(r.amount).toLocaleString('es-CL')+'</div><div class="text-xs">'+(r.status==='pending'?'Pendiente':r.status==='approved'?'Aprobada':'Rechazada')+'</div>'+(r.status==='pending'?'<div class="flex gap-2 mt-2"><button class="btn btn-primary" data-approve="'+esc(r.id)+'">Aprobar</button><button class="btn btn-danger" data-reject="'+esc(r.id)+'">Rechazar</button></div>':'')+'</article>').join('')||'<p class="text-sm text-slate-400">Sin solicitudes</p>';el.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api({action:'decideRequest',session:state.session,programId:pid,requestId:b.dataset.approve||b.dataset.reject,approve:!!b.dataset.approve});await refreshInbox()}catch(e){alert(e.message);b.disabled=false}})}catch(e){el.textContent=e.message}}
setInterval(()=>{if(document.visibilityState==='visible'){if(publicToken)refreshRequests();else refreshInbox()}},10000);
function bindAdmin(){refreshInbox();document.getElementById("issuePurchase")?.addEventListener("click",async e=>{const b=e.currentTarget;b.disabled=true;try{const d=await api({action:"issuePurchase",session:state.session,programId:state.selected});const dialog=document.createElement("dialog");dialog.className="panel p-5 text-white max-w-sm w-full";dialog.innerHTML=`<h2 class="font-bold">Código de compra</h2><p class="text-sm mt-2">Válido por cinco minutos, un solo uso.</p><input readonly class="field mt-3" value="${esc(d.code)}"><button class="btn btn-secondary mt-3" data-copy>Copiar</button><button class="btn btn-secondary mt-3" data-close>Cerrar</button>`;document.body.append(dialog);dialog.querySelector("[data-copy]").onclick=()=>navigator.clipboard.writeText(d.code);dialog.querySelector("[data-close]").onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.showModal();}catch(err){flash(err.message)}finally{b.disabled=false}});document.getElementById("printRewardDesign")?.addEventListener("click",()=>window.print());document.querySelectorAll('[data-program]').forEach(b=>b.onclick=async()=>{state.selected=b.dataset.program;await loadDetail(state.selected);render()});document.getElementById('logout')?.addEventListener('click',()=>{window.location.href='../?v=2026.11.15.2025';});document.getElementById('programForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{setBusy(true);const d=await api({action:'createProgram',session:state.session,name:f.get('name'),mode:f.get('mode'),pointsPerVisit:Number(f.get('points')),stampsRequired:Number(f.get('target'))});state.selected=d.program.id;await loadOverview();flash('Programa creado')}catch(err){flash(err.message)}finally{state.busy=false;render()}});if(!state.selected)return;document.getElementById('toggleProgram')?.addEventListener('click',async e=>{try{await api({action:'updateProgram',session:state.session,programId:state.selected,active:e.currentTarget.dataset.active==='true'});await loadOverview();flash('Estado actualizado')}catch(err){flash(err.message)}});document.getElementById('programConfigForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await api({action:'updateProgram',session:state.session,programId:state.selected,name:f.get('name'),mode:f.get('mode'),pointsPerVisit:Number(f.get('points')),stampsRequired:Number(f.get('target'))});await loadOverview();flash('Reglas actualizadas')}catch(err){flash(err.message)}});document.getElementById('rewardForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await api({action:'createReward',session:state.session,programId:state.selected,name:f.get('name'),description:f.get('description'),costPoints:Number(f.get('cost'))});await loadDetail(state.selected);render();flash('Recompensa guardada')}catch(err){flash(err.message)}});document.querySelectorAll('[data-toggle-reward]').forEach(b=>b.onclick=async()=>{try{await api({action:'setRewardStatus',session:state.session,programId:state.selected,rewardId:b.dataset.toggleReward,active:b.dataset.active==='true'});await loadDetail(state.selected);render();flash('Recompensa actualizada')}catch(err){flash(err.message)}});document.getElementById('enrollForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api({action:'enroll',session:state.session,programId:state.selected,name:f.get('name'),email:f.get('email'),phone:f.get('phone'),sourceTagId:f.get('tag')});state.lastIssued=d;await loadTags();await loadDetail(state.selected);render()}catch(err){flash(err.message)}});document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=async()=>{try{await api({action:'recordVisit',session:state.session,programId:state.selected,enrollmentId:b.dataset.visit});await loadDetail(state.selected);render();flash('Visita registrada')}catch(err){flash(err.message)}});document.querySelectorAll('[data-reward-select]').forEach(s=>s.onchange=async()=>{if(!s.value)return;try{await api({action:'redeem',session:state.session,programId:state.selected,enrollmentId:s.dataset.rewardSelect,rewardId:s.value});await loadDetail(state.selected);render();flash('Canje registrado')}catch(err){s.value='';flash(err.message)}});document.querySelectorAll('[data-toggle-enrollment]').forEach(b=>b.onclick=async()=>{try{await api({action:'setEnrollmentStatus',session:state.session,programId:state.selected,enrollmentId:b.dataset.toggleEnrollment,status:b.dataset.status});await loadDetail(state.selected);render();flash('Tarjeta actualizada')}catch(err){flash(err.message)}});document.querySelectorAll('[data-rotate-card]').forEach(b=>b.onclick=async()=>{try{const d=await api({action:'rotateCardToken',session:state.session,programId:state.selected,cardId:b.dataset.rotateCard});state.lastIssued=d;render()}catch(err){flash(err.message)}});document.getElementById('closeIssued')?.addEventListener('click',()=>{state.lastIssued=null;render()});document.getElementById('copyIssued')?.addEventListener('click',()=>copyText(state.lastIssued?.publicUrl||''))}

if(publicToken)loadPublic();else (async()=>{if(!state.session)await resumeAuthorizedDevice();await loadOverview()})();
</script>
</body>
</html>
