<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<meta name="theme-color" content="#020617" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<title>TOCAQUI Loyalty</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{color-scheme:dark} body{margin:0;background:#020617;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .glass{background:linear-gradient(180deg,rgba(15,23,42,.94),rgba(8,15,30,.94));border:1px solid rgba(148,163,184,.14);box-shadow:0 14px 38px rgba(0,0,0,.2)}
  .field{background:#071120;border:1px solid #26364f;color:#f8fafc;border-radius:14px;padding:11px 13px;width:100%;outline:none}
  .field:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.14)}
  .btn{min-height:44px;border-radius:13px;padding:10px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:white}.btn-secondary{background:#111c2f;border:1px solid #2d3e59;color:#dbeafe}.btn-danger{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:#fda4af}
  .chip{border:1px solid #334155;border-radius:999px;padding:4px 8px;font-size:10px;color:#94a3b8}
  @media(max-width:767px){input,select,textarea{font-size:16px!important}button,a,input,select,textarea{touch-action:manipulation}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD='2026.11.15.1410';
const SUPABASE='https://nasdgjalsfxnwymqicio.supabase.co';
const KEY='sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3';
const API=SUPABASE+'/functions/v1/tocaqui-loyalty';
const WORKSHOP=SUPABASE+'/functions/v1/tocaqui-private-workshop';
const DEVICE=SUPABASE+'/functions/v1/tocaqui-device-activation';
const qs=new URLSearchParams(location.search), publicToken=qs.get('c')||'';
const app=document.getElementById('app');
const state={session:sessionStorage.getItem('tocaqui_workshop_session')||'',programs:[],selected:null,detail:null,tags:[],flash:'',busy:false,lastIssued:null};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function post(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(payload)});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||'Solicitud rechazada');return j}
const api=p=>post(API,p);
function flash(msg){state.flash=msg;render();setTimeout(()=>{if(state.flash===msg){state.flash='';render()}},3000)}
function setBusy(v){state.busy=v;render()}
function fmtDate(v){try{return new Intl.DateTimeFormat('es-CL',{dateStyle:'medium'}).format(new Date(v))}catch{return ''}}
function copyText(v){navigator.clipboard?.writeText(v).then(()=>flash('Copiado al portapapeles')).catch(()=>{})}

async function loadPublic(){renderPublicLoading();try{const d=await api({action:'publicCard',token:publicToken});renderPublic(d.card)}catch(e){renderPublicError(e.message)}}
function renderPublicLoading(){app.innerHTML=`<main class="min-h-screen flex items-center justify-center p-4"><div class="glass rounded-3xl p-8 text-center w-full max-w-md"><div class="text-blue-400 text-sm font-bold">TOCAQUI LOYALTY</div><div class="mt-5 animate-pulse text-slate-400">Cargando tarjeta…</div></div></main>`}
function renderPublicError(msg){app.innerHTML=`<main class="min-h-screen flex items-center justify-center p-4"><div class="glass rounded-3xl p-8 text-center w-full max-w-md"><div class="text-xl font-black">Tarjeta no disponible</div><p class="text-slate-400 text-sm mt-2">${esc(msg)}</p></div></main>`}
function renderPublic(c){
 const req=Math.max(1,Number(c.program.stampsRequired||10)),progress=((Number(c.balance)||0)%req),percent=Math.min(100,Math.round((progress/req)*100));
 const paused=!c.program.active||c.enrollmentStatus!=='active'||c.state!=='assigned';
 app.innerHTML=`<main class="min-h-screen p-4 sm:p-8"><div class="max-w-md mx-auto space-y-4">
   <div class="text-center pt-3"><div class="text-xs tracking-[.3em] text-blue-300 font-bold">TOCAQUI</div><h1 class="text-2xl font-black mt-1">Loyalty</h1></div>
   <section class="glass rounded-[28px] p-5 overflow-hidden relative"><div class="absolute -top-16 -right-12 w-40 h-40 rounded-full bg-blue-600/20 blur-3xl"></div>
    <div class="relative"><div class="flex justify-between gap-3"><div><div class="text-xs text-slate-400">${esc(c.program.name)}</div><div class="text-xl font-black mt-1">${esc(c.memberName)}</div></div><span class="chip ${paused?'!text-amber-300':'!text-emerald-300'}">${paused?'Pausada':'Activa'}</span></div>
    <div class="grid grid-cols-2 gap-3 mt-5"><div class="rounded-2xl bg-slate-950/55 border border-slate-800 p-4"><div class="text-3xl font-black text-blue-300">${c.balance}</div><div class="text-xs text-slate-500 mt-1">${c.program.mode==='stamps'?'sellos/puntos':'puntos'}</div></div><div class="rounded-2xl bg-slate-950/55 border border-slate-800 p-4"><div class="text-3xl font-black">${c.visits}</div><div class="text-xs text-slate-500 mt-1">visitas verificadas</div></div></div>
    ${c.program.mode==='stamps'?`<div class="mt-5"><div class="flex justify-between text-xs mb-2"><span class="text-slate-400">Avance</span><b>${progress}/${req}</b></div><div class="h-2.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-blue-600 to-cyan-400" style="width:${percent}%"></div></div></div>`:''}
    <div class="mt-5 rounded-2xl bg-white p-3 w-fit mx-auto"><div id="publicQr"></div></div><div class="text-center text-[10px] text-slate-500 mt-2">${esc(c.cardNumber)}</div>
    </div></section>
   <section class="glass rounded-3xl p-5"><h2 class="font-bold">Recompensas</h2><div class="space-y-2 mt-3">${(c.rewards||[]).length?(c.rewards||[]).map(r=>`<div class="rounded-2xl border border-slate-800 p-3 flex justify-between gap-3"><div><div class="font-semibold text-sm">${esc(r.name)}</div><div class="text-xs text-slate-500">${esc(r.description||'Beneficio disponible')}</div></div><b class="text-blue-300 whitespace-nowrap">${r.cost_points} pts</b></div>`).join(''):'<div class="text-sm text-slate-500">El comercio aún no ha publicado recompensas.</div>'}</div></section>
   <section class="glass rounded-3xl p-5"><h2 class="font-bold">Tarjetas digitales</h2><div class="grid grid-cols-3 gap-2 mt-3">${['web','apple','google'].map(p=>{const w=(c.wallet||[]).find(x=>x.provider===p);const label=p==='web'?'Web':p==='apple'?'Apple Wallet':'Google Wallet';return `<div class="rounded-xl border border-slate-800 p-3 text-center"><div class="text-xs font-semibold">${label}</div><div class="text-[10px] mt-1 ${w?.status==='ready'?'text-emerald-300':'text-amber-300'}">${w?.status==='ready'?'Lista':'Pendiente'}</div></div>`}).join('')}</div></section>
   <div class="text-center text-[10px] text-slate-600 pb-8">TOCAQUI Loyalty · ${BUILD}</div>
 </div></main>`;
 try{new QRCode(document.getElementById('publicQr'),{text:location.href,width:150,height:150,colorDark:'#020617',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch{}
}

async function login(pin){const credential=localStorage.getItem('tocaqui_device_credential_v1')||'';if(!credential)throw new Error('Este navegador todavía no está autorizado. Usa un código de vinculación.');const d=await post(WORKSHOP,{action:'login',credential,pin});state.session=d.session;sessionStorage.setItem('tocaqui_workshop_session',d.session);await loadOverview()}
async function pair(code){const d=await post(DEVICE,{action:'pair',code:code.trim().toLowerCase(),label:/iPhone|iPad/i.test(navigator.userAgent)?'iPhone TOCAQUI Loyalty':'Equipo TOCAQUI Loyalty'});localStorage.setItem('tocaqui_device_credential_v1',d.credential);flash('Dispositivo autorizado. Ingresa tu PIN.')}
async function loadOverview(){if(!state.session){render();return}try{const d=await api({action:'overview',session:state.session});state.programs=d.programs||[];if(state.selected&&!state.programs.some(p=>p.id===state.selected))state.selected=null;if(!state.selected&&state.programs[0])state.selected=state.programs[0].id;await Promise.all([loadTags(),state.selected?loadDetail(state.selected):Promise.resolve()]);render()}catch(e){if(/sesión/i.test(e.message)){state.session='';sessionStorage.removeItem('tocaqui_workshop_session')}flash(e.message);render()}}
async function loadTags(){if(!state.session)return;try{const d=await api({action:'listTags',session:state.session});state.tags=d.tags||[]}catch{state.tags=[]}}
async function loadDetail(id){if(!id)return;const d=await api({action:'programDetail',session:state.session,programId:id});state.detail=d}

function loginView(){return `<main class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md space-y-4"><div class="text-center"><div class="text-xs tracking-[.3em] text-blue-300 font-bold">TOCAQUI</div><h1 class="text-2xl font-black mt-2">Loyalty</h1><p class="text-sm text-slate-400 mt-2">Administración protegida por el mismo dispositivo y PIN de TOCAQUI.</p></div><section class="glass rounded-3xl p-5 space-y-4"><form id="loginForm" class="space-y-3"><label class="text-xs text-slate-400">PIN del taller</label><input class="field text-center tracking-[.35em]" name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="••••"><button class="btn btn-primary w-full">Entrar a Loyalty</button></form><div class="border-t border-slate-800 pt-4"><details><summary class="text-xs text-slate-400 cursor-pointer">Autorizar este dispositivo</summary><form id="pairForm" class="space-y-3 mt-3"><input class="field" name="code" placeholder="Código de vinculación de 64 caracteres"><button class="btn btn-secondary w-full">Vincular equipo</button></form></details></div></section><a href="./?v=2026.11.14.2318" class="block text-center text-xs text-blue-300">Volver al panel NFC/QR</a></div></main>`}

function programCard(p){return `<button data-program="${p.id}" class="w-full text-left glass rounded-2xl p-4 ${state.selected===p.id?'!border-blue-400':''}"><div class="flex justify-between gap-2"><div class="min-w-0"><div class="font-bold truncate">${esc(p.name)}</div><div class="text-[10px] text-slate-500 mt-1">${p.mode==='stamps'?'Sellos':'Puntos'} · ${p.active?'Activo':'Pausado'}</div></div><span class="chip">${p.stats?.members||0} clientes</span></div><div class="grid grid-cols-3 gap-2 mt-3 text-center"><div><b>${p.stats?.visits||0}</b><div class="text-[9px] text-slate-500">visitas</div></div><div><b>${p.stats?.rewards||0}</b><div class="text-[9px] text-slate-500">premios</div></div><div><b>${p.stats?.cards||0}</b><div class="text-[9px] text-slate-500">tarjetas</div></div></div></button>`}
function memberRow(e,rewards){const st=e.status==='active';return `<div class="rounded-2xl border border-slate-800 bg-slate-950/35 p-4"><div class="flex flex-wrap justify-between gap-3"><div><div class="font-bold">${esc(e.member?.display_name||'Cliente')}</div><div class="text-xs text-slate-500 mt-1">${esc(e.member?.email||e.member?.phone||e.card_number)}</div></div><div class="text-right"><div class="text-2xl font-black text-blue-300">${e.balance}</div><div class="text-[10px] text-slate-500">saldo · ${e.visits} visitas</div></div></div><div class="flex flex-wrap gap-2 mt-3"><button class="btn btn-primary !min-h-[38px] !py-2" data-visit="${e.id}" ${!st?'disabled':''}>+ Registrar visita</button><select class="field !w-auto !py-2 !text-xs" data-reward-select="${e.id}"><option value="">Canjear premio…</option>${(rewards||[]).filter(r=>r.active).map(r=>`<option value="${r.id}">${esc(r.name)} · ${r.cost_points} pts</option>`).join('')}</select><button class="btn btn-secondary !min-h-[38px] !py-2" data-toggle-enrollment="${e.id}" data-status="${st?'paused':'active'}">${st?'Pausar':'Reactivar'}</button>${e.card?.source_tag_id?`<span class="chip">TAG vinculado</span>`:''}</div><div class="flex gap-2 mt-3 text-[10px] text-slate-500">${(e.wallet||[]).map(w=>`<span>${w.provider}: <b class="${w.status==='ready'?'text-emerald-300':'text-amber-300'}">${w.status}</b></span>`).join(' · ')}</div></div>`}
function adminView(){const p=state.programs.find(x=>x.id===state.selected),d=state.detail;return `<div class="min-h-screen"><header class="sticky top-0 z-20 bg-[#050c1d]/95 backdrop-blur border-b border-slate-800"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between"><div><div class="text-[10px] tracking-[.28em] text-blue-300 font-bold">TOCAQUI</div><div class="font-black">Loyalty</div></div><div class="flex gap-2"><a href="./?v=2026.11.14.2318" class="btn btn-secondary">NFC/QR</a><button id="logout" class="btn btn-secondary">Salir</button></div></div></header><main class="max-w-7xl mx-auto p-4 sm:p-6 grid lg:grid-cols-[330px_1fr] gap-5"><aside class="space-y-3"><section class="glass rounded-3xl p-4"><div class="flex justify-between items-center"><div><h2 class="font-bold">Programas</h2><div class="text-[10px] text-slate-500">${state.programs.length} configurados</div></div></div><div class="space-y-2 mt-3">${state.programs.length?state.programs.map(programCard).join(''):'<div class="text-sm text-slate-500 p-3">Crea tu primer programa de fidelización.</div>'}</div></section><section class="glass rounded-3xl p-4"><h3 class="font-bold text-sm">Nuevo programa</h3><form id="programForm" class="space-y-3 mt-3"><input class="field" name="name" required minlength="2" placeholder="Ej: Café 10 Sellos"><select class="field" name="mode"><option value="stamps">Sellos / visitas</option><option value="points">Puntos</option></select><div class="grid grid-cols-2 gap-2"><input class="field" name="points" type="number" min="1" value="1" aria-label="Puntos por visita"><input class="field" name="target" type="number" min="1" value="10" aria-label="Meta de sellos"></div><button class="btn btn-primary w-full">Crear programa</button></form></section></aside><section class="space-y-4">${!p||!d?`<div class="glass rounded-3xl p-8 text-center text-slate-500">Selecciona o crea un programa.</div>`:`<section class="glass rounded-3xl p-5"><div class="flex flex-wrap justify-between gap-3"><div><div class="text-xs text-slate-500">Programa</div><h1 class="text-2xl font-black">${esc(p.name)}</h1><div class="flex gap-2 mt-2"><span class="chip">${p.mode==='stamps'?'Sellos':'Puntos'}</span><span class="chip">${p.active?'Activo':'Pausado'}</span><span class="chip">${p.points_per_visit} por visita</span></div></div><button id="toggleProgram" data-active="${p.active?'false':'true'}" class="btn ${p.active?'btn-danger':'btn-primary'}">${p.active?'Pausar programa':'Reactivar'}</button></div></section><div class="grid xl:grid-cols-2 gap-4"><section class="glass rounded-3xl p-5"><h2 class="font-bold">Registrar cliente / emitir tarjeta</h2><form id="enrollForm" class="space-y-3 mt-3"><input class="field" name="name" required placeholder="Nombre del cliente"><input class="field" name="email" type="email" placeholder="Correo (opcional)"><input class="field" name="phone" inputmode="tel" placeholder="Teléfono (opcional)"><select class="field" name="tag"><option value="">Sin TAG físico por ahora</option>${state.tags.filter(t=>!t.linked).map(t=>`<option value="${t.id}">${esc(t.id)} · ${esc(t.businessName||t.batchId||t.status)}</option>`).join('')}</select><button class="btn btn-primary w-full">Crear tarjeta Loyalty</button></form></section><section class="glass rounded-3xl p-5"><h2 class="font-bold">Nueva recompensa</h2><form id="rewardForm" class="space-y-3 mt-3"><input class="field" name="name" required placeholder="Ej: Café gratis"><textarea class="field" name="description" placeholder="Descripción"></textarea><input class="field" name="cost" type="number" min="1" required value="10" placeholder="Puntos necesarios"><button class="btn btn-primary w-full">Guardar recompensa</button></form><div class="space-y-2 mt-4">${(d.rewards||[]).map(r=>`<div class="rounded-xl border border-slate-800 p-3 flex justify-between"><div><b class="text-sm">${esc(r.name)}</b><div class="text-[10px] text-slate-500">${esc(r.description||'')}</div></div><span class="text-blue-300 font-bold">${r.cost_points}</span></div>`).join('')}</div></section></div><section class="glass rounded-3xl p-5"><div class="flex justify-between"><div><h2 class="font-bold">Clientes inscritos</h2><p class="text-xs text-slate-500 mt-1">Visitas, saldo, canjes y estado de tarjeta.</p></div><span class="chip">${d.enrollments?.length||0}</span></div><div class="space-y-3 mt-4">${d.enrollments?.length?d.enrollments.map(e=>memberRow(e,d.rewards)).join(''):'<div class="text-sm text-slate-500">Aún no hay clientes inscritos.</div>'}</div></section>`}</section></main>${state.lastIssued?`<div class="fixed inset-0 z-50 bg-black/75 p-4 flex items-center justify-center"><div class="glass rounded-3xl p-5 max-w-md w-full"><div class="flex justify-between"><h3 class="font-black">Tarjeta emitida</h3><button id="closeIssued">✕</button></div><p class="text-sm text-slate-400 mt-2">Guarda o comparte este enlace. Si vinculaste un TAG, ya quedó apuntando a esta tarjeta.</p><div class="rounded-xl bg-slate-950 border border-slate-800 p-3 text-xs break-all mt-3">${esc(state.lastIssued.publicUrl)}</div><div class="flex gap-2 mt-3"><button id="copyIssued" class="btn btn-primary flex-1">Copiar enlace</button><a target="_blank" rel="noopener" href="${esc(state.lastIssued.publicUrl)}" class="btn btn-secondary flex-1">Abrir tarjeta</a></div></div></div>`:''}${state.flash?`<div class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-5 sm:max-w-sm glass rounded-2xl p-4 z-[60] text-sm font-semibold">${esc(state.flash)}</div>`:''}</div>`}

function render(){if(publicToken)return;if(!state.session){app.innerHTML=loginView();bindLogin();return}app.innerHTML=adminView();bindAdmin()}
function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',async e=>{e.preventDefault();setBusy(true);try{await login(new FormData(e.target).get('pin'));}catch(err){flash(err.message)}finally{state.busy=false;render()}});document.getElementById('pairForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await pair(String(new FormData(e.target).get('code')||''))}catch(err){flash(err.message)}})}
function bindAdmin(){document.querySelectorAll('[data-program]').forEach(b=>b.onclick=async()=>{state.selected=b.dataset.program;await loadDetail(state.selected);render()});document.getElementById('logout')?.addEventListener('click',()=>{state.session='';sessionStorage.removeItem('tocaqui_workshop_session');render()});document.getElementById('programForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{setBusy(true);const d=await api({action:'createProgram',session:state.session,name:f.get('name'),mode:f.get('mode'),pointsPerVisit:Number(f.get('points')),stampsRequired:Number(f.get('target'))});state.selected=d.program.id;await loadOverview();flash('Programa creado')}catch(err){flash(err.message)}finally{state.busy=false;render()}});if(!state.selected)return;document.getElementById('toggleProgram')?.addEventListener('click',async e=>{try{await api({action:'updateProgram',session:state.session,programId:state.selected,active:e.currentTarget.dataset.active==='true'});await loadOverview();flash('Estado actualizado')}catch(err){flash(err.message)}});document.getElementById('rewardForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await api({action:'createReward',session:state.session,programId:state.selected,name:f.get('name'),description:f.get('description'),costPoints:Number(f.get('cost'))});await loadDetail(state.selected);render();flash('Recompensa guardada')}catch(err){flash(err.message)}});document.getElementById('enrollForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api({action:'enroll',session:state.session,programId:state.selected,name:f.get('name'),email:f.get('email'),phone:f.get('phone'),sourceTagId:f.get('tag')});state.lastIssued=d;await loadTags();await loadDetail(state.selected);render()}catch(err){flash(err.message)}});document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=async()=>{try{await api({action:'recordVisit',session:state.session,programId:state.selected,enrollmentId:b.dataset.visit});await loadDetail(state.selected);render();flash('Visita registrada')}catch(err){flash(err.message)}});document.querySelectorAll('[data-reward-select]').forEach(s=>s.onchange=async()=>{if(!s.value)return;try{await api({action:'redeem',session:state.session,programId:state.selected,enrollmentId:s.dataset.rewardSelect,rewardId:s.value});await loadDetail(state.selected);render();flash('Canje registrado')}catch(err){s.value='';flash(err.message)}});document.querySelectorAll('[data-toggle-enrollment]').forEach(b=>b.onclick=async()=>{try{await api({action:'setEnrollmentStatus',session:state.session,programId:state.selected,enrollmentId:b.dataset.toggleEnrollment,status:b.dataset.status});await loadDetail(state.selected);render();flash('Tarjeta actualizada')}catch(err){flash(err.message)}});document.getElementById('closeIssued')?.addEventListener('click',()=>{state.lastIssued=null;render()});document.getElementById('copyIssued')?.addEventListener('click',()=>copyText(state.lastIssued?.publicUrl||''))}

if(publicToken)loadPublic();else loadOverview();
</script>
</body>
</html>
