<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#020617">
<title>TOCAQUI · Tarjeta</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}.card{width:min(100%,390px);border:1px solid #1e3a5f;border-radius:22px;background:#0b1427;padding:26px;text-align:center;box-shadow:0 24px 70px #020617aa}.mark{width:48px;height:48px;margin:0 auto 14px;border-radius:15px;background:#132341;display:grid;place-items:center;color:#93c5fd;font-weight:900}.pill{display:inline-flex;border:1px solid #1e3a5f;background:#07101f;color:#93c5fd;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.08em}h1{font-size:20px;margin:14px 0 8px}p{font-size:12px;color:#94a3b8;line-height:1.5;margin:0}.error{color:#fecdd3}
</style>
</head>
<body>
<main class="card">
<div class="mark">TQ</div>
<div class="pill">TOCAQUI · NFC / QR</div>
<h1 id="title">Abriendo tu tarjeta…</h1>
<p id="message">Verificando el TAG y cargando su destino actual.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var tag=(q.get('tag')||'').trim().toUpperCase();
  var preview=q.get('preview')==='1';
  if(!/^TAG-[A-Z0-9]{5,32}$/.test(tag)){
    document.getElementById('title').textContent='Tarjeta no válida';
    document.getElementById('message').textContent='El identificador TOCAQUI no tiene un formato válido.';
    document.getElementById('message').className='error';
    return;
  }
  var target='https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-admin-qr-test-r/'+encodeURIComponent(tag)+'?resolved=1'+(preview?'&preview=1':'');
  location.replace(target);
})();
</script>
<noscript><p class="error">Activa JavaScript para abrir esta tarjeta.</p></noscript>
</body>
</html>
