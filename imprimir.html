            }

        };

        const generateQRBase64 = async (text, size = 300) => {
            if (window.QRCode && window.QRCode.toDataURL) {
                try {
                    return await window.QRCode.toDataURL(text, {
                        width: size,
                        margin: 1,
                        color: { dark: '#000000', light: '#ffffff' }
                    });
                } catch (err) {
                    console.error("QR Generation error", err);
                }
            }
            return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;
        };

        const compressImageToDataURL = (file, targetWidth = 600, targetHeight = 950, quality = 0.85) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);

                        const imgRatio = img.width / img.height;
                        const targetRatio = targetWidth / targetHeight;
                        let renderW = targetWidth;
                        let renderH = targetHeight;
                        let offsetX = 0;
                        let offsetY = 0;

                        if (imgRatio > targetRatio) {
                            renderW = targetHeight * imgRatio;
                            offsetX = (targetWidth - renderW) / 2;
                        } else {
                            renderH = targetWidth / imgRatio;
                            offsetY = (targetHeight - renderH) / 2;
                        }

                        ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

                        <BackToDashboardButton label="Volver a Selección de Modo" />

                        <div className="glass-panel p-4 rounded-2xl flex justify-between items-center border border-indigo-500/30">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                                    <i className="fa-solid fa-user-tie"></i>
                                </div>
                                <div>
                                    <span className="text-xs font-mono uppercase text-indigo-400">Portal del Cliente</span>
                                    <h2 className="text-lg font-bold text-white">{currentClient?.company || 'Mi Empresa'}</h2>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {clientQrs.map(qr => (
                                <div key={qr.id} className="glass-panel p-5 rounded-2xl space-y-3">
                                    <div className="flex justify-between items-start">
                                        <span className="text-[10px] font-mono font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded">ID: {qr.trackingCode}</span>
                                        <span className="text-xs text-slate-400 font-mono"><i className="fa-solid fa-eye mr-1"></i>{qr.scans || 0} lecturas</span>
                                    </div>
                                    <h3 className="font-bold text-white">{qr.businessName || 'Mi Tarjeta'}</h3>
                                    <div className="p-3 bg-slate-900 rounded-xl text-xs font-mono text-blue-400 truncate border border-slate-800">{qr.dynamicUrl || 'Sin enlace'}</div>
                                    <button onClick={() => { setEditingQr(qr); setNewUrl(qr.dynamicUrl); }} className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl">
                                        Cambiar Enlace Dinámico
                                    </button>
                                </div>
                            ))}
                        </div>

                        {editingQr && (
                            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-md rounded-2xl p-6 border border-slate-700 space-y-4">
                                    <h3 className="font-bold text-white">Modificar URL de Destino</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); updateQR(editingQr.id, { dynamicUrl: sanitizeUrl(newUrl) }); setEditingQr(null); }} className="space-y-4">
                                        <input type="url" required value={newUrl} onChange={e => setNewUrl(e.target.value)} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm font-mono" placeholder="https://..." />
                                        <button type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">Guardar Destino</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 8. SETTINGS VIEW
            const SettingsView = () => {
                const [pinInput, setPinInput] = useState(masterPin);
                const [keyInput, setKeyInput] = useState(googleApiKey);

                const saveSettings = () => {
                    setMasterPin(pinInput);
                    setGoogleApiKey(keyInput);
                    showToast('PIN y llaves de seguridad guardados.', 'success');
                };

                return (
                    <div className="max-w-3xl mx-auto space-y-6">
                        <BackToDashboardButton />

                        <div>
                            <h1 className="text-2xl font-bold text-white tracking-tight">Configuración & APIs Cloud</h1>
                            <p className="text-slate-400 text-sm mt-1">Configura el PIN de 4 dígitos y conectores con Google Cloud APIs.</p>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <i className="fa-solid fa-lock text-amber-400"></i> PIN Maestro de Activación (4 dígitos)
                            </h2>
                            <div className="flex gap-2 max-w-xs">
                                <input
                                    type="text"
                                    maxLength="4"
                                    value={pinInput}
                                    onChange={e => setPinInput(e.target.value.replace(/\D/g, ''))}
                                    className="glass-input px-4 py-2 rounded-xl font-mono text-center font-bold text-lg tracking-widest w-32"
                                />
                                <button onClick={saveSettings} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-xs">
                                    Actualizar PIN
                                </button>
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <i className="fa-brands fa-google text-blue-400"></i> Google Places API Key
                            </h2>
                            <div className="flex gap-2">
                                <input
                                    type="password"
                                    value={keyInput}
                                    onChange={e => setKeyInput(e.target.value)}
                                    placeholder="AIzaSyB..."
                                    className="flex-1 glass-input px-3.5 py-2.5 rounded-xl text-sm font-mono"
                                />
                                <button onClick={saveSettings} className="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2.5 rounded-xl text-xs">
                                    Guardar Key
                                </button>
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl space-y-4">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                <i className="fa-brands fa-google-drive text-emerald-400"></i> Google Drive API v3 (Conector OAuth 2.0)
                            </h2>
                            <div className="space-y-3">
                                <input type="text" placeholder="Google OAuth Client ID" value={driveConfig.clientId} onChange={e => setDriveConfig({...driveConfig, clientId: e.target.value})} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs font-mono" />
                                <input type="text" placeholder="Folder ID de Google Drive" value={driveConfig.folderId} onChange={e => setDriveConfig({...driveConfig, folderId: e.target.value})} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs font-mono" />
                                <button onClick={() => showToast('Conexión con Google Drive guardada.', 'success')} className="py-2.5 px-4 bg-emerald-600 text-white font-bold rounded-xl text-xs">Conectar con Google Drive</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // MODAL ACTIVATION FLOW WITH SECURITY PIN & GOOGLE PLACES
            const ActivationModal = () => {
                if (!activateModal.open) return null;
                const qr = activateModal.qr;

                const [pinEntered, setPinEntered] = useState('');
                const [pinVerified, setPinVerified] = useState(qr.status === 'active');
                const [pinError, setPinError] = useState(false);

                const [searchQuery, setSearchQuery] = useState('');
                const [selectedPlace, setSelectedPlace] = useState(qr.businessName ? { name: qr.businessName, address: qr.businessAddress || '', placeId: qr.placeId || 'ChIJMock' } : null);
                const [presetType, setPresetType] = useState(qr.functionType || 'review_gate');
                const [customUrl, setCustomUrl] = useState(qr.dynamicUrl || '');
                const [assignedClient, setAssignedClient] = useState(qr.clientId || clients[0]?.id || '');

                const mockPlaces = [
                    { name: 'Restaurante El Gaucho', address: 'Av. Providencia 1234, Santiago', placeId: 'ChIJN1t_tDeuEmsRUsoyG83frY4' },
                    { name: 'Barbería Capital', address: 'Calle San Martín 560, Santiago', placeId: 'ChIJ1234BarberiaID' },
                    { name: 'Café Central', address: 'Moneda 812, Santiago', placeId: 'ChIJ5678CafeID' }
                ];
                const filteredMock = mockPlaces.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));

                const handleConfirmActivation = () => {
                    let finalUrl = customUrl;
                    if (presetType === 'google_review' && selectedPlace) {
                        finalUrl = `https://search.google.com/local/writereview?placeid=${selectedPlace.placeId}`;
                    } else if (presetType === 'review_gate' && selectedPlace) {
                        finalUrl = `https://search.google.com/local/writereview?placeid=${selectedPlace.placeId}`;
                    }

                    updateQR(qr.id, {
                        status: 'active',
                        clientId: assignedClient,
                        businessName: selectedPlace ? selectedPlace.name : 'Negocio Asignado',
                        businessAddress: selectedPlace ? selectedPlace.address : '',
                        placeId: selectedPlace ? selectedPlace.placeId : null,
                        functionType: presetType,
                        dynamicUrl: sanitizeUrl(finalUrl)
                    });
                    setActivateModal({ open: false, qr: null });
                };

                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-xl rounded-2xl p-6 border border-slate-700 max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg text-white">Configurar Tarjeta {qr.trackingCode}</h3>
                                <button onClick={() => setActivateModal({ open: false, qr: null })} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>

                            {!pinVerified ? (
                                <form onSubmit={(e) => { e.preventDefault(); if (pinEntered === masterPin) setPinVerified(true); else setPinError(true); }} className="py-8 text-center space-y-4">
                                    <div className="w-14 h-14 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                                        <i className="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <h4 className="font-bold text-white">Ingrese PIN Maestro de Activación</h4>
                                    <input type="password" maxLength="4" autoFocus value={pinEntered} onChange={e => setPinEntered(e.target.value)} className="glass-input px-4 py-2.5 rounded-xl font-mono text-center text-xl font-bold w-36" placeholder="••••" />
                                    {pinError && <p className="text-xs text-red-400 font-semibold block">PIN Incorrecto</p>}
                                    <button type="submit" className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl">Verificar PIN</button>
                                </form>
                            ) : (
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">1. Vincular a Cliente</label>
                                        <select value={assignedClient} onChange={e => setAssignedClient(e.target.value)} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm">
                                            {clients.map(c => (
                                                <option key={c.id} value={c.id} className="bg-slate-900 text-white">{c.name} ({c.company})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">2. Buscar Local en Google Places</label>
                                        <input type="text" placeholder="Buscar negocio..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm" />
                                        {searchQuery && !selectedPlace && (
                                            <div className="mt-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-800">
                                                {filteredMock.map((p, idx) => (
                                                    <div key={idx} onClick={() => { setSelectedPlace(p); setSearchQuery(''); }} className="p-3 hover:bg-slate-800 cursor-pointer text-xs flex justify-between">
                                                        <div><div className="font-bold text-white">{p.name}</div><div className="text-slate-400">{p.address}</div></div>
                                                        <span className="text-blue-400 font-mono text-[10px]">Seleccionar</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {selectedPlace && (
                                            <div className="mt-2 bg-blue-600/10 border border-blue-500/30 p-3 rounded-xl flex justify-between items-center text-xs">
                                                <div><div className="font-bold text-white">{selectedPlace.name}</div><div className="text-slate-400">{selectedPlace.address}</div></div>
                                                <button onClick={() => setSelectedPlace(null)} className="text-slate-400 hover:text-red-400">Cambiar</button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-2">3. Función de Destino</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'review_gate', name: 'Filtro 5 Estrellas (Review Gate)' },
                                                { id: 'google_review', name: 'Directo Google Reviews' },
                                                { id: 'custom_url', name: 'URL Personalizada / PDF' }
                                            ].map(fn => (
                                                <button key={fn.id} type="button" onClick={() => setPresetType(fn.id)} className={`p-3 rounded-xl border text-xs font-semibold text-left ${presetType === fn.id ? 'bg-blue-600/30 border-blue-500 text-white' : 'bg-slate-800/40 border-slate-700/60 text-slate-400'}`}>
                                                    {fn.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {presetType === 'custom_url' && (
                                        <input type="url" value={customUrl} onChange={e => setCustomUrl(e.target.value)} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs font-mono" placeholder="https://..." />
                                    )}

                                    <button onClick={handleConfirmActivation} className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg">
                                        Guardar Asignación de Tarjeta
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // SCAN SIMULATOR MODAL
            const ScanSimulatorModal = () => {
                if (!scanSimModal.open) return null;
                const scannedQr = qrs.find(q => q.trackingCode === scanSimModal.code) || { trackingCode: scanSimModal.code, status: 'pending', dynamicUrl: '' };

                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-sm rounded-3xl p-6 border border-slate-700 text-center relative">
                            <button onClick={() => setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 })} className="absolute top-4 right-4 text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>

                            <div className="w-16 h-16 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 animate-bounce">
                                <i className="fa-solid fa-mobile-screen"></i>
                            </div>

                            <span className="text-[10px] font-mono uppercase bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">
                                Escaneado: {scannedQr.trackingCode}
                            </span>

                            {scannedQr.status === 'active' ? (
                                <div className="mt-5 space-y-4">
                                    <h3 className="font-bold text-white text-lg">{scannedQr.businessName || 'Tarjeta Conectada'}</h3>
                                    
                                    {scannedQr.functionType === 'review_gate' && scanSimModal.reviewGateStep === 'stars' ? (
                                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                                            <p className="text-xs text-slate-300 font-semibold">¿Cómo fue tu experiencia en el local?</p>
                                            <div className="flex justify-center gap-2 text-2xl text-amber-400">
                                                {[1, 2, 3, 4, 5].map(star => (
                                                    <button
                                                        key={star}
                                                        onClick={() => {
                                                            if (star >= 4) {
                                                                window.open(scannedQr.dynamicUrl, '_blank');
                                                            } else {
                                                                setScanSimModal(prev => ({ ...prev, reviewGateStep: 'feedback', selectedStars: star }));
                                                            }
                                                        }}
                                                        className="hover:scale-125 transition-transform"
                                                    >
                                                        ★
                                                    </button>
                                                ))}
                                            </div>
                                            <span className="text-[10px] text-slate-500 block">4-5 ★ redirige a Google Maps • 1-3 ★ formulario privado</span>
                                        </div>
                                    ) : scannedQr.functionType === 'review_gate' && scanSimModal.reviewGateStep === 'feedback' ? (
                                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                                            <p className="text-xs text-slate-300 font-semibold">Déjanos tu sugerencia privada:</p>
                                            <textarea rows="3" placeholder="Escribe aquí tu comentario..." className="w-full glass-input p-2.5 rounded-xl text-xs"></textarea>
                                            <button onClick={() => { showToast('Gracias por tu opinión privada.', 'success'); setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 }); }} className="w-full py-2 bg-blue-600 text-white font-bold rounded-xl text-xs">Enviar Feedback</button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="p-3 bg-slate-900 rounded-xl text-xs font-mono text-blue-400 break-all border border-slate-800">{scannedQr.dynamicUrl}</div>
                                            <a href={scannedQr.dynamicUrl} target="_blank" rel="noreferrer" className="block w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm">Abrir Enlace Final &rarr;</a>
                                        </>
                                    )}
                                </div>
                            ) : (
                                <div className="mt-5 space-y-4">
                                    <h3 className="font-bold text-amber-400 text-lg">Tarjeta Virgen Por Activar</h3>
                                    <p className="text-xs text-slate-400">Al escanear esta tarjeta en blanco se requiere ingresar el PIN maestro para asignarla a un local.</p>
                                    <button onClick={() => { setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 }); setActivateModal({ open: true, qr: scannedQr }); }} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl">Activar e Ingresar PIN</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ConfirmModal = () => {
                if (!confirmModal.open) return null;
                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-sm rounded-2xl p-6 border border-slate-700">
                            <h3 className="font-bold text-lg text-white mb-2">{confirmModal.title}</h3>
                            <p className="text-xs text-slate-300 mb-5">{confirmModal.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmModal({ open: false, title: '', message: '', onConfirm: null })} className="flex-1 py-2.5 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl">Cancelar</button>
                                <button onClick={confirmModal.onConfirm} className="flex-1 py-2.5 bg-red-600 text-white text-xs font-bold rounded-xl">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    <TopHeader />
                    <div className="flex-1 flex overflow-hidden">
                        {roleMode === 'admin' ? (
                            <>
                                <AdminSidebar />
                                <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                                    <div className="max-w-7xl mx-auto">
                                        {adminTab === 'dashboard' && <DashboardView />}
                                        {adminTab === 'batch' && <BatchView />}
                                        {adminTab === 'qrs' && <QRManagementView />}
                                        {adminTab === 'clients' && <ClientView />}
                                        {adminTab === 'client-detail' && <ClientView />}
                                        {adminTab === 'templates' && <TemplatesView />}
                                        {adminTab === 'print' && <PrintView />}
                                        {adminTab === 'settings' && <SettingsView />}
                                    </div>
                                </main>
                            </>
                        ) : (
                            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                                <ClientPortalView />
                            </main>
                        )}
                    </div>

                    <ActivationModal />
                    <ScanSimulatorModal />
                    <ConfirmModal />

                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-50 glass-panel border border-slate-700 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                            <span className="text-xs font-semibold text-white">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
