                                            }} className="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                                            {templateImageBusy.front && <div className="mt-2 rounded-xl border border-purple-500/20 bg-purple-500/10 p-3 text-xs text-purple-200"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Procesando imagen…</div>}
                                            {!templateImageBusy.front && form.frontBg && <div className="mt-2 rounded-xl border border-emerald-500/20 bg-slate-950/50 p-2.5 flex items-center gap-3">
                                                <img src={form.frontBg} alt="Previsualización anverso" className="w-16 h-20 rounded-lg object-cover border border-slate-700" />
                                                <div className="min-w-0"><div className="text-xs font-semibold text-emerald-300"><i className="fa-solid fa-circle-check mr-1.5"></i>Imagen cargada</div><div className="text-[10px] text-slate-500 truncate mt-1">{form.frontName||'Anverso listo'}</div></div>
                                            </div>}

                                        </div>

                                        <div>
                                            <label className="block text-xs text-slate-300 mb-1">Reverso (Imagen Atrás)</label>
                                            <input type="file" accept="image/*" onChange={async (e) => {
                                                const file = e.target.files[0];
                                                if (!file) return;
                                                setTemplateImageBusy(prev=>({...prev,back:true}));
                                                try {
                                                    const b64 = await compressImageToDataURL(file, ...templateImageSize, 0.92, 'cover');
                                                    setTemplateDraft(prev => ({ ...prev, backBg:b64, backName:file.name }));
                                                } catch (error) {
                                                    showToast('No se pudo procesar la imagen del reverso.', 'error');
                                                } finally {
                                                    setTemplateImageBusy(prev=>({...prev,back:false}));
                                                    e.target.value='';
                                                }
                                            }} className="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                                            {templateImageBusy.back && <div className="mt-2 rounded-xl border border-purple-500/20 bg-purple-500/10 p-3 text-xs text-purple-200"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Procesando imagen…</div>}
                                            {!templateImageBusy.back && form.backBg && <div className="mt-2 rounded-xl border border-emerald-500/20 bg-slate-950/50 p-2.5 flex items-center gap-3">
                                                <img src={form.backBg} alt="Previsualización reverso" className="w-16 h-20 rounded-lg object-cover border border-slate-700" />
                                                <div className="min-w-0"><div className="text-xs font-semibold text-emerald-300"><i className="fa-solid fa-circle-check mr-1.5"></i>Imagen cargada</div><div className="text-[10px] text-slate-500 truncate mt-1">{form.backName||'Reverso listo'}</div></div>
                                            </div>}

                                        </div>

                                        <button type="submit" disabled={templateSaving||templateImageBusy.front||templateImageBusy.back||(!form.frontBg&&!form.backBg)} className="w-full py-3 bg-purple-600 disabled:bg-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold rounded-xl">{templateImageBusy.front||templateImageBusy.back?'Procesando imagen…':templateModal.isEditing?'Guardar cambios':'Guardar Plantilla Permanente'}</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 6. ADVANCED PRINT & MASSIVE A4 DUPLEX STUDIO
            const PrintView = () => {
                const printInFlight=React.useRef(false);
                const printSelectionRef=React.useRef([]);
                const printA4Sheets = async () => {
                    if(printInFlight.current)return;
                    const root = document.getElementById('print-area-wrapper');
                    if (!root || !root.querySelector('.print-page-a4')) {
                        showToast('Selecciona al menos una tarjeta para imprimir.','warning');
                        return;
                    }
                    printInFlight.current=true;
                    try{
                    const ids=[...new Set(selectedItems.map(item=>item.id))].sort();
                    await markCardsExposed(ids,'print');
                    const images = Array.from(root.querySelectorAll('img'));
                    await Promise.all(images.map(img => {
                        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                        if (typeof img.decode === 'function') return img.decode().catch(() => new Promise(resolve => {
                            img.addEventListener('load', resolve, {once:true});
                            img.addEventListener('error', resolve, {once:true});
                        }));
                        return new Promise(resolve => {
                            img.addEventListener('load', resolve, {once:true});
                            img.addEventListener('error', resolve, {once:true});
                        });
                    }));
                    if(JSON.stringify(ids)!==JSON.stringify([...new Set(printSelectionRef.current)].sort()))throw new Error('La selección cambió; vuelve a iniciar la impresión.');
                    requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
                    }catch(error){showToast('No se pudo preparar la impresión: '+(error.message||error),'error');}
                    finally{printInFlight.current=false;}
                };
                const [qrCodeImages, setQrCodeImages] = useState({});
                const [printBatchFilter, setPrintBatchFilter] = useState(() => {
                    try{
                        const locked=sessionStorage.getItem('tocaqui_print_locked_batch_v1');
                        if(locked)return locked;
                    }catch{}
                    const selected = qrs.filter(q => selectedQrIdsForSheet.includes(q.id));
                    const ids = [...new Set(selected.map(q=>q.batchId || 'legacy'))];
                    return selected.length && ids.length === 1 ? ids[0] : 'all';
                });
                const [printBatchPickerOpen, setPrintBatchPickerOpen] = useState(false);
                const [printBatchSearch, setPrintBatchSearch] = useState('');
                const [printDirectSearch, setPrintDirectSearch] = useState('');
                const [printDirectPage, setPrintDirectPage] = useState(1);
                const printDirectPageSize = 10;
                const [previewZoom, setPreviewZoom] = useState(58);
                const [showCutGuides, setShowCutGuides] = useState(false);
                const [artworkFitMode, setArtworkFitMode] = useState('cover');
                const [artworkBleedMm, setArtworkBleedMm] = useState(() => {
                    const raw=localStorage.getItem('tocaqui_print_bleed_mm_v1');
                    const saved=Number(raw);
                    return raw !== null && Number.isFinite(saved) && saved >= 0 && saved <= 1.5 ? saved : 1;
                });
                const saveArtworkBleed = value => {
                    const next=Math.max(0,Math.min(1.5,Number(value)||0));
                    setArtworkBleedMm(next);
                    localStorage.setItem('tocaqui_print_bleed_mm_v1',String(next));
                };
                const [artworkWidthPct, setArtworkWidthPct] = useState(() => {
                    const raw=localStorage.getItem('tocaqui_print_artwork_width_v1');
                    const saved=Number(raw);
                    return raw !== null && Number.isFinite(saved) && saved >= 100 && saved <= 110 ? saved : 100;
                });
                const saveArtworkWidth = value => {
                    const next=Math.max(100,Math.min(110,Number(value)||100));
                    setArtworkWidthPct(next);
                    localStorage.setItem('tocaqui_print_artwork_width_v1',String(next));
                };
                const [customTemplateFileName, setCustomTemplateFileName] = useState({ front: '', back: '' });
                const [printCardPickerOpen, setPrintCardPickerOpen] = useState(false);
                const [printTemplatePickerOpen, setPrintTemplatePickerOpen] = useState(false);
                const [printMixBatchPickerOpen, setPrintMixBatchPickerOpen] = useState(false);
                const [printMixBatchSearch, setPrintMixBatchSearch] = useState('');
                const [printCardSearch, setPrintCardSearch] = useState('');
                const [printTemplateSearch, setPrintTemplateSearch] = useState('');
                const [printTemplateFormatFilter, setPrintTemplateFormatFilter] = useState('all');
                const [qrMoveEnabled, setQrMoveEnabled] = useState(true);
                const [qrDragPosition, setQrDragPosition] = useState(() => {
                    try {
                        const saved = JSON.parse(localStorage.getItem('tocaqui_print_qr_position_v1') || 'null');
                        return saved && Number.isFinite(saved.x) && Number.isFinite(saved.y) ? saved : null;
                    } catch { return null; }
                });
                const [qrDragDraft, setQrDragDraft] = useState(null);
                // Keep independent, unsaved adjustments for each design while editing the sheet.
                const [qrLayoutDrafts, setQrLayoutDrafts] = useState({});
                const qrDefaultLayout = useRef({position:qrDragPosition || {x:50,y:50}, size:printConfig.qrSizePx});
                const qrDragRef = useRef(null);
                const activeQrPosition = qrDragDraft || qrDragPosition;
                const clampQr = value => Math.min(90, Math.max(10, value));
                const saveQrPosition = position => {
                    const next = {x:clampQr(position.x), y:clampQr(position.y)};
                    setQrDragPosition(next);
                    if (printMixTemplateId) setQrLayoutDrafts(prev=>({...prev,[printMixTemplateId]:{...(prev[printMixTemplateId] || {}),position:next,size:printConfig.qrSizePx}}));
                    localStorage.setItem('tocaqui_print_qr_position_v1', JSON.stringify(next));
                    return next;
                };
                const nudgeQr = (dx,dy) => {
                    const current = qrDragPosition || {x:50,y:50};
                    saveQrPosition({x:current.x+dx,y:current.y+dy});
                };
                const updateQrDrag = event => {
                    const drag = qrDragRef.current;
                    if (!drag || event.pointerId !== drag.pointerId) return;
                    const rect = drag.card.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const x = clampQr(drag.start.x + (event.clientX-drag.startClientX)/rect.width*100);
                    const y = clampQr(drag.start.y + (event.clientY-drag.startClientY)/rect.height*100);
                    setQrDragDraft({x,y});
                };
                const finishQrDrag = event => {
                    const drag=qrDragRef.current;
                    if(!drag || event.pointerId!==drag.pointerId)return;
                    const rect=drag.card.getBoundingClientRect();
                    if(rect.width && rect.height) {
                        const x=clampQr(drag.start.x+(event.clientX-drag.startClientX)/rect.width*100);
                        const y=clampQr(drag.start.y+(event.clientY-drag.startClientY)/rect.height*100);
                        saveQrPosition({x,y});
                    }
                    setQrDragDraft(null);
                    qrDragRef.current=null;
                };

                const itemsPerPage = ({
                    'pvc-horizontal':10,
                    'pvc-vertical':10,
                    '10x15':2,
                    'magnet-horizontal':18,
                    'magnet-square':15
                })[printConfig.templateType] || 10;
                const printBatches = useMemo(() => [...new Map(qrs.map(q => {
                    const id=q.batchId || 'legacy';
                    return [id,{id,name:q.batchName || 'Tarjetas anteriores',productType:q.productType || 'pvc-horizontal'}];
                })).values()].map(batch=>({
                    ...batch,
                    total:qrs.filter(q=>(q.batchId||'legacy')===batch.id).length
                })), [qrs]);
                useEffect(()=>{
                    let locked='';
                    try{locked=sessionStorage.getItem('tocaqui_print_locked_batch_v1')||''}catch{}
                    if(locked && printBatches.some(batch=>batch.id===locked) && printBatchFilter!==locked){
                        setPrintBatchFilter(locked);
                        setPrintDirectPage(1);
                    }
                },[adminTab,printBatches.length]);
                useEffect(()=>{
                    if(printBatchFilter==='all'){
                        try{sessionStorage.removeItem('tocaqui_print_locked_batch_v1')}catch{}
                        return;
                    }
                    try{sessionStorage.setItem('tocaqui_print_locked_batch_v1',printBatchFilter)}catch{}
                    const allowed=new Set(qrs.filter(q=>(q.batchId||'legacy')===printBatchFilter).map(q=>q.id));
                    setSelectedQrIdsForSheet(prev=>prev.filter(id=>allowed.has(id)));
                },[printBatchFilter]);

                const filteredPrintBatches = useMemo(() => {
                    const term=printBatchSearch.trim().toLowerCase();
                    if(!term)return printBatches;
                    return printBatches.filter(batch=>[batch.name,batch.id].some(v=>String(v||'').toLowerCase().includes(term)));
                }, [printBatches,printBatchSearch]);
                const visiblePrintQrs = useMemo(() => {
                    const term=printDirectSearch.trim().toLowerCase();
                    return qrs.filter(q => {
                        const matchBatch=printBatchFilter === 'all' || (q.batchId || 'legacy') === printBatchFilter;
                        const matchTerm=!term || [cardNumber(q),q.businessName,q.batchName,q.batchId]
                            .some(v=>String(v||'').toLowerCase().includes(term));
                        return matchBatch && matchTerm;
                    });
                }, [qrs, printBatchFilter, printDirectSearch]);
                useEffect(()=>{setPrintDirectPage(1)},[printBatchFilter,printDirectSearch]);
                const printDirectPageCount=Math.max(1,Math.ceil(visiblePrintQrs.length/printDirectPageSize));
                const safePrintDirectPage=Math.min(printDirectPage,printDirectPageCount);
                const pagedPrintQrs=visiblePrintQrs.slice((safePrintDirectPage-1)*printDirectPageSize,safePrintDirectPage*printDirectPageSize);
                const selectedPrintBatch=printBatchFilter==='all'?null:printBatches.find(batch=>batch.id===printBatchFilter);
                const selectedMixBatch = printBatches.find(batch=>batch.id===printMixBatchId) || null;
                const mixBatchCards = useMemo(() => {
                    if(!selectedMixBatch) return [];
                    return qrs.filter(card=>(card.batchId||'legacy')===selectedMixBatch.id);
                }, [qrs, selectedMixBatch?.id]);
                const mixAssignedCardIds = useMemo(() => new Set(printComposition.map(entry=>entry.cardId)), [printComposition]);
                const mixAvailableCards = useMemo(() => mixBatchCards.filter(card=>!mixAssignedCardIds.has(card.id)), [mixBatchCards, mixAssignedCardIds]);

                const isPrintTemplateCompatible = (format, category) => format === '10x15' || format === category;
                const mixTemplates = useMemo(() => {
                    const term=printTemplateSearch.trim().toLowerCase();
                    const format=selectedMixBatch?.productType || printConfig.templateType;
                    return templates
                        .filter(t=>isPrintTemplateCompatible(format, t.category))
                        .filter(t=>!term || String(t.name||'').toLowerCase().includes(term) || String(t.category||'').toLowerCase().includes(term))
                        .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));
                }, [templates, printTemplateSearch, selectedMixBatch?.productType, printConfig.templateType]);

                const selectedPrintTemplate = templates.find(t=>t.id===printMixTemplateId)||null;
                useEffect(() => {
                    const tpl=templates.find(t=>t.id===printMixTemplateId);
                    if (!tpl) return;
                    const layout=qrLayoutDrafts[tpl.id] || tpl.printQrLayout || qrDefaultLayout.current;
                    setQrDragPosition(layout.position || qrDefaultLayout.current.position);
                    setPrintConfig(prev=>({...prev,qrSizePx:Number.isFinite(layout.size)?layout.size:qrDefaultLayout.current.size}));
                }, [printMixTemplateId]);
                const selectQrTemplate = tpl => {
                    if (!tpl || tpl.id===printMixTemplateId) return;
                    const layout=qrLayoutDrafts[tpl.id] || tpl.printQrLayout || qrDefaultLayout.current;
                    setQrDragPosition(layout.position || qrDefaultLayout.current.position);
                    setPrintConfig(prev=>({...prev,qrSizePx:Number.isFinite(layout.size)?layout.size:qrDefaultLayout.current.size}));
                    setPrintMixTemplateId(tpl.id);
                };
                const printFormatLabel = value =>
                    value==='pvc-horizontal' ? 'PVC horizontal' :
                    value==='pvc-vertical' ? 'PVC vertical' :
                    value==='10x15' ? 'Letrero 10×15' :
                    value==='magnet-horizontal' ? 'Imán 6×4 cm' :
                    value==='magnet-square' ? 'Imán 5×5 cm' :
                    'Formato';

                const chooseMixBatch = batchId => {
                    if(batchId===printMixBatchId) return;
                    if(printComposition.length) {
                        setPrintComposition([]);
                        showToast('Se cambió el lote base y se limpió la composición anterior.','info');
                    }
                    setPrintMixBatchId(batchId);
                    const batch=printBatches.find(item=>item.id===batchId);
                    if(batch) setPrintConfig(prev=>({...prev,templateType:batch.productType||prev.templateType}));
                    setPrintMixTemplateId('');
                    setPrintMixQty(1);
                };

                const choosePrintTemplate = tpl => {
                    if(selectedMixBatch && !isPrintTemplateCompatible(selectedMixBatch.productType, tpl.category)){
                        showToast('La plantilla debe usar el mismo formato físico del lote.','warning');
                        return;
                    }
                    setPrintConfig(prev=>({...prev,templateType:selectedMixBatch?.productType || tpl.category,selectedTemplateId:tpl.id}));
                    selectQrTemplate(tpl);
                    setPrintTemplatePickerOpen(false);
                    setPrintTemplateSearch('');
                    setPrintTemplateFormatFilter('all');
                };

                useEffect(() => {
                    if(!printMixBatchId || !printBatches.some(batch=>batch.id===printMixBatchId)){
                        const existingCard=qrs.find(card=>card.id===printComposition[0]?.cardId);
                        const existingBatch=existingCard ? printBatches.find(batch=>batch.id===(existingCard.batchId||'legacy')) : null;
                        const preferred=printBatchFilter!=='all' ? printBatches.find(batch=>batch.id===printBatchFilter) : null;
                        const first=existingBatch || preferred || printBatches.find(batch=>batch.id!=='legacy') || printBatches[0];
                        if(first){
                            setPrintMixBatchId(first.id);
                            setPrintConfig(prev=>({...prev,templateType:first.productType||prev.templateType}));
                        }
                    }
                }, [printBatches, printBatchFilter, printMixBatchId, qrs, printComposition]);

                useEffect(() => {
                    setPrintComposition(prev=>{
                        const seen=new Set();
                        const next=prev.filter(entry=>{
                            if(!entry?.cardId || seen.has(entry.cardId)) return false;
                            seen.add(entry.cardId);
                            return true;
                        });
                        return next.length===prev.length ? prev : next;
                    });
                }, []);

                useEffect(() => {
                    const format=selectedMixBatch?.productType || printConfig.templateType;
                    const compatible=templates.find(t=>t.id===printMixTemplateId && isPrintTemplateCompatible(format, t.category));
                    if(!compatible){
                        const first=templates.find(t=>t.category===format)
                            || templates.find(t=>isPrintTemplateCompatible(format, t.category));
                        setPrintMixTemplateId(first?.id || '');
                    }
                }, [templates, selectedMixBatch?.productType, printConfig.templateType, printMixTemplateId]);

                const compositionItems = useMemo(() => {
                    return printComposition.map(entry => {
                        const card = qrs.find(q => q.id === entry.cardId);
                        const tpl = templates.find(t => t.id === entry.templateId);
                        if (!card || !tpl || !isPrintTemplateCompatible(printConfig.templateType, tpl.category)) return null;
                        return {...card, _printEntryId:entry.id, _printTemplate:tpl};
                    }).filter(Boolean);
                }, [printComposition, qrs, templates, printConfig.templateType]);

                const selectedItems = useMemo(() => {
                    if (compositionItems.length) return compositionItems;
                    return qrs
                        .filter(q => selectedQrIdsForSheet.includes(q.id))
                        .filter(q => printBatchFilter==='all' || (q.batchId||'legacy')===printBatchFilter)
                        .map(q => {
                            const tpl = q.designTemplateId ? templates.find(t => t.id === q.designTemplateId) : null;
                            return tpl ? { ...q, _printTemplate:tpl } : q;
                        });
                }, [compositionItems, qrs, selectedQrIdsForSheet, templates, printBatchFilter]);
                printSelectionRef.current=selectedItems.map(item=>item.id);

                const compositionGroups = useMemo(() => {
                    const map = new Map();
                    printComposition.forEach(entry => {
                        const card=qrs.find(q=>q.id===entry.cardId);
                        const tpl=templates.find(t=>t.id===entry.templateId);
                        if(!card || !tpl || !isPrintTemplateCompatible(printConfig.templateType, tpl.category)) return;
                        const key=tpl.id;
                        const prev=map.get(key) || {key,tpl,cards:[],count:0};
                        prev.cards.push(card);
                        prev.count++;
                        map.set(key,prev);
                    });
                    return [...map.values()];
                }, [printComposition,qrs,templates,printConfig.templateType]);

                const addToPrintComposition = () => {
                    const tpl=templates.find(t=>t.id===printMixTemplateId);
                    if(!selectedMixBatch){showToast('Selecciona un lote base.','warning');return;}
                    if(!tpl){showToast('Selecciona una plantilla.','warning');return;}
                    if(!mixAvailableCards.length){showToast('Todas las tarjetas de este lote ya tienen diseño en la composición.','info');return;}
                    const qty=Math.max(1,Math.min(Number(printMixQty)||1,mixAvailableCards.length));
                    const stamp=Date.now().toString(36);
                    const entries=mixAvailableCards.slice(0,qty).map((card,idx)=>({
                        id:'PRINT-'+stamp+'-'+idx+'-'+Math.random().toString(36).slice(2,7),
                        cardId:card.id,
                        templateId:tpl.id
                    }));
                    setPrintComposition(prev=>[...prev,...entries]);
                    setPrintMixQty(1);
                    showToast(entries.length+' TAG único(s) asignado(s) a '+tpl.name+'.','success');
                };

                const removeOneComposition = templateId => {
                    setPrintComposition(prev=>{
                        const idx=[...prev].reverse().findIndex(x=>x.templateId===templateId);
                        if(idx<0)return prev;
                        const real=prev.length-1-idx;
                        return prev.filter((_,i)=>i!==real);
                    });
                };

                const addOneComposition = templateId => {
                    const tpl=templates.find(t=>t.id===templateId);
                    const used=new Set(printComposition.map(entry=>entry.cardId));
                    const next=mixBatchCards.find(card=>!used.has(card.id));
                    if(!tpl || !next){showToast('No quedan TAG libres en este lote.','info');return;}
                    setPrintComposition(prev=>[...prev,{
                        id:'PRINT-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),
                        cardId:next.id,
                        templateId:tpl.id
                    }]);
                };

                const pages = useMemo(() => {
                    const result = [];
                    for (let i = 0; i < selectedItems.length; i += itemsPerPage) {
                        result.push(selectedItems.slice(i, i + itemsPerPage));
                    }
                    return result;
                }, [selectedItems, itemsPerPage]);

                useEffect(() => {
                    selectedItems.forEach(item => {
                        const tagUrl = getBaseTagUrl(item.trackingCode);
                        generateQRBase64(tagUrl, 280).then(url => {
                            setQrCodeImages(prev => ({ ...prev, [item.id]: url }));
                        });
                    });
                }, [selectedItems]);

                const toggleSelectAll = () => {setSelectedQrIdsForSheet(visiblePrintQrs.map(q=>q.id));};
                const saveTemplateQrLayout = async () => {
                    const tpl=templates.find(t=>t.id===printMixTemplateId);
                    if(!tpl){showToast('Selecciona primero una plantilla en composición mixta.','warning');return;}
                    if(!qrDragPosition){showToast('Mueve o centra el QR antes de guardar su posición.','warning');return;}
                    const updated={...tpl,printQrLayout:{position:qrDragPosition,size:printConfig.qrSizePx},updatedAt:Date.now()};
                    const previousTemplates=templates;
                    const next=templates.map(t=>t.id===tpl.id?updated:t);
                    last.current={...last.current,templates:next};
                    setTemplates(next);
                    setQrLayoutDrafts(prev=>({...prev,[tpl.id]:updated.printQrLayout}));
                    showToast('Posición aplicada. Guardando…','info');
                    try {
                        if(!workshopSession) throw new Error('Inicia sesión para guardar la plantilla.');
                        const result=await workshopApi({action:'saveOne',session:workshopSession,kind:'templates',item:updated});
                        const saved=result.item||updated;
                        const confirmed=next.map(t=>t.id===saved.id?saved:t);
                        last.current={...last.current,templates:confirmed};
                        setTemplates(confirmed);
                        showToast('QR guardado · posición y tamaño confirmados en '+tpl.name+'.','success');
                    } catch(e){
                        last.current={...last.current,templates:previousTemplates};
                        setTemplates(previousTemplates);
                        showToast('No se pudo confirmar el QR; se restauró la posición anterior: '+(e.message||e),'error');
                    }
                };

                const renderCutGuides = () => {
                    if(!showCutGuides) return null;
                    const g=getCutGuideGeometry(printConfig.templateType);
                    const lines=[...g.xs.map((x,i)=><line key={'x'+i} x1={x} y1="0" x2={x} y2={g.h}/>),...g.ys.map((y,i)=><line key={'y'+i} x1="0" y1={y} x2={g.w} y2={y}/>)];
                    return <svg aria-hidden="true" className="sheet-cut-guides" viewBox={`0 0 ${g.w} ${g.h}`} preserveAspectRatio="none"><g fill="none" stroke="white" strokeWidth="0.35">{lines}</g><g fill="none" stroke="#111827" strokeWidth="0.12">{lines}</g></svg>;
                };

                const renderCardContent = (item, side = printConfig.activeSide) => {
                    const qrImg = qrCodeImages[item.id] || '';
                    const itemTemplate = item._printTemplate || null;
                    const editingTemplate = itemTemplate && itemTemplate.id===printMixTemplateId;
                    const otherLayout = itemTemplate ? (qrLayoutDrafts[itemTemplate.id] || itemTemplate.printQrLayout || qrDefaultLayout.current) : null;
                    const itemQrPosition = editingTemplate || !itemTemplate ? activeQrPosition : (otherLayout.position || qrDefaultLayout.current.position);
                    const itemQrSize = editingTemplate || !itemTemplate ? printConfig.qrSizePx : (otherLayout.size ?? qrDefaultLayout.current.size);
                    const effectiveTheme = itemTemplate?.defaultTheme || printConfig.theme;

                    const alignY = printConfig.qrPosY === 'top' ? 'items-start pt-2' : printConfig.qrPosY === 'bottom' ? 'items-end pb-2' : 'items-center';
                    const alignX = printConfig.qrPosX === 'left' ? 'justify-start pl-2' : printConfig.qrPosX === 'right' ? 'justify-end pr-2' : 'justify-center';

                    const cardClass =
                        printConfig.templateType === 'pvc-vertical' ? "card-pvc-vertical p-3 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'pvc-horizontal' ? "card-pvc-horizontal p-3 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'magnet-horizontal' ? "card-magnet-horizontal p-2 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'magnet-square' ? "card-magnet-square p-2 flex flex-col justify-between mx-auto" :
                        "card-poster-10x15 p-5 flex flex-col justify-between mx-auto";

                    const bgToUse = itemTemplate
                        ? (side === 'front' ? itemTemplate.frontBg : itemTemplate.backBg)
                        : (side === 'front' ? printConfig.customFrontBg : printConfig.customBackBg);

                    return (
                        <div
                            key={item._printEntryId || item.id}
                            className={cardClass}
                            style={{
                                background: bgToUse
                                    ? '#ffffff'
                                    : effectiveTheme === 'gold-luxury'
                                    ? 'linear-gradient(135deg, #0f172a 0%, #312e81 100%)'
                                    : effectiveTheme === 'clean-white'
                                    ? '#ffffff'
                                    : 'linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%)',
                                color: effectiveTheme === 'clean-white' ? '#0f172a' : '#ffffff'
                            }}
                        >
                            {bgToUse && <div aria-hidden="true" className="print-artwork-img pointer-events-none" style={{'--artwork-bleed': artworkBleedMm+'mm','--artwork-width-scale': artworkWidthPct/100}}><img src={bgToUse} alt="" /></div>}
                            {side === 'back' && <div className="flex justify-between items-center text-[9px] font-bold uppercase tracking-wider">
                                <span className="truncate max-w-[120px]">{item.businessName || 'NFC CARD'}</span>
                                <i className="fa-brands fa-nfc-symbol text-xs text-blue-400"></i>
                            </div>}

                            {/* Only show QR Code on Front side */}
                            {side === 'front' && (
                                <div className={itemQrPosition ? 'absolute inset-0 pointer-events-none' : `flex-1 flex ${alignY} ${alignX} my-1`}>
                                    <div
                                        onPointerDown={event => {
                                            if (!qrMoveEnabled || !event.currentTarget.closest('.a4-sheet-preview')) return;
                                            event.preventDefault();
                                            const card = event.currentTarget.closest('.card-pvc-vertical, .card-pvc-horizontal, .card-poster-10x15, .card-magnet-horizontal, .card-magnet-square');
                                            if (!card) return;
                                            const rect = card.getBoundingClientRect();
                                            const elementRect = event.currentTarget.getBoundingClientRect();
                                            if(itemTemplate && !editingTemplate) selectQrTemplate(itemTemplate);
                                            const start = itemQrPosition || {x: ((elementRect.left+elementRect.width/2-rect.left)/rect.width)*100, y: ((elementRect.top+elementRect.height/2-rect.top)/rect.height)*100};
                                            qrDragRef.current = {card, pointerId:event.pointerId, start, startClientX:event.clientX, startClientY:event.clientY};
                                            event.currentTarget.setPointerCapture(event.pointerId);
                                        }}
                                        onPointerMove={event => { if (qrDragRef.current) { event.preventDefault(); updateQrDrag(event); } }}
                                        onPointerUp={finishQrDrag}
                                        onPointerCancel={() => { qrDragRef.current = null; setQrDragDraft(null); }}
                                        style={itemQrPosition ? { position: 'absolute', left: itemQrPosition.x + '%', top: itemQrPosition.y + '%', transform: 'translate(-50%, -50%)', pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default', zIndex: 5 } : { pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default' }}
                                        className={`transition-all ${
                                            printConfig.qrBgStyle === 'white-box' ? 'bg-white rounded-xl shadow-md p-1.5' :
                                            printConfig.qrBgStyle === 'glass' ? 'bg-white/25 backdrop-blur-md border border-white/30 rounded-xl p-1.5 shadow-lg' :
                                            printConfig.qrBgStyle === 'dark-box' ? 'bg-slate-900/90 text-white border border-slate-700 rounded-xl p-1.5 shadow-md' :
                                            'bg-transparent p-0'
                                        }`}
                                    >
                                        <img
                                            src={qrImg}
                                            alt="QR Code"
                                            style={{ width: `${itemQrSize}px`, height: `${itemQrSize}px` }}
                                            className="object-contain block"
                                        />
                                    </div>
                                </div>
                            )}

                            {side === 'back' && (
                                <div className="flex-1 flex items-center justify-center text-center p-2">
                                    <span className="text-[10px] font-semibold opacity-70 break-words">{item.businessName || 'TOCAQUI · Tarjeta NFC / QR'}</span>
                                </div>
                            )}

                            {side === 'back' && <div className="flex justify-between items-end text-[8px] font-mono">
                                <span className="text-[7px] truncate max-w-[90px]">{item.businessAddress || 'TOCAQUI'}</span>
                            </div>}
                            {(printConfig.idPosition === 'back' ? side === 'back' : side === 'front') && printConfig.idPosition !== 'hidden' && (
                                <span className={`absolute z-10 font-mono font-bold ${printConfig.idOpacity} ${printConfig.idFontSize}`}
                                    style={{
                                        ...(printConfig.idPosition === 'top-left' ? {top:'5%',left:'5%'} :
                                            printConfig.idPosition === 'top-right' ? {top:'5%',right:'5%'} :
                                            printConfig.idPosition === 'bottom-left' ? {bottom:'5%',left:'5%'} :
                                            printConfig.idPosition === 'top-center' ? {top:'5%',left:'50%',transform:'translateX(-50%)'} :
                                            printConfig.idPosition === 'bottom-center' ? {bottom:'5%',left:'50%',transform:'translateX(-50%)'} :
                                            {bottom:'5%',right:'5%'})
                                    }}>{cardNumber(item)}</span>
                            )}
                        </div>
                    );
                };

                return (
                    <div className="space-y-6">
                        <BackToDashboardButton />

                        <div className="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">Estudio de Impresión Masiva en Hoja A4</h1>
                                <p className="text-slate-400 text-sm mt-1">Imprime exactamente la cara seleccionada. Para dúplex, imprime Anverso y luego Reverso por separado.</p>
                            </div>
                            <button
                                onClick={printA4Sheets}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-3 rounded-xl text-xs shadow-lg shadow-emerald-600/25 flex items-center gap-2"
                            >
                                <i className="fa-solid fa-print text-sm"></i> Imprimir {printConfig.activeSide==='front'?'ANVERSO':'REVERSO'} · {pages.length} hoja{pages.length===1?'':'s'}
                            </button>
                        </div>

                        <div className="tq-print-controls grid grid-cols-1 lg:grid-cols-12 gap-6 no-print">
                            {/* Controls */}
                            <div className="lg:col-span-5 space-y-5">
                                {/* Side Selector (Anverso / Reverso) */}
                                <div className="glass-panel p-4 rounded-2xl flex items-center justify-between border border-blue-500/30">
                                    <span className="text-xs font-bold uppercase text-slate-300">Vista de Impresión:</span>
                                    <div className="bg-slate-900 p-1 rounded-xl flex items-center border border-slate-800">
                                        <button
                                            onClick={() => setPrintConfig(prev => ({ ...prev, activeSide: 'front' }))}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${printConfig.activeSide === 'front' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            ANVERSO (Frente)
                                        </button>
                                        <button
                                            onClick={() => setPrintConfig(prev => ({ ...prev, activeSide: 'back' }))}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${printConfig.activeSide === 'back' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}
                                        >
                                            REVERSO (Atrás)
                                        </button>
                                    </div>
                                </div>

                                <div className="glass-panel p-5 rounded-2xl space-y-4">
                                    <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider">Control & Estilo del Código QR</h3>
                                    <div className="space-y-2 border-b border-slate-800 pb-3">
                                        <label htmlFor="print-format" className="block text-xs font-semibold text-slate-300">Formato de impresión</label>
                                        <div className="tq-choice-table ">
                                            {[
                                                {id:'pvc-horizontal',icon:'fa-address-card',title:'PVC horizontal',desc:'85.6×54 mm · 10/A4'},
                                                {id:'pvc-vertical',icon:'fa-id-card',title:'PVC vertical',desc:'54×85.6 mm · 10/A4'},
                                                {id:'10x15',icon:'fa-image',title:'Letrero 10 × 15',desc:'100×150 mm · 2/A4'},
                                                {id:'magnet-horizontal',icon:'fa-magnet',title:'Imán horizontal',desc:'60×40 mm · 18/A4'},
                                                {id:'magnet-square',icon:'fa-square',title:'Imán cuadrado',desc:'50×50 mm · 15/A4'}
                                            ].map(format => (
                                                <button key={format.id} type="button" aria-pressed={printConfig.templateType===format.id}
                                                    onClick={() => { if (format.id!==printConfig.templateType && printComposition.length) setPrintComposition([]); setPrintConfig(prev => ({...prev,templateType:format.id})); }}
                                                    className={`min-w-0 rounded-xl border p-3 text-left transition-colors ${printConfig.templateType===format.id?'bg-blue-600/20 border-blue-400 text-white':'bg-slate-900/70 border-slate-700 text-slate-300 hover:border-slate-500'}`}>
                                                    <i className={`fa-solid ${format.icon} text-blue-400 mr-2`}></i><span className="text-xs font-bold">{format.title}</span>
                                                    <span className="block text-[10px] text-slate-400 mt-1">{format.desc}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-2 border-b border-slate-800 pb-3">
                                        <label className="block text-xs font-semibold text-slate-300">Posición del identificador de tarjeta (TAG)</label>
                                        <div className="tq-tag-grid">
                                            {[
                                                ['top-left','Arriba izquierda'],['top-center','Arriba centro'],['top-right','Arriba derecha'],
                                                ['bottom-left','Abajo izquierda'],['bottom-center','Abajo centro'],['bottom-right','Abajo derecha'],
                                                ['back','Solo reverso'],['hidden','Ocultar']
                                            ].map(([value,label]) => <button key={value} type="button" aria-pressed={printConfig.idPosition===value}
                                                onClick={() => setPrintConfig(prev=>({...prev,idPosition:value}))}
                                                className={`rounded-lg border px-2 py-2 text-[11px] font-semibold ${printConfig.idPosition===value?'border-blue-400 bg-blue-600/20 text-white':'border-slate-700 bg-slate-900 text-slate-400'}`}>{label}</button>)}
                                        </div>
                                        <p className="text-[10px] text-slate-500">Este código identifica cada tarjeta. El nombre del lote se administra por separado.</p>
                                    </div>
                                    <div className="pt-4 border-t border-slate-800">
                                        <label className="block text-xs font-semibold text-slate-300 mb-2">
                                            Plantilla o Imagen Personalizada
                                        </label>

                                        <div className="flex items-center gap-3">
                                            <label className="flex-1 min-w-0 bg-slate-800/80 border border-slate-700 hover:border-indigo-500 rounded-xl px-3 py-2 text-xs text-slate-300 cursor-pointer flex items-center justify-between gap-3 transition-colors">
                                                <span className="truncate">
                                                    {customTemplateFileName[printConfig.activeSide] || 'Seleccionar archivo o foto...'}
                                                </span>
                                                <span className="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold flex-shrink-0">
                                                    Examinar
                                                </span>
                                                <input
                                                    type="file"
                                                    accept="image/png,image/jpeg,image/webp"
                                                    className="hidden"
                                                    onChange={async (e) => {
                                                        const file = e.target.files?.[0];
                                                        if (!file) return;

                                                        const side = printConfig.activeSide;
                                                        const targetSize = {
                                                            'pvc-horizontal':[1712,1080],
                                                            'pvc-vertical':[1080,1712],
                                                            '10x15':[1200,1800],
                                                            'magnet-horizontal':[1500,1000],
                                                            'magnet-square':[1200,1200]
                                                        }[printConfig.templateType] || [1712,1080];
                                                        const [targetWidth,targetHeight] = targetSize;

                                                        try {
                                                            const adaptedImage = await compressImageToDataURL(file, targetWidth, targetHeight, 0.92, artworkFitMode);
                                                            setPrintConfig(prev => ({
                                                                ...prev,
                                                                theme: 'custom',
                                                                ...(side === 'front'
                                                                    ? { customFrontBg: adaptedImage }
                                                                    : { customBackBg: adaptedImage })
                                                            }));
                                                            setCustomTemplateFileName(prev => ({ ...prev, [side]: file.name }));
                                                            showToast(`Imagen aplicada al ${side === 'front' ? 'Anverso' : 'Reverso'}.`, 'success');
                                                        } catch (err) {
                                                            console.error('Error adapting custom print template', err);
                                                            showToast('No se pudo procesar la imagen seleccionada.', 'warning');
                                                        } finally {
                                                            e.target.value = '';
                                                        }
                                                    }}
                                                />
                                            </label>

                                            {(printConfig.activeSide === 'front' ? printConfig.customFrontBg : printConfig.customBackBg) && (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const side = printConfig.activeSide;
                                                        setPrintConfig(prev => side === 'front'
                                                            ? { ...prev, customFrontBg: '' }
                                                            : { ...prev, customBackBg: '' });
                                                        setCustomTemplateFileName(prev => ({ ...prev, [side]: '' }));
                                                        showToast('Imagen personalizada quitada.', 'info');
                                                    }}
                                                    className="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 px-3 py-2 rounded-xl text-xs font-semibold transition-colors flex-shrink-0"
                                                >
                                                    Quitar
                                                </button>
                                            )}
                                        </div>

                                        <p className="text-[10px] text-slate-500 mt-2 leading-relaxed">
                                            La imagen se adapta al fondo de las tarjetas del {printConfig.activeSide === 'front' ? 'Anverso' : 'Reverso'} sin modificar QR, IDs ni configuración de impresión.
                                        </p>
                                    </div>
                                </div>

                                <div className="glass-panel p-3.5 sm:p-4 rounded-2xl space-y-3 border border-cyan-500/20 relative">
                                    <div className="flex items-center justify-between gap-3">
                                        <div className="min-w-0">
                                            <h3 className="text-xs font-bold text-cyan-300 uppercase"><i className="fa-solid fa-layer-group mr-2"></i>Distribuir lote por diseños</h3>
                                            <p className="text-[10px] text-slate-500 mt-1">Asigna plantillas distintas a TAG únicos del mismo lote: Google, Catálogo, WiFi, redes u otros.</p>
                                        </div>
                                        <div className="shrink-0 text-right">
                                            <div className="text-lg font-bold text-white">{compositionItems.length}<span className="text-xs text-slate-500">/{mixBatchCards.length||0}</span></div>
                                            <div className="text-[9px] text-slate-500">{compositionItems.length ? Math.ceil(compositionItems.length/itemsPerPage) : 0} hoja(s)</div>
                                        </div>
                                    </div>

                                    <div className="h-1.5 rounded-full bg-slate-800 overflow-hidden">
                                        <div className="h-full bg-cyan-500 transition-all" style={{width:(mixBatchCards.length?Math.min(100,(compositionItems.length/mixBatchCards.length)*100):0)+'%'}}></div>
                                    </div>

                                    <div className="grid sm:grid-cols-[1fr_1.25fr] gap-2">
                                        <div className="block">
                                            <span className="block text-[9px] uppercase tracking-wider text-slate-500 mb-1">1 · Lote base</span>
                                            <button type="button" onClick={()=>{setPrintMixBatchPickerOpen(v=>!v);setPrintTemplatePickerOpen(false);setPrintMixBatchSearch('')}} className={'w-full min-h-[42px] rounded-xl border px-3 py-2 text-left flex items-center gap-2 '+(printMixBatchPickerOpen?'border-cyan-400 bg-cyan-500/10':'border-slate-700 bg-slate-950/45')}>

            // 7. CLIENT PORTAL VIEW

            const ClientPortalView = () => {

                        <section className="glass-panel rounded-2xl border border-slate-800 overflow-hidden">

                        <section className="grid sm:grid-cols-3 gap-2.5">

                            <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-3"><div className="text-[9px] uppercase text-slate-500">2 · Destino dinámico</div><p className="text-[11px] text-slate-300 mt-1">La URL puede cambiar sin volver a imprimir ni grabar.</p></div>

                        </section>

                        {editingQr && (
                            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-md rounded-2xl p-4 sm:p-5 border border-slate-700 space-y-4">
                                    <div className="flex items-start justify-between gap-3">
                                        <div><h3 className="font-bold text-white">Cambiar destino</h3><p className="text-[10px] text-slate-500 mt-1">El QR/NFC no cambia; solo se actualiza la URL.</p></div>

                                        <button type="submit" className="w-full min-h-[44px] bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">Guardar destino</button>

            };

            // Local, approximate Places usage: counts requests made by this browser only.
            const PLACES_USAGE_STORAGE = 'tocaqui_places_usage_v1';
            const currentPlacesMonth = () => new Date().toISOString().slice(0, 7);
            const readPlacesUsage = () => {
                const month = currentPlacesMonth();
                try {
                    const stored = JSON.parse(localStorage.getItem(PLACES_USAGE_STORAGE) || '{}');
                    if (stored.month === month) return { month, requests: Number(stored.requests) || 0, successes: Number(stored.successes) || 0, errors: Number(stored.errors) || 0, selections: Number(stored.selections) || 0 };
                } catch (e) {}
                return { month, requests: 0, successes: 0, errors: 0, selections: 0 };
            };
            const recordPlacesUsage = (type) => {
                try {
                    const next = readPlacesUsage();
                    if (type === 'request') next.requests++;
                    if (type === 'success') next.successes++;
                    if (type === 'error') next.errors++;
                    if (type === 'selection') next.selections++;
                    localStorage.setItem(PLACES_USAGE_STORAGE, JSON.stringify(next));
                    window.dispatchEvent(new Event('tocaqui-places-usage-updated'));
                } catch (e) {}
            };

            // 8. SETTINGS VIEW
            const SettingsView = () => {
                const [pinInput, setPinInput] = useState('');
                const [oldPinInput,setOldPinInput]=useState('');
                const [placesUsage, setPlacesUsage] = useState(readPlacesUsage);
                const [authorizedDevices, setAuthorizedDevices] = useState([]);
                const [currentDeviceId, setCurrentDeviceId] = useState('');
                const [devicesLoading, setDevicesLoading] = useState(false);
                const [deviceActionBusy, setDeviceActionBusy] = useState(false);
                const [pairingInfo, setPairingInfo] = useState(null);
                const [showRevokedDevices, setShowRevokedDevices] = useState(false);
                const [googleCloudBusy, setGoogleCloudBusy] = useState(false);
                const [googleCloudMessage, setGoogleCloudMessage] = useState('');
                const [cloudProjectInput, setCloudProjectInput] = useState(googleCloudConfig.projectId || '');
                const [cloudOAuthInput, setCloudOAuthInput] = useState(googleCloudConfig.oauthClientId || driveConfig.clientId || '');
                useEffect(()=>{
                    if(googleCloudConfig.projectId)setCloudProjectInput(googleCloudConfig.projectId);
                    if(googleCloudConfig.oauthClientId)setCloudOAuthInput(googleCloudConfig.oauthClientId);
                },[googleCloudConfig.projectId,googleCloudConfig.oauthClientId]);
                useEffect(() => {
                    const refresh = () => setPlacesUsage(readPlacesUsage());
                    window.addEventListener('tocaqui-places-usage-updated', refresh);
                    return () => window.removeEventListener('tocaqui-places-usage-updated', refresh);
                }, []);


                const saveSettings = async () => {
 try{
 if(pinInput||oldPinInput){
 if(!/^[0-9]{4}$/.test(pinInput)||!/^[0-9]{4}$/.test(oldPinInput))throw new Error('Ingresa PIN actual y nuevo PIN de cuatro dígitos');
 await workshopApi({action:'changePin',session:workshopSession,currentPin:oldPinInput,newPin:pinInput});
 setMasterPin(pinInput);localStorage.removeItem('nfc_master_pin_v6');setPinInput('');setOldPinInput('');
 showToast('PIN actualizado en Supabase.','success');
 }
 }catch(e){showToast(e.message,'error')}
 };

                const loadAuthorizedDevices = async () => {
                    if (!workshopSession) return;
                    setDevicesLoading(true);
                    try {
                        const result = await workshopApi({ action:'devices', session:workshopSession });
                        setAuthorizedDevices(Array.isArray(result.devices) ? result.devices : []);
                        setCurrentDeviceId(result.currentDeviceId || '');
                    } catch (e) {
                        showToast(e.message || 'No se pudieron cargar los equipos.', 'error');
                    } finally {
                        setDevicesLoading(false);
                    }
                };

                useEffect(() => {
                    if (cloudReady && workshopSession) void loadAuthorizedDevices();
                }, [cloudReady, workshopSession]);

                const generateDevicePairing = async () => {
                    if (deviceActionBusy) return;
                    setDeviceActionBusy(true);
                    try {
                        const result = await workshopApi({ action:'createPairing', session:workshopSession });
                        if (!result.code || !result.pairingUrl) throw new Error('El servidor no devolvió la clave de vinculación.');
                        const qrImage = await generateQRBase64(result.pairingUrl, 360);
                        setPairingInfo({ code:result.code, url:result.pairingUrl, expiresAt:result.expiresAt, qrImage });
                    } catch (e) {
                        showToast(e.message || 'No se pudo generar el acceso.', 'error');
                    } finally {
                        setDeviceActionBusy(false);
                    }
                };

                const revokeAuthorizedDevice = async (deviceId) => {
                    if (deviceActionBusy || deviceId === currentDeviceId) return;
                    setDeviceActionBusy(true);
                    try {
                        await workshopApi({ action:'revokeDevice', session:workshopSession, deviceId });
                        await loadAuthorizedDevices();
                        showToast('Equipo revocado. Sus sesiones quedaron cerradas.', 'success');
                    } catch (e) {
                        showToast(e.message || 'No se pudo revocar el equipo.', 'error');
                    } finally {
                        setDeviceActionBusy(false);
                    }
                };

                const copyDeviceAccess = async (value, label) => {
                    try {
                        await navigator.clipboard.writeText(value);
                        showToast(label + ' copiado.', 'success');
                    } catch {
                        showToast('No se pudo copiar automáticamente.', 'info');
                    }
                };

                const shareDeviceAccess = async () => {
                    if (!pairingInfo?.url) return;
                    const text = 'Acceso temporal TOCAQUI. Abre este enlace para vincular tu navegador. Luego ingresa el PIN de 4 dígitos.';
                    try {
                        if (navigator.share) await navigator.share({ title:'Vincular equipo TOCAQUI', text, url:pairingInfo.url });
                        else await copyDeviceAccess(pairingInfo.url, 'Enlace de vinculación');
                    } catch (e) {
                        if (e?.name !== 'AbortError') showToast('No se pudo compartir el acceso.', 'error');
                    }
                };

                const activeDevices = authorizedDevices.filter(device => !device.revoked_at);
                const revokedDevices = authorizedDevices.filter(device => !!device.revoked_at);
                const visibleDevices = showRevokedDevices ? revokedDevices : activeDevices;

                const saveGoogleCloudBootstrap = async () => {
                    const projectId = cloudProjectInput.trim();
                    const oauthClientId = cloudOAuthInput.trim();
                    if (!projectId || !oauthClientId) {
                        setGoogleCloudMessage('Completa Project ID y OAuth Client ID.');
                        return false;
                    }
                    setGoogleCloudBusy(true);
                    try{
                        await workshopApi({action:'googleCloudConfigSet',session:workshopSession,projectId,oauthClientId});
                        setGoogleCloudConfig(prev => ({ ...prev, projectId, oauthClientId, configured:true }));
                        setGoogleCloudMessage('Configuración central guardada. Este proyecto ya queda disponible en todos tus equipos autorizados.');
                        return true;
                    }catch(e){
                        setGoogleCloudMessage(e.message||'No se pudo guardar la configuración central.');
                        return false;
                    }finally{
                        setGoogleCloudBusy(false);
                    }
                };

                const getGoogleCloudToken = async () => {
                    const projectId = cloudProjectInput.trim() || googleCloudConfig.projectId;
                    const oauthClientId = cloudOAuthInput.trim() || googleCloudConfig.oauthClientId;
                    if (!projectId || !oauthClientId) throw new Error('Guarda Project ID y OAuth Client ID primero.');
                    const cached = window.__tocaquiGoogleCloudToken;
                    if (cached?.accessToken && cached.expiresAt > Date.now() + 60000) return cached.accessToken;
                    if (!window.google?.accounts?.oauth2) throw new Error('Google Identity Services todavía no está disponible. Recarga la página.');
                    const token = await new Promise((resolve,reject)=>{
                        const client = window.google.accounts.oauth2.initTokenClient({
                            client_id: oauthClientId,
                            scope: 'https://www.googleapis.com/auth/cloud-platform',
                            callback: response => {
                                if (response?.error || !response?.access_token) reject(new Error(response?.error_description || response?.error || 'Google no entregó autorización.'));
                                else resolve(response);
                            }
                        });
                        client.requestAccessToken({ prompt:'consent' });
                    });
                    window.__tocaquiGoogleCloudToken = {
                        accessToken: token.access_token,
                        expiresAt: Date.now() + Math.max(300, Number(token.expires_in || 3600)) * 1000
                    };
                    return token.access_token;
                };

                const googleCloudFetch = async (url, token, options={}) => {
                    const response = await fetch(url, {
                        ...options,
                        headers: {
                            ...(options.body ? {'Content-Type':'application/json'} : {}),
                            ...(options.headers || {}),
                            Authorization: 'Bearer ' + token
                        }
                    });
                    const text = await response.text();
                    let data = {};
                    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw:text }; }
                    if (!response.ok) throw new Error(data?.error?.message || data?.message || ('Google Cloud respondió ' + response.status));
                    return data;
                };

                const waitGoogleOperation = async (baseUrl, operationName, token) => {
                    if (!operationName) return {};
                    for (let attempt=0; attempt<30; attempt++) {
                        const result = await googleCloudFetch(baseUrl + '/' + operationName, token);
                        if (result.done) {
                            if (result.error) throw new Error(result.error.message || 'La operación de Google Cloud falló.');
                            return result.response || result;
                        }
                        await new Promise(resolve => setTimeout(resolve, 700));
                    }
                    throw new Error('Google Cloud aún está procesando la operación. Intenta actualizar en unos segundos.');
                };

                const enableGoogleService = async (projectId, service, token) => {
                    const result = await googleCloudFetch(
                        'https://serviceusage.googleapis.com/v1/projects/' + encodeURIComponent(projectId) + '/services/' + encodeURIComponent(service) + ':enable',
                        token,
                        { method:'POST', body:'{}' }
                    );
                    if (result.name) await waitGoogleOperation('https://serviceusage.googleapis.com/v1', result.name, token);
                };

                const refreshGoogleCloudKeys = async () => {
                    if (googleCloudBusy) return;
                    setGoogleCloudBusy(true);
                    setGoogleCloudMessage('Consultando claves de Google Cloud…');
                    try {
                        const projectId = cloudProjectInput.trim() || googleCloudConfig.projectId;
                        const token = await getGoogleCloudToken();
                        const result = await workshopApi({action:'googleCloudListKeys',session:workshopSession,accessToken:token,projectId});
                        setGoogleCloudKeys(Array.isArray(result.keys) ? result.keys : []);
                        setGoogleCloudMessage('Claves sincronizadas con Google Cloud.');
                    } catch (e) {
                        setGoogleCloudMessage(e.message || 'No se pudieron cargar las claves.');
                    } finally {
                        setGoogleCloudBusy(false);
                    }
                };

                const createGoogleCloudKey = async () => {
                    if (googleCloudBusy) return;
                    setGoogleCloudBusy(true);
                    setGoogleCloudMessage('Preparando Google Cloud…');
                    try {
                        const projectId = cloudProjectInput.trim() || googleCloudConfig.projectId;
                        const oauthClientId = cloudOAuthInput.trim() || googleCloudConfig.oauthClientId;
                        if (!projectId || !oauthClientId) throw new Error('Completa y guarda Project ID y OAuth Client ID primero.');
                        const token = await getGoogleCloudToken();
                        setGoogleCloudMessage('Habilitando APIs y creando clave restringida…');
                        const result = await workshopApi({action:'googleCloudCreateKey',session:workshopSession,accessToken:token,projectId});
                        if (!result.configured || !result.keyName) throw new Error('Google no confirmó la nueva clave.');
                        setGoogleCloudKeys(Array.isArray(result.keys) ? result.keys : []);
                        setPlacesBackendStatus({configured:true,loading:false,updatedAt:new Date().toISOString()});
                        setGoogleCloudConfig(prev => ({...prev, projectId, oauthClientId, configured:true, activeKeyName:result.keyName, lastCreatedAt:new Date().toISOString()}));
                        setGoogleCloudMessage('Google Places quedó conectado al backend de TOCAQUI.');
                    } catch (e) {
                        setGoogleCloudMessage(e.message || 'No se pudo crear la clave.');
                        setGoogleCloudBusy(false);
                    }
                };

                const useGoogleCloudKey = async key => {
                    if (googleCloudBusy || !key?.name) return;
                    setGoogleCloudBusy(true);
                    setGoogleCloudMessage('Aplicando clave seleccionada…');

                                <section className="rounded-2xl border border-amber-500/20 bg-amber-500/5 p-4">
                                    <div className="flex items-center gap-3 mb-3">

                                        <div><h4 className="text-sm font-bold text-white">Autorizar y guardar</h4><p className="text-[11px] text-slate-500">Confirma el cambio con el PIN del taller.</p></div>
                                    </div>
                                    {!deviceCredential&&(
                                        <div className="mb-3 rounded-xl border border-blue-500/25 bg-blue-500/10 p-3 space-y-2">
