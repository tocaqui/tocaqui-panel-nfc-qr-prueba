                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        if (fitMode === 'cover' || fitMode === 'contain') {
                            if (targetWidth > targetHeight && img.height > img.width) {
                                const rotated = document.createElement('canvas');
                                rotated.width = img.height; rotated.height = img.width;
                                const rc = rotated.getContext('2d');
                                rc.translate(rotated.width / 2, rotated.height / 2); rc.rotate(-Math.PI / 2);
                                rc.drawImage(img, -img.width / 2, -img.height / 2);

                        }

                    const analyticsVerify = await workshopApi({action:'analytics',session:workshopSession});
                    if(Number(analyticsVerify.totalScans||0)!==0 || Number(analyticsVerify.totalActivations||0)!==0) {
                        throw new Error('La analítica todavía conserva eventos antiguos.');
                    }

                    last.current={qrs:[],clients:[],templates:[]};
                    setQrs([]);
                    setClients([]);
                    setTemplates([]);
                    setSelectedQrIdsForSheet([]);
                    setPrintComposition([]);
                    setPrintMixCardId('');
                    setPrintMixTemplateId('');
                    setTemplateDraft({ name:'', category:'pvc-horizontal', frontBg:'', backBg:'', frontName:'', backName:'' });
                    setTemplateModal({ open:false, isEditing:false, data:null });
                    setPrintConfig(prev=>({...prev,selectedTemplateId:null,customFrontBg:'',customBackBg:'',theme:'dark-neon'}));
                    setServerAnalytics({scans:0,activations:0,perCard:{},perClient:{},perBusiness:{},updatedAt:new Date().toISOString()});

                    ['nfc_qrs_v6','nfc_clients_v6','nfc_templates_v6','tocaqui_print_composition_v1'].forEach(key=>localStorage.removeItem(key));

                    setResetOpen(false);
                    setResetConfirmText('');
                    showToast('TOCAQUI quedó vacío de datos operativos. Configuración, PIN y equipos autorizados se conservaron.', 'success');
                } catch(err) {
                    setCloudError('Reinicio incompleto: '+err.message);
                    showToast('No se completó el reinicio: '+err.message,'error');
                } finally {setResetBusy(false);}
            };
                        const showToast = (msg, type = 'info') => {
                setToast({ show: true, msg, type });
                setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3500);
            };

            // El número visible se asigna en Supabase; el TAG original permanece como destino QR/NFC.
            const cardNumber = card => card.serialNumber || card.trackingCode || card.id;
            const createBatch = async (count, batchName = '', productType = 'pvc-horizontal') => {
                if (!cloudReady || !initialized.current) { showToast('Ingresa tu PIN para generar tarjetas.', 'error'); return null; }
                if (!Number.isInteger(count) || count < 1 || count > 500) { showToast('Cantidad inválida (1 a 500).', 'error'); return null; }
                const batchId = 'LOTE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + crypto.randomUUID().slice(0,8).toUpperCase();
                const existing = new Set(qrs.map(q => q.id));
                const newItems = Array.from({length:count}, () => {
                    let code;
                    do { code = 'TAG-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2,'0')).join('').toUpperCase(); } while(existing.has(code));
                    existing.add(code);
                    return { id:code, trackingCode:code, batchId, batchName:(batchName || 'Lote sin nombre').trim().slice(0,80), productType,
                        status:'pending', clientId:null, functionType:null, placeId:null, businessName:null, businessAddress:null,
                        dynamicUrl:'', createdAt:Date.now(), scans:0,
                        history:[{timestamp:Date.now(),type:'creation',description:'Tarjeta registrada en Supabase'}] };
                });
                let savedItems=[];let error=null;
                try{
                    await workshopApi({action:'save',session:workshopSession,kind:'cards',items:newItems});
                    const verified=await workshopApi({action:'list',session:workshopSession});
                    const ids=new Set(newItems.map(item=>item.id));
                    savedItems=(verified.cards||[]).filter(item=>ids.has(item.id));
                    if(savedItems.length!==newItems.length || savedItems.some(item=>!/^TQ-\d{6,}$/.test(item.serialNumber||'')))throw new Error('La numeración no quedó confirmada en Supabase');
                }catch(e){error=e}
                if(error){setCloudError('Error al verificar lote: '+error.message);showToast('No se verificó el lote; no imprimas estas tarjetas.','error');return null;}
                last.current={...last.current,qrs:[...savedItems,...last.current.qrs]};
                setQrs(prev=>[...savedItems,...prev]);
                setSelectedQrIdsForSheet(newItems.map(item=>item.id));
                showToast('Lote guardado en Supabase. Listo para continuar.','success');
                return {batchId, items:savedItems};
            };

            const updateQR = async (id, fields) => {
                if(!cloudReady || !initialized.current){showToast('Ingresa tu PIN para administrar tarjetas.','error');return;}
                const item=qrs.find(q=>q.id===id);if(!item)return;
                const history=[...(item.history||[])];
                if(fields.dynamicUrl && fields.dynamicUrl!==item.dynamicUrl)history.push({timestamp:Date.now(),type:'update',description:'Destino actualizado'});
                if(fields.clientId && fields.clientId!==item.clientId)history.push({timestamp:Date.now(),type:'assignment',description:'Cliente asignado'});
                const updated={...item,...fields,history};
                let data=null,error=null;try{await workshopApi({action:'save',session:workshopSession,kind:'cards',items:[updated]});data=[{id}]}catch(e){error=e}
                if(error || !data || data.length!==1){
                    setCloudError('Error al guardar tarjeta: '+(error?.message||'sin confirmación'));
                    showToast('Activación no guardada. Verifica autorización y PIN.','error');return;
                }
                last.current={...last.current,qrs:last.current.qrs.map(q=>q.id===id?updated:q)};
                setQrs(prev=>prev.map(q=>q.id===id?updated:q));
                showToast('Tarjeta guardada en Supabase.','success');
            };

            const deleteQR = (id) => {

            const BatchView = () => {

                const [productType, setProductType] = useState('pvc-horizontal');
                const [selectedBatchId, setSelectedBatchId] = useState('');
                const [creatingBatch, setCreatingBatch] = useState(false);
                const [selectedBatchTab, setSelectedBatchTab] = useState('summary');
                const [distributionTemplateId, setDistributionTemplateId] = useState('');
                const [distributionQty, setDistributionQty] = useState(1);
                const [distributionBusy, setDistributionBusy] = useState(false);
                const [bulkSelectedIds, setBulkSelectedIds] = useState([]);
                const [bulkPickQty, setBulkPickQty] = useState(10);
                const [bulkClientId, setBulkClientId] = useState('');
                const [bulkBusinessName, setBulkBusinessName] = useState('');
                const [bulkBusinessAddress, setBulkBusinessAddress] = useState('');
                const [bulkFunctionType, setBulkFunctionType] = useState('custom_url');
                const [bulkPlaceId, setBulkPlaceId] = useState('');
                const [bulkUrl, setBulkUrl] = useState('');
                const [bulkPin, setBulkPin] = useState('');
                const [bulkBusy, setBulkBusy] = useState(false);
                const [bulkResult, setBulkResult] = useState(null);

                const formatMeta = {
                    'pvc-horizontal': { label:'PVC horizontal · 85.6 × 54 mm', icon:'fa-address-card', perSheet:10 },
                    'pvc-vertical': { label:'PVC vertical · 54 × 85.6 mm', icon:'fa-id-card', perSheet:10 },
                    '10x15': { label:'Letrero 10 × 15 cm', icon:'fa-image', perSheet:2 },
                    'magnet-horizontal': { label:'Imán horizontal · 6 × 4 cm', icon:'fa-magnet', perSheet:18 },
                    'magnet-square': { label:'Imán cuadrado · 5 × 5 cm', icon:'fa-square', perSheet:15 }
                };
                const activeFormat = formatMeta[productType] || formatMeta['pvc-horizontal'];
                const estimatedSheets = Math.ceil(Math.max(1, Number(count)||1) / activeFormat.perSheet);

                const batchGroups = useMemo(() => {
                    const map = new Map();
                    qrs.filter(q=>q.batchId).forEach(card => {
                        const id = card.batchId;
                        if (!map.has(id)) {
                            map.set(id, {
                                id,
                                name: card.batchName || 'Lote sin nombre',
                                productType: card.productType || 'pvc-horizontal',
                                cards: [],
                                createdAt: card.createdAt || 0
                            });
                        }
                        const group = map.get(id);
                        group.cards.push(card);
                        group.createdAt = Math.min(group.createdAt || card.createdAt || 0, card.createdAt || group.createdAt || 0);
                    });
                    return [...map.values()].sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
                }, [qrs]);

                const selectedBatch = batchGroups.find(batch=>batch.id===selectedBatchId) || null;
                const selectedBatchTemplates = selectedBatch ? templates.filter(t=>t.category===selectedBatch.productType) : [];
                const distributedCards = selectedBatch ? selectedBatch.cards.filter(card=>card.designTemplateId) : [];
                const undistributedCards = selectedBatch ? selectedBatch.cards.filter(card=>!card.designTemplateId) : [];
                const selectedBulkCards = selectedBatch ? selectedBatch.cards.filter(card=>bulkSelectedIds.includes(card.id)) : [];

                const distributionGroups = useMemo(() => {
                    if (!selectedBatch) return [];
                    const map = new Map();
                    selectedBatch.cards.forEach(card => {
                        if (!card.designTemplateId) return;
                        const tpl = templates.find(t=>t.id===card.designTemplateId);
                        const key = card.designTemplateId;
                        const row = map.get(key) || {templateId:key,name:tpl?.name||card.designTemplateName||'Plantilla',count:0};
                        row.count++;
                        map.set(key,row);
                    });
                    return [...map.values()];
                }, [selectedBatchId, qrs, templates]);

                useEffect(() => {
                    setSelectedBatchTab('summary');
                    setBulkSelectedIds([]);
                    setBulkPickQty(10);
                    setBulkResult(null);
                    setDistributionTemplateId('');
                    setDistributionQty(1);
                }, [selectedBatchId]);

                const saveBatchCards = async updatedCards => {
                    if (!updatedCards.length) return;
                    await workshopApi({action:'save',session:workshopSession,kind:'cards',items:updatedCards});
                    const byId = new Map(updatedCards.map(card=>[card.id,card]));
                    setQrs(prev=>prev.map(card=>byId.get(card.id)||card));
                    last.current={...last.current,qrs:(last.current.qrs||[]).map(card=>byId.get(card.id)||card)};
                };

                const applyDistribution = async () => {
                    if (!selectedBatch || distributionBusy) return;
                    const tpl=selectedBatchTemplates.find(t=>t.id===distributionTemplateId);
                    if (!tpl) { showToast('Selecciona una plantilla.', 'warning'); return; }
                    const qty=Math.max(1,Math.min(Number(distributionQty)||1,undistributedCards.length));
                    if (!undistributedCards.length) { showToast('Todo el lote ya tiene diseño asignado.', 'info'); return; }
                    const now=Date.now();
                    const targets=undistributedCards.slice(0,qty).map(card=>({
                        ...card,
                        designTemplateId:tpl.id,
                        designTemplateName:tpl.name,
                        designAssignedAt:now
                    }));
                    setDistributionBusy(true);
                    try{
                        await saveBatchCards(targets);
                        showToast(qty+' tarjeta(s) asignadas a '+tpl.name+'.','success');
                    }catch(e){
                        showToast('No se pudo guardar la distribución: '+(e.message||e),'error');
                    }finally{setDistributionBusy(false)}
                };

                const removeDistributionGroup = async templateId => {
                    if (!selectedBatch || distributionBusy) return;
                    const targets=selectedBatch.cards.filter(card=>card.designTemplateId===templateId).map(card=>{
                        const next={...card};
                        delete next.designTemplateId; delete next.designTemplateName; delete next.designAssignedAt;
                        return next;
                    });
                    if(!targets.length)return;
                    setDistributionBusy(true);
                    try{await saveBatchCards(targets);showToast('Distribución retirada.','success')}
                    catch(e){showToast('No se pudo actualizar el lote.','error')}
                    finally{setDistributionBusy(false)}
                };

                const clearDistribution = async () => {
                    if (!selectedBatch || distributionBusy) return;
                    const targets=selectedBatch.cards.filter(card=>card.designTemplateId).map(card=>{
                        const next={...card};
                        delete next.designTemplateId; delete next.designTemplateName; delete next.designAssignedAt;
                        return next;
                    });
                    if(!targets.length)return;
                    setDistributionBusy(true);
                    try{await saveBatchCards(targets);showToast('Distribución del lote limpiada.','success')}
                    catch(e){showToast('No se pudo limpiar la distribución.','error')}
                    finally{setDistributionBusy(false)}
                };

                const selectBulkCount = countToSelect => {
                    if (!selectedBatch) return;
                    const pending=selectedBatch.cards.filter(card=>card.status!=='active');
                    const source=pending.length ? pending : selectedBatch.cards;
                    const amount=countToSelect==='all' ? source.length : Math.max(1,Math.min(Number(countToSelect)||1,source.length));
                    setBulkSelectedIds(source.slice(0,amount).map(card=>card.id));
                };

                const selectBulkByTemplate = templateId => {
                    if (!selectedBatch) return;
                    setBulkSelectedIds(selectedBatch.cards.filter(card=>card.designTemplateId===templateId).map(card=>card.id));
                };

                const bulkDeviceApi = async payload => {
                    const response=await fetch('https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-device-activation',{
                        method:'POST',
                        headers:{'Content-Type':'application/json','apikey':'sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3'},
                        body:JSON.stringify(payload)
                    });
                    const result=await response.json();
                    if(!response.ok||!result.ok)throw new Error(result.error||'Solicitud rechazada');
                    return result;
                };

                const activateSelectedBatchCards = async () => {
                    if (!selectedBatch || bulkBusy || !selectedBulkCards.length) return;
                    const credential=localStorage.getItem('tocaqui_device_credential_v1')||'';
                    if(!credential){showToast('Este navegador no está autorizado.','error');return}
                    if(!/^[0-9]{4}$/.test(bulkPin)){showToast('Ingresa el PIN de 4 dígitos.','warning');return}
                    if(!bulkBusinessName.trim()){showToast('Ingresa el nombre del negocio.','warning');return}
                    let finalUrl='';
                    if(bulkFunctionType==='custom_url'){
                        finalUrl=sanitizeUrl(bulkUrl);
                        if(!/^https:\/\//i.test(finalUrl)){showToast('Ingresa una URL HTTPS válida.','warning');return}
                    }else{
                        if(bulkPlaceId.trim().length<8){showToast('Ingresa un Google Place ID válido.','warning');return}
                        finalUrl='https://search.google.com/local/writereview?placeid='+encodeURIComponent(bulkPlaceId.trim());
                    }
                    const now=Date.now();
                    const client=clients.find(c=>c.id===bulkClientId);
                    const cards=selectedBulkCards.map(card=>{
                        const history=[...(card.history||[])];
                        if(finalUrl!==card.dynamicUrl)history.push({timestamp:now,type:'update',description:'Destino actualizado por activación masiva'});
                        if(bulkClientId&&bulkClientId!==card.clientId)history.push({timestamp:now,type:'assignment',description:'Asignada a cliente: '+(client?.name||bulkClientId)});
                        history.push({timestamp:now,type:'activation',description:'Activación masiva · '+bulkFunctionType});
                        return {
                            ...card,
                            status:'active',
                            clientId:bulkClientId||card.clientId||null,
                            businessName:bulkBusinessName.trim(),
                            businessAddress:bulkBusinessAddress.trim(),
                            placeId:bulkFunctionType==='custom_url'?null:bulkPlaceId.trim(),
                            functionType:bulkFunctionType,
                            dynamicUrl:finalUrl,
                            updatedAt:now,
                            history
                        };
                    });
                    setBulkBusy(true);setBulkResult(null);
                    try{
                        const result=await bulkDeviceApi({action:'bulkActivate',credential,pin:bulkPin,cards});
                        const returned=(result.successes||[]).map(row=>row.card).filter(Boolean);
                        const byId=new Map(returned.map(card=>[card.id,card]));
                        if(returned.length){
                            setQrs(prev=>prev.map(card=>byId.get(card.id)||card));
                            last.current={...last.current,qrs:(last.current.qrs||[]).map(card=>byId.get(card.id)||card)};
                        }
                        setBulkResult({requested:result.requested||cards.length,successCount:result.successCount||0,failureCount:result.failureCount||0,failures:result.failures||[],at:Date.now()});
                        setBulkPin('');
                        if((result.failureCount||0)===0)showToast((result.successCount||0)+' tarjetas activadas correctamente.','success');
                        else showToast((result.successCount||0)+' correctas · '+(result.failureCount||0)+' con error.','warning');
                    }catch(e){
                        setBulkResult({requested:cards.length,successCount:0,failureCount:cards.length,failures:[{error:e.message||String(e)}],at:Date.now()});
                        showToast('No se completó la activación masiva: '+(e.message||e),'error');
                    }finally{setBulkBusy(false)}
                };

                const openBatchInPrint = batch => {
                    if (!batch) return;
                    setPrintComposition([]);
                    setSelectedQrIdsForSheet(batch.cards.map(card=>card.id));
                    setPrintConfig(prev=>({...prev,templateType:batch.productType||'pvc-vertical'}));

                                                        <i className={`fa-solid ${meta.icon} block mb-1 text-blue-300`}></i>
                                                        <span className="block text-[10px] font-semibold leading-tight">{meta.label}</span>
                                                    </button>

                                            </div>

                                                                <button type="button" onClick={()=>selectBulkCount('all')} className="rounded-lg border border-blue-500/30 px-2.5 py-1.5 text-[11px] text-blue-300">Todo pendiente</button>

                                                        {bulkResult&&(
                                                            <div className="border-t border-slate-800 pt-4">
                                                                <div className="grid grid-cols-3 gap-3 text-center">

                                                                </div>

                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                {selectedBatchTab==='print'&&(
                                                    <div className="space-y-5">
                                                        <div className="border-b border-slate-800 pb-4">
                                                            <h4 className="text-base font-bold text-white">Preparar impresión</h4>
                                                            <p className="text-xs text-slate-500 mt-1">El Estudio A4 utilizará automáticamente la plantilla asignada a cada TAG. La Composición Mixta sigue disponible como ajuste manual.</p>
                                                        </div>
                                                        <div className="grid grid-cols-3 gap-4">
                                                            <div><div className="text-2xl font-bold text-white">{total}</div><div className="text-[10px] text-slate-500">Total</div></div>
                                                            <div><div className="text-2xl font-bold text-cyan-300">{distributedCards.length}</div><div className="text-[10px] text-slate-500">Con diseño</div></div>
                                                            <div><div className="text-2xl font-bold text-amber-300">{undistributedCards.length}</div><div className="text-[10px] text-slate-500">Sin diseño</div></div>
                                                        </div>
                                                        {undistributedCards.length>0&&<div className="text-xs text-amber-200 border-l-2 border-amber-400 pl-3">Las tarjetas sin diseño usarán el estilo actual del Estudio A4. Puedes distribuirlas antes de imprimir.</div>}
                                                        <button type="button" onClick={()=>openBatchInPrint(selectedBatch)} className="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 px-4 py-3.5 text-sm font-bold text-white"><i className="fa-solid fa-print mr-2"></i>Abrir lote en Estudio A4</button>
                                                    </div>
                                                )}

                                                {selectedBatchTab==='verification'&&(
                                                    <div className="space-y-5">
                                                        <div className="border-b border-slate-800 pb-4">
                                                            <h4 className="text-base font-bold text-white">Verificación del lote</h4>
                                                            <p className="text-xs text-slate-500 mt-1">Control automático de identidad, distribución y estado de activación.</p>
                                                        </div>
                                                        <div className="divide-y divide-slate-800">
                                                            <div className="py-3 flex items-center justify-between gap-3"><span className="text-sm text-slate-300">TAG únicos</span><span className={duplicateTags?'text-rose-300 font-bold':'text-emerald-300 font-bold'}>{uniqueTags}/{total} {duplicateTags?'· '+duplicateTags+' duplicado(s)':'· OK'}</span></div>
                                                            <div className="py-3 flex items-center justify-between gap-3"><span className="text-sm text-slate-300">Distribución visual</span><span className={undistributedCards.length?'text-amber-300 font-bold':'text-emerald-300 font-bold'}>{distributedCards.length}/{total}</span></div>
                                                            <div className="py-3 flex items-center justify-between gap-3"><span className="text-sm text-slate-300">Activación</span><span className={pending?'text-amber-300 font-bold':'text-emerald-300 font-bold'}>{active}/{total}</span></div>
                                                            <div className="py-3 flex items-center justify-between gap-3"><span className="text-sm text-slate-300">Pendientes</span><span className={pending?'text-amber-300 font-bold':'text-emerald-300 font-bold'}>{pending}</span></div>
                                                        </div>
                                                        {bulkResult&&(
                                                            <div className="border-t border-slate-800 pt-4">
                                                                <div className="text-[11px] uppercase tracking-wider font-bold text-slate-500 mb-2">Última operación masiva</div>

                                                            </div>

                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </aside>
                            </div>
                        )}
                    </div>
                );
            };

            // 3. QR MANAGEMENT VIEW
            const QRManagementView = () => {
                const [search, setSearch] = useState('');
                const [statusFilter, setStatusFilter] = useState('all');
                const [batchFilter, setBatchFilter] = useState('all');
                const [batchPickerOpen, setBatchPickerOpen] = useState(false);
                const [batchSearch, setBatchSearch] = useState('');
                const [cardPage, setCardPage] = useState(1);
                const pageSize = 20;

                const batchOptions = useMemo(() => [...new Set(qrs.map(q => q.batchId || 'legacy'))], [qrs]);
                const batchStats = useMemo(() => batchOptions.map(id => ({
                    id,
                    name: qrs.find(q => (q.batchId || 'legacy') === id)?.batchName || (id === 'legacy' ? 'Tarjetas anteriores' : id),
                    total: qrs.filter(q => (q.batchId || 'legacy') === id).length,
                    pending: qrs.filter(q => (q.batchId || 'legacy') === id && q.status !== 'active').length,
                    active: qrs.filter(q => (q.batchId || 'legacy') === id && q.status === 'active').length
                })), [batchOptions, qrs]);

                const filteredBatchStats = useMemo(() => {
                    const term=batchSearch.trim().toLowerCase();
                    if(!term)return batchStats;
                    return batchStats.filter(batch=>[batch.name,batch.id].some(v=>String(v||'').toLowerCase().includes(term)));
                }, [batchStats,batchSearch]);

                const filteredQrs = useMemo(() => {
                    const term=search.trim().toLowerCase();
                    return qrs.filter(q => {
                        const client=clients.find(c=>c.id===q.clientId);
                        const matchCode = !term || [q.trackingCode,q.businessName,q.batchName,q.batchId,client?.name]
                            .some(value=>String(value||'').toLowerCase().includes(term));
                        const matchStatus = statusFilter === 'all' || q.status === statusFilter;
                        const matchBatch = batchFilter === 'all' || (q.batchId || 'legacy') === batchFilter;
                        return matchCode && matchStatus && matchBatch;
                    });
                }, [qrs, clients, search, statusFilter, batchFilter]);

                useEffect(()=>{setCardPage(1)},[search,statusFilter,batchFilter]);
                const pageCount=Math.max(1,Math.ceil(filteredQrs.length/pageSize));
                const safePage=Math.min(cardPage,pageCount);
                const pagedQrs=filteredQrs.slice((safePage-1)*pageSize,safePage*pageSize);
                const selectedBatch=batchFilter==='all'?null:batchStats.find(batch=>batch.id===batchFilter);
                const visibleActive=filteredQrs.filter(q=>q.status==='active').length;
                const visiblePending=filteredQrs.length-visibleActive;

                return (
                    <div className="tocaqui-operation-page space-y-5">
                        <BackToDashboardButton />

                        <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
                            <div>
                                <div className="text-[10px] uppercase tracking-[.18em] text-cyan-300 font-bold">Centro operativo</div>
                                <h1 className="text-2xl font-bold text-white tracking-tight mt-1">Gestión de Tarjetas NFC / QR</h1>
                                <p className="text-slate-400 text-sm mt-1">Encuentra un lote o una tarjeta sin recorrer listas largas ni tablas horizontales.</p>
                            </div>
                            <div className="grid grid-cols-2 sm:flex gap-2 w-full lg:w-auto">
                                <button onClick={exportForNFCTools} className="min-h-[42px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-file-export text-blue-400"></i> Exportar CSV
                                </button>
                                <button onClick={() => setAdminTab('batch')} className="min-h-[42px] bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg shadow-blue-600/25">
                                    <i className="fa-solid fa-plus"></i> Generar Lote
                                </button>
                            </div>
                        </div>

                        <section className="glass-panel p-3.5 sm:p-4 rounded-2xl border border-slate-800 space-y-3">
                            <div className="grid lg:grid-cols-[1fr_300px] gap-3">
                                <div className="relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                                    <input
                                        type="text"
                                        placeholder="Buscar TAG, negocio, cliente o lote…"
                                        value={search}
                                        onChange={e => setSearch(e.target.value)}
                                        className="w-full glass-input pl-10 pr-4 py-2.5 rounded-xl text-sm"
                                    />
                                </div>

                                <div className="relative">
                                    <button
                                        type="button"
                                        onClick={()=>{setBatchPickerOpen(v=>!v);setBatchSearch('')}}
                                        className={'w-full min-h-[44px] rounded-xl border px-3.5 text-left flex items-center gap-3 '+(batchPickerOpen?'border-blue-400 bg-blue-500/10':'border-slate-700 bg-slate-950/40')}
                                    >
                                        <span className="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-300 flex items-center justify-center shrink-0"><i className="fa-solid fa-layer-group"></i></span>
                                        <span className="min-w-0 flex-1">
                                            <span className="block text-[9px] uppercase tracking-wider text-slate-500">Lote de fabricación</span>
                                            <span className="block truncate text-xs font-semibold text-white">{selectedBatch?.name || 'Todos los lotes'}</span>
                                        </span>
                                        <span className="text-[10px] text-slate-400 shrink-0">{selectedBatch?.total ?? qrs.length}</span>
                                        <i className="fa-solid fa-chevron-down text-slate-500 text-xs"></i>
                                    </button>

                                    {batchPickerOpen && (
                                        <>
                                            <button type="button" aria-label="Cerrar selector de lotes" onClick={()=>setBatchPickerOpen(false)} className="fixed inset-0 z-40 cursor-default bg-transparent"></button>
                                            <div className="absolute z-50 left-0 right-0 mt-2 rounded-2xl border border-slate-700 bg-slate-950 shadow-2xl shadow-black/50 overflow-hidden">
                                                <div className="p-2.5 border-b border-slate-800">
                                                    <div className="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 px-3">
                                                        <i className="fa-solid fa-magnifying-glass text-slate-500 text-xs"></i>
                                                        <input value={batchSearch} onChange={e=>setBatchSearch(e.target.value)} placeholder="Buscar lote…" className="w-full bg-transparent py-2.5 text-sm text-white outline-none placeholder:text-slate-600"/>
                                                    </div>
                                                </div>
                                                <div className="max-h-72 overflow-y-auto p-2 space-y-1">
                                                    <button type="button" onClick={()=>{setBatchFilter('all');setBatchPickerOpen(false)}} className={'w-full rounded-xl px-3 py-2.5 text-left flex items-center justify-between gap-3 '+(batchFilter==='all'?'bg-blue-500/15 text-white':'hover:bg-slate-900 text-slate-300')}>
                                                        <span><strong className="block text-xs">Todos los lotes</strong><span className="text-[10px] text-slate-500">Inventario completo</span></span>
                                                        <span className="text-[10px] rounded-full border border-slate-700 px-2 py-1">{qrs.length}</span>
                                                    </button>
                                                    {filteredBatchStats.map(batch=>(
                                                        <button type="button" key={batch.id} onClick={()=>{setBatchFilter(batch.id);setBatchPickerOpen(false)}} className={'w-full rounded-xl px-3 py-2.5 text-left flex items-center justify-between gap-3 '+(batchFilter===batch.id?'bg-blue-500/15 text-white':'hover:bg-slate-900 text-slate-300')}>
                                                            <span className="min-w-0"><strong className="block truncate text-xs">{batch.id==='legacy'?'Sin lote (anteriores)':batch.name}</strong><span className="block truncate text-[10px] text-slate-500">{batch.id} · {batch.pending} pendientes</span></span>
                                                            <span className="text-[10px] rounded-full border border-slate-700 px-2 py-1 shrink-0">{batch.total}</span>
                                                        </button>
                                                    ))}

                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                {['all','pending','active'].map(st=>(
                                    <button
                                        key={st}
                                        type="button"
                                        onClick={()=>setStatusFilter(st)}
                                        className={'min-h-[36px] px-3 rounded-xl text-xs font-semibold border '+(statusFilter===st?'bg-blue-600/25 text-blue-200 border-blue-500/60':'bg-slate-900/50 text-slate-400 border-slate-700/70')}
                                    >
                                        {st==='all'?'Todos':st==='pending'?'Por activar':'Activos'}
                                    </button>
                                ))}
                                {(search||statusFilter!=='all'||batchFilter!=='all') && <button type="button" onClick={()=>{setSearch('');setStatusFilter('all');setBatchFilter('all')}} className="min-h-[36px] px-3 rounded-xl text-[11px] text-slate-400 hover:text-white">Limpiar filtros</button>}
                            </div>
                        </section>

                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
                            <div className="rounded-2xl border border-slate-800 bg-slate-900/45 p-3.5"><div className="text-[9px] uppercase text-slate-500">Resultado</div><div className="text-2xl font-black text-white mt-1">{filteredQrs.length}</div></div>
                            <div className="rounded-2xl border border-slate-800 bg-slate-900/45 p-3.5"><div className="text-[9px] uppercase text-slate-500">Activas</div><div className="text-2xl font-black text-emerald-300 mt-1">{visibleActive}</div></div>
                            <div className="rounded-2xl border border-slate-800 bg-slate-900/45 p-3.5"><div className="text-[9px] uppercase text-slate-500">Por activar</div><div className="text-2xl font-black text-amber-300 mt-1">{visiblePending}</div></div>
                            <div className="rounded-2xl border border-slate-800 bg-slate-900/45 p-3.5"><div className="text-[9px] uppercase text-slate-500">Página</div><div className="text-2xl font-black text-blue-300 mt-1">{safePage}<span className="text-sm text-slate-500">/{pageCount}</span></div></div>
                        </div>

                        <section className="space-y-2">
                            {pagedQrs.map(qr=>{
                                const client=clients.find(c=>c.id===qr.clientId);
                                return (
                                    <article key={qr.id} className="glass-panel rounded-2xl border border-slate-800 p-3.5 sm:p-4">
                                        <div className="grid grid-cols-1 xl:grid-cols-[minmax(180px,1fr)_minmax(240px,1.35fr)_minmax(150px,.7fr)_auto] gap-3 xl:items-center">
                                            <div className="min-w-0">
                                                <div className="text-[9px] uppercase tracking-wider text-slate-500">Código de seguridad</div>
                                                <div className="font-mono font-bold text-white text-sm sm:text-base break-all mt-1">{cardNumber(qr)}</div>
                                                <div className="text-[10px] text-blue-300 truncate mt-1">{qr.batchName||'Tarjetas anteriores'} · {qr.batchId||'Sin lote'}</div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3 min-w-0">
                                                <div className="min-w-0">
                                                    <div className="text-[9px] uppercase tracking-wider text-slate-500">Negocio</div>
                                                    <div className="text-xs font-semibold text-slate-200 truncate mt-1">{qr.businessName||'Libre / Virgen'}</div>
                                                    {qr.dynamicUrl && <div className="text-[10px] text-blue-400 truncate mt-0.5" title={qr.dynamicUrl}>{qr.dynamicUrl}</div>}
                                                </div>
                                                <div className="min-w-0">
                                                    <div className="text-[9px] uppercase tracking-wider text-slate-500">Cliente</div>
                                                    {client
                                                        ? <button onClick={()=>{setSelectedClientDetailId(client.id);setAdminTab('client-detail')}} className="text-xs font-semibold text-indigo-300 hover:text-indigo-200 truncate block max-w-full mt-1"><i className="fa-solid fa-user mr-1"></i>{client.name}</button>
                                                        : <div className="text-xs text-slate-500 mt-1">Sin cliente</div>}
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 xl:grid-cols-1 gap-2">
                                                <div>
                                                    <div className="text-[9px] uppercase tracking-wider text-slate-500">Estado</div>
                                                    <span className={'inline-flex mt-1 rounded-full border px-2.5 py-1 text-[10px] font-semibold '+(qr.status==='active'?'bg-emerald-500/10 text-emerald-300 border-emerald-500/20':'bg-amber-500/10 text-amber-300 border-amber-500/20')}>{qr.status==='active'?'Activo':'Por activar'}</span>
                                                </div>
                                                <div>
                                                    <div className="text-[9px] uppercase tracking-wider text-slate-500">Escaneos</div>
                                                    <div className="font-mono text-lg font-bold text-slate-200 mt-0.5">{getCardScans(qr)}</div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-2 gap-1.5 xl:w-[190px]">
                                                <button onClick={()=>setIndividualQr(qr)} className="min-h-[38px] rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-200 px-2 text-[10px] font-semibold"><i className="fa-solid fa-qrcode mr-1"></i>QR</button>
                                                <button onClick={()=>setActivateModal({open:true,qr})} className="min-h-[38px] rounded-xl bg-blue-500/10 border border-blue-500/25 text-blue-200 px-2 text-[10px] font-semibold"><i className="fa-solid fa-pen-to-square mr-1"></i>{qr.status==='active'?'Editar':'Asignar'}</button>
                                                <button onClick={()=>writeWebNFC(qr.trackingCode)} className="min-h-[38px] rounded-xl bg-violet-500/10 border border-violet-500/25 text-violet-200 px-2 text-[10px] font-semibold"><i className="fa-solid fa-nfc-symbol mr-1"></i>NFC</button>
                                                <button onClick={()=>deleteQR(qr.id)} className="min-h-[38px] rounded-xl bg-rose-500/5 border border-rose-500/20 text-rose-300 px-2 text-[10px] font-semibold"><i className="fa-regular fa-trash-can mr-1"></i>Eliminar</button>
                                            </div>
                                        </div>
                                    </article>
                                );
                            })}
                            {!pagedQrs.length && <div className="glass-panel rounded-2xl border border-slate-800 p-8 text-center text-sm text-slate-500">No hay tarjetas con estos filtros.</div>}
                        </section>

                        {pageCount>1 && (
                            <div className="glass-panel rounded-2xl border border-slate-800 p-3 flex items-center justify-between gap-3">
                                <button type="button" disabled={safePage<=1} onClick={()=>setCardPage(p=>Math.max(1,p-1))} className="min-h-[38px] px-3 rounded-xl border border-slate-700 text-xs text-slate-300 disabled:opacity-40"><i className="fa-solid fa-chevron-left mr-1"></i>Anterior</button>
                                <div className="text-xs text-slate-400">Mostrando {(safePage-1)*pageSize+1}–{Math.min(safePage*pageSize,filteredQrs.length)} de {filteredQrs.length}</div>
                                <button type="button" disabled={safePage>=pageCount} onClick={()=>setCardPage(p=>Math.min(pageCount,p+1))} className="min-h-[38px] px-3 rounded-xl border border-slate-700 text-xs text-slate-300 disabled:opacity-40">Siguiente<i className="fa-solid fa-chevron-right ml-1"></i></button>
                            </div>
                        )}
                    </div>
                );
            };

            // 4. CLIENT DIRECTORY & DETAILED expediente VIEW
            const ClientView = () => {
                const [showAddModal, setShowAddModal] = useState(false);
                const [form, setForm] = useState({ name: '', company: '', email: '', phone: '' });
                const [clientSearch, setClientSearch] = useState('');
                const filteredClients = clients.filter(c => [c.name,c.company,c.email,c.phone].some(v=>String(v||'').toLowerCase().includes(clientSearch.toLowerCase())));

                if (adminTab === 'client-detail' && selectedClientDetailId) {
                    const client = clients.find(c => c.id === selectedClientDetailId);
                    const clientQrs = qrs.filter(q => q.clientId === selectedClientDetailId);
                    const totalScans = clientQrs.reduce((acc, curr) => acc + getCardScans(curr), 0);
                    const activeCount = clientQrs.filter(q => q.status === 'active').length;

                    return (
                        <div className="tocaqui-operation-page space-y-4">
                            <BackToDashboardButton label="Volver al Directorio de Clientes" targetTab="clients" />

                            <section className="glass-panel rounded-2xl border border-slate-800 p-3.5 sm:p-4">
                                <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <div className="w-10 h-10 shrink-0 bg-indigo-500/10 border border-indigo-500/20 rounded-xl flex items-center justify-center text-indigo-300">
                                            <i className="fa-solid fa-user-tie"></i>
                                        </div>
                                        <div className="min-w-0">
                                            <div className="text-[9px] uppercase tracking-[.16em] text-indigo-300 font-bold">Expediente del cliente</div>
                                            <h1 className="text-lg sm:text-xl font-bold text-white truncate mt-0.5">{client?.name || 'Cliente'}</h1>
                                            <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-slate-400 mt-1">
                                                <span className="truncate">{client?.company || 'Sin empresa'}</span>
                                                <span className="text-slate-700">•</span>
                                                <span className="truncate">{client?.email || 'Sin correo'}</span>
                                                {client?.phone && <><span className="text-slate-700">•</span><span>{client.phone}</span></>}

                                        </div>
                                    </div>
                                    <button onClick={() => window.print()} className="min-h-[40px] bg-emerald-600/15 hover:bg-emerald-600/25 text-emerald-300 border border-emerald-500/25 px-3.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-file-pdf"></i> Imprimir ficha
                                    </button>
                                </div>
                            </section>

                            <div className="grid grid-cols-3 gap-2">
                                <div className="rounded-xl border border-slate-800 bg-slate-900/45 p-3"><div className="text-[9px] uppercase tracking-wider text-slate-500">Tarjetas</div><div className="text-xl sm:text-2xl font-black text-white mt-1">{clientQrs.length}</div></div>
                                <div className="rounded-xl border border-slate-800 bg-slate-900/45 p-3"><div className="text-[9px] uppercase tracking-wider text-slate-500">Activas</div><div className="text-xl sm:text-2xl font-black text-emerald-300 mt-1">{activeCount}</div></div>
                                <div className="rounded-xl border border-slate-800 bg-slate-900/45 p-3"><div className="text-[9px] uppercase tracking-wider text-slate-500">Escaneos</div><div className="text-xl sm:text-2xl font-black text-amber-300 mt-1">{totalScans}</div></div>
                            </div>

                            <section className="glass-panel rounded-2xl border border-slate-800 overflow-hidden">
                                <div className="px-3.5 sm:px-4 py-3 border-b border-slate-800 flex items-center justify-between gap-3">
                                    <div><h2 className="font-bold text-white text-sm">Tarjetas del cliente</h2><p className="text-[10px] text-slate-500 mt-0.5">Estado, destino, escaneos y último cambio.</p></div>
                                    <span className="text-[10px] rounded-full border border-slate-700 px-2 py-1 text-slate-400">{clientQrs.length}</span>
                                </div>
                                <div className="divide-y divide-slate-800/80">
                                    {clientQrs.map(qr => (
                                        <article key={qr.id} className="p-3.5 sm:p-4 hover:bg-slate-900/35 transition-colors">
                                            <div className="grid grid-cols-1 lg:grid-cols-[minmax(150px,.8fr)_minmax(240px,1.5fr)_110px_150px] gap-3 lg:items-center">
                                                <div className="min-w-0">
                                                    <div className="font-mono font-bold text-white text-sm truncate">{cardNumber(qr)}</div>
                                                    <span className={'inline-flex mt-1 rounded-full border px-2 py-0.5 text-[9px] font-semibold '+(qr.status==='active'?'border-emerald-500/20 bg-emerald-500/10 text-emerald-300':'border-amber-500/20 bg-amber-500/10 text-amber-300')}>{qr.status==='active'?'Activa':'Por activar'}</span>
                                                </div>
                                                <div className="min-w-0">
                                                    <div className="text-xs font-semibold text-slate-200 truncate">{qr.businessName || 'Tarjeta sin nombre'}</div>
                                                    <div className="text-[10px] font-mono text-blue-400 truncate mt-1" title={qr.dynamicUrl || ''}>{qr.dynamicUrl || 'Sin enlace de destino'}</div>

                                                </div>
                                                <div><div className="text-[9px] uppercase text-slate-500">Escaneos</div><div className="font-mono font-bold text-slate-200 text-base mt-0.5">{getCardScans(qr)}</div></div>
                                                <button onClick={() => setActivateModal({ open: true, qr })} className="min-h-[38px] rounded-xl border border-indigo-500/25 bg-indigo-500/10 hover:bg-indigo-500/15 text-indigo-200 text-[10px] font-semibold px-3">
                                                    <i className="fa-solid fa-pen-to-square mr-1.5"></i>Reprogramar
                                                </button>
                                            </div>
                                        </article>

                                </div>
                            </section>
                        </div>
                    );
                }

                return (
                    <div className="tocaqui-operation-page space-y-4">
                        <BackToDashboardButton />

                        <section className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">

                                <div className="text-[10px] uppercase tracking-[.18em] text-indigo-300 font-bold">Clientes vinculados</div>
