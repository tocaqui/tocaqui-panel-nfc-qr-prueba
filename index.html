                                <p className="text-slate-400 text-xs sm:text-sm mt-1">Busca un cliente, revisa sus tarjetas y entra a su expediente sin tarjetas gigantes.</p>
                            </div>
                            <button onClick={() => setShowAddModal(true)} className="min-h-[42px] bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                                <i className="fa-solid fa-user-plus"></i> Registrar cliente
                            </button>
                        </section>

                        <section className="glass-panel p-3 rounded-2xl border border-slate-800">
                            <div className="relative"><i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-xs"></i><input value={clientSearch} onChange={e=>setClientSearch(e.target.value)} placeholder="Buscar cliente, local, correo o teléfono…" className="glass-input w-full rounded-xl py-2.5 pl-9 pr-3 text-sm"/></div>
                            <div className="flex flex-wrap gap-2 mt-2">
                                <span className="text-[10px] rounded-full border border-slate-700 px-2.5 py-1 text-slate-400">{filteredClients.length} clientes</span>
                                <span className="text-[10px] rounded-full border border-slate-700 px-2.5 py-1 text-slate-400">{qrs.filter(q=>q.clientId).length} tarjetas asignadas</span>
                            </div>
                        </section>

                        <section className="glass-panel rounded-2xl border border-slate-800 overflow-hidden">
                            <div className="hidden md:grid grid-cols-[1.1fr_1fr_1.2fr_90px_140px] gap-3 px-4 py-2.5 bg-slate-900/70 border-b border-slate-800 text-[9px] uppercase tracking-wider text-slate-500 font-semibold">
                                <span>Cliente</span><span>Local / Empresa</span><span>Contacto</span><span>Tarjetas</span><span></span>
                            </div>
                            <div className="divide-y divide-slate-800/80">
                                {filteredClients.map(client => {
                                    const assigned = qrs.filter(q => q.clientId === client.id);
                                    const active = assigned.filter(q=>q.status==='active').length;
                                    return (
                                        <article key={client.id} className="p-3.5 md:px-4 md:py-3 hover:bg-slate-900/35 transition-colors">
                                            <div className="grid grid-cols-1 md:grid-cols-[1.1fr_1fr_1.2fr_90px_140px] gap-2 md:gap-3 md:items-center">
                                                <div className="min-w-0"><div className="font-semibold text-white text-sm truncate">{client.name}</div><div className="md:hidden text-[10px] text-indigo-300 mt-0.5 truncate">{client.company || 'Sin empresa'}</div></div>
                                                <div className="hidden md:block min-w-0 text-xs text-indigo-300 truncate">{client.company || 'Sin empresa'}</div>
                                                <div className="min-w-0 text-[11px] text-slate-400">
                                                    <div className="truncate"><i className="fa-solid fa-envelope w-4 text-slate-600"></i>{client.email || 'Sin correo'}</div>
                                                    {client.phone && <div className="truncate mt-0.5"><i className="fa-solid fa-phone w-4 text-slate-600"></i>{client.phone}</div>}
                                                </div>
                                                <div className="flex md:block items-center gap-2"><div className="font-mono font-bold text-white text-sm">{assigned.length}</div><div className="text-[9px] text-emerald-300">{active} activas</div></div>
                                                <button onClick={() => { setSelectedClientDetailId(client.id); setAdminTab('client-detail'); }} className="min-h-[38px] rounded-xl border border-slate-700 bg-slate-800/70 hover:bg-slate-700 text-slate-200 text-[10px] font-semibold px-3">
                                                    <i className="fa-solid fa-folder-open text-indigo-300 mr-1.5"></i>Ver expediente
                                                </button>
                                            </div>
                                        </article>
                                    );
                                })}
                                {filteredClients.length===0 && <div className="p-8 text-center text-sm text-slate-500">No se encontraron clientes.</div>}
                            </div>
                        </section>

                        {showAddModal && (
                            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-md max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-2xl p-4 sm:p-5 border border-slate-700 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <div><h3 className="font-bold text-white">Nuevo Cliente</h3><p className="text-[10px] text-slate-500 mt-0.5">Datos para vincular tarjetas y mantener el expediente.</p></div>
                                        <button onClick={() => setShowAddModal(false)} className="w-9 h-9 rounded-lg bg-slate-800 text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    <form onSubmit={(e) => { e.preventDefault(); addClient(form); setShowAddModal(false); }} className="space-y-3">
                                        <input type="text" placeholder="Nombre completo" required value={form.name} onChange={e => setForm(prev=>({...prev, name:e.target.value}))} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm" />
                                        <input type="text" placeholder="Empresa / Local" required value={form.company} onChange={e => setForm({...form, company: e.target.value})} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm" />
                                        <input type="email" placeholder="Correo electrónico" required value={form.email} onChange={e => setForm({...form, email:e.target.value})} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm" />
                                        <input type="tel" placeholder="Teléfono" value={form.phone} onChange={e => setForm({...form, phone:e.target.value})} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm" />
                                        <button type="submit" className="w-full min-h-[44px] bg-blue-600 text-white font-bold rounded-xl">Guardar cliente</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 5. TEMPLATES LIBRARY VIEW (DUPLEX ANVERSO / REVERSO)
            const TemplatesView = () => {
                const form = templateDraft;
                const setForm = setTemplateDraft;
                const templateImageSize =
                    form.category === '10x15' ? [1200,1800] :
                    form.category === 'pvc-horizontal' ? [1712,1080] :
                    form.category === 'magnet-horizontal' ? [1500,1000] :
                    form.category === 'magnet-square' ? [1200,1200] :
                    [1080,1712];

                const handleSaveTemplate = async (e) => {
                    e.preventDefault();
                    const editing = !!templateModal.isEditing && !!templateModal.data?.id;
                    const existing = editing ? templates.find(t=>t.id===templateModal.data.id) : null;
                    const nextTpl = {
                        ...(existing || {}),
                        id: editing ? templateModal.data.id : 'TPL-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
                        name: form.name.trim(),
                        category: form.category,
                        frontBg: form.frontBg,
                        backBg: form.backBg,
                        defaultTheme: existing?.defaultTheme || 'custom',
                        qrBgStyle: existing?.qrBgStyle || 'white-box',
                        qrSizePx: existing?.qrSizePx || 55,
                        qrPosY: existing?.qrPosY || 'center',
                        qrPosX: existing?.qrPosX || 'center'
                    };
                    if (!nextTpl.name) return;
                    try {
                        if (workshopSession) {
                            await workshopApi({action:'save',session:workshopSession,kind:'templates',items:[nextTpl]});
                            const verify=await workshopApi({action:'list',session:workshopSession});
                            if(!verify.templates?.some(t=>t.id===nextTpl.id && t.name===nextTpl.name)) throw new Error('El servidor no confirmó la plantilla.');
                        }
                        const nextTemplates = editing
                            ? templates.map(t=>t.id===nextTpl.id?nextTpl:t)
                            : [...templates, nextTpl];
                        last.current = {...last.current, templates:nextTemplates};
                        setTemplates(nextTemplates);
                        setTemplateDraft({ name:'', category:'pvc-horizontal', frontBg:'', backBg:'', frontName:'', backName:'' });
                        setTemplateModal({ open:false, isEditing:false, data:null });
                        showToast(editing?'Plantilla actualizada en la nube.':'Plantilla guardada y confirmada en la nube.', 'success');
                    } catch (error) {
                        showToast('No se pudo guardar la plantilla: ' + (error.message || error), 'error');
                    }
                };

                const openTemplateEditor = (tpl) => {
                    setTemplateDraft({
                        name:tpl.name||'',
                        category:tpl.category||'pvc-horizontal',
                        frontBg:tpl.frontBg||'',
                        backBg:tpl.backBg||'',
                        frontName:tpl.frontBg?'Imagen actual':'',
                        backName:tpl.backBg?'Imagen actual':''
                    });
                    setTemplateModal({open:true,isEditing:true,data:tpl});
                };

                const deleteTemplate = (tpl) => {
                    const affected=qrs.filter(card=>card.designTemplateId===tpl.id);
                    setConfirmModal({
                        open:true,
                        title:'Eliminar plantilla',
                        message:affected.length
                            ? 'Esta plantilla está asignada a '+affected.length+' tarjeta(s). Se eliminará la plantilla y se quitará solo esa referencia visual. Los TAG, QR, NFC y destinos no cambiarán.'
                            : '¿Deseas eliminar permanentemente la plantilla “'+tpl.name+'” de la biblioteca?',
                        onConfirm:async()=>{
                            try{
                                if(workshopSession){
                                    await workshopApi({action:'delete',session:workshopSession,kind:'templates',ids:[tpl.id]});
                                }
                                let updatedQrs=qrs;
                                if(affected.length){
                                    const cleared=affected.map(card=>{
                                        const next={...card};
                                        delete next.designTemplateId;
                                        delete next.designTemplateName;
                                        delete next.designAssignedAt;
                                        return next;
                                    });
                                    if(workshopSession) await workshopApi({action:'save',session:workshopSession,kind:'cards',items:cleared});
                                    const clearedMap=new Map(cleared.map(card=>[card.id,card]));
                                    updatedQrs=qrs.map(card=>clearedMap.get(card.id)||card);
                                    last.current={...last.current,qrs:updatedQrs};
                                    setQrs(updatedQrs);
                                }
                                if(workshopSession){
                                    const verify=await workshopApi({action:'list',session:workshopSession});
                                    if(verify.templates?.some(t=>t.id===tpl.id)) throw new Error('El servidor todavía conserva la plantilla.');
                                }
                                const nextTemplates=templates.filter(t=>t.id!==tpl.id);
                                last.current={...last.current,templates:nextTemplates};
                                setTemplates(nextTemplates);
                                setPrintComposition(prev=>prev.filter(entry=>entry.templateId!==tpl.id));
                                if(printMixTemplateId===tpl.id)setPrintMixTemplateId('');
                                setPrintConfig(prev=>prev.selectedTemplateId===tpl.id?{...prev,selectedTemplateId:null,customFrontBg:'',customBackBg:''}:prev);
                                setConfirmModal({open:false,title:'',message:'',onConfirm:null});
                                showToast('Plantilla eliminada de la nube.','warning');
                            }catch(error){
                                setConfirmModal({open:false,title:'',message:'',onConfirm:null});
                                showToast('No se pudo eliminar: '+(error.message||error),'error');
                            }
                        }
                    });
                };

                return (
                    <div className="space-y-6">
                        <BackToDashboardButton />

                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">Biblioteca de Plantillas Guardadas</h1>
                                <p className="text-slate-400 text-sm mt-1">Catálogo de diseños reutilizables para imprimir nuevos lotes sin volver a cargar fotografías. Cada plantilla conserva anverso, reverso y formato.</p>
                            </div>
                            <button onClick={() => { setTemplateDraft({name:'',category:'pvc-horizontal',frontBg:'',backBg:'',frontName:'',backName:''}); setTemplateModal({ open:true, isEditing:false, data:null }); }} className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg shadow-purple-600/25">
                                <i className="fa-solid fa-plus"></i> Nueva Plantilla
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {templates.map(tpl => (
                                <div key={tpl.id} className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-4">
                                    <div className="flex justify-between items-start">
                                        <h3 className="font-bold text-white text-base">{tpl.name}</h3>
                                        <div className="flex items-center gap-1.5"><span className="text-[9px] rounded-full border border-emerald-500/20 bg-emerald-500/10 text-emerald-300 px-2 py-0.5"><i className="fa-solid fa-cloud mr-1"></i>Nube</span><span className="text-[10px] font-mono bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2 py-0.5 rounded">{tpl.category}</span></div>
                                    </div>

                                    {/* Preview Boxes Dual · imagen completa, sin recorte */}
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="h-32 rounded-lg bg-slate-950 border border-slate-800 relative overflow-hidden flex items-center justify-center p-2">
                                            {tpl.frontBg
                                                ? <img src={tpl.frontBg} alt={'Anverso de '+tpl.name} className="max-w-full max-h-full w-auto h-auto object-contain" style={{imageOrientation:'from-image'}} />
                                                : <div className="absolute inset-0 bg-gradient-to-br from-blue-900 to-slate-950"></div>}
                                            <span className="absolute top-2 left-2 text-[8px] font-bold uppercase bg-black/70 text-white px-1.5 py-0.5 rounded">Anverso</span>
                                        </div>
                                        <div className="h-32 rounded-lg bg-slate-950 border border-slate-800 relative overflow-hidden flex items-center justify-center p-2">
                                            {tpl.backBg
                                                ? <img src={tpl.backBg} alt={'Reverso de '+tpl.name} className="max-w-full max-h-full w-auto h-auto object-contain" style={{imageOrientation:'from-image'}} />
                                                : <div className="absolute inset-0 bg-gradient-to-br from-slate-900 to-indigo-950"></div>}
                                            <span className="absolute top-2 left-2 text-[8px] font-bold uppercase bg-black/70 text-white px-1.5 py-0.5 rounded">Reverso</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <button type="button" onClick={()=>openTemplateEditor(tpl)} className="py-2.5 rounded-xl border border-blue-500/25 bg-blue-500/10 text-blue-200 text-xs font-semibold hover:bg-blue-500/15">
                                            <i className="fa-solid fa-pen-to-square mr-1.5"></i>Editar
                                        </button>
                                        <button type="button" onClick={()=>deleteTemplate(tpl)} className="py-2.5 rounded-xl border border-rose-500/25 bg-rose-500/10 text-rose-200 text-xs font-semibold hover:bg-rose-500/15">
                                            <i className="fa-solid fa-trash-can mr-1.5"></i>Eliminar
                                        </button>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setPrintConfig(prev => ({
                                                ...prev,
                                                selectedTemplateId: tpl.id,
                                                templateType: tpl.category,
                                                customFrontBg: tpl.frontBg,
                                                customBackBg: tpl.backBg,
                                                theme: tpl.frontBg ? 'custom' : tpl.defaultTheme
                                            }));
                                            setAdminTab('print');
                                            showToast(`Plantilla "${tpl.name}" cargada en el Estudio A4.`, 'info');
                                        }}
                                        className="w-full py-2 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 border border-purple-500/30 text-xs font-semibold rounded-xl"
                                    >
                                        <i className="fa-solid fa-arrow-up-right-from-square mr-1"></i> Aplicar diseño al Estudio A4
                                    </button>
                                </div>
                            ))}
                        </div>

                        {templateModal.open && (
                            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-lg max-h-[calc(100dvh-2rem)] overflow-y-auto overscroll-contain rounded-2xl p-4 sm:p-6 border border-slate-700 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="font-bold text-white">{templateModal.isEditing?'Editar plantilla':'Crear Nueva Plantilla Guardada'}</h3>
                                        <button type="button" onClick={() => { setTemplateModal({open:false,isEditing:false,data:null}); setTemplateDraft({name:'',category:'pvc-horizontal',frontBg:'',backBg:'',frontName:'',backName:''}); }} className="text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    <form onSubmit={handleSaveTemplate} className="space-y-4">
                                        <input type="text" placeholder="Nombre de la Plantilla (ej: Barberías Oro)" required value={form.name} onChange={e=>setForm(prev=>({...prev,name:e.target.value}))} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm" />
                                        
                                        <div>
                                            <label className="block text-xs text-slate-300 mb-1">Formato de la plantilla</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[
                                                    ['pvc-horizontal','PVC horizontal'],
                                                    ['pvc-vertical','PVC vertical'],
                                                    ['10x15','Letrero 10×15'],
                                                    ['magnet-horizontal','Imán 6×4'],
                                                    ['magnet-square','Imán 5×5']
                                                ].map(([value,label])=>(
                                                    <button key={value} type="button" onClick={()=>setForm(prev=>prev.category===value?prev:{...prev,category:value,frontBg:'',backBg:'',frontName:'',backName:''})} className={`rounded-lg border px-2 py-2 text-[11px] font-semibold ${form.category===value?'border-blue-400 bg-blue-500/20 text-white':'border-slate-700 bg-slate-900 text-slate-400'}`}>{label}</button>
                                                ))}
                                            </div>
                                            <p className="text-[11px] text-slate-500 mt-1">Selecciona el formato antes de cargar las imágenes; se adaptan automáticamente a sus medidas.</p>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-300 mb-1">Anverso (Imagen Frente)</label>
                                            <input type="file" accept="image/*" onChange={async (e) => {
                                                const file = e.target.files[0];
                                                if (!file) return;
                                                setTemplateImageBusy(prev=>({...prev,front:true}));
                                                try {
                                                    const b64 = await compressImageToDataURL(file, ...templateImageSize, 0.92, 'cover');
                                                    setTemplateDraft(prev => ({ ...prev, frontBg:b64, frontName:file.name }));
                                                } catch (error) {
                                                    showToast('No se pudo procesar la imagen del anverso.', 'error');
                                                } finally {
                                                    setTemplateImageBusy(prev=>({...prev,front:false}));
                                                    e.target.value='';
                                                }
                                            }} className="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                                            {templateImageBusy.front && <div className="mt-2 rounded-xl border border-purple-500/20 bg-purple-500/10 p-3 text-xs text-purple-200"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Procesando imagen…</div>}
                                            {!templateImageBusy.front && form.frontBg && <div className="mt-2 rounded-xl border border-emerald-500/20 bg-slate-950/50 p-2.5 flex items-center gap-3">
                                                <img src={form.frontBg} alt="Previsualización anverso" className="w-16 h-20 rounded-lg object-cover border border-slate-700" />
                                                <div className="min-w-0"><div className="text-xs font-semibold text-emerald-300"><i className="fa-solid fa-circle-check mr-1.5"></i>Imagen cargada</div><div className="text-[10px] text-slate-500 truncate mt-1">{form.frontName||'Anverso listo'}</div></div>
                                            </div>}

                                        </div>

                                        <div>
                                            <label className="block text-xs text-slate-300 mb-1">Reverso (Imagen Atrás)</label>
                                            <input type="file" accept="image/*" onChange={async (e) => {
                                                const file = e.target.files[0];
                                                if (!file) return;
                                                setTemplateImageBusy(prev=>({...prev,back:true}));
                                                try {
                                                    const b64 = await compressImageToDataURL(file, ...templateImageSize, 0.92, 'cover');
                                                    setTemplateDraft(prev => ({ ...prev, backBg:b64, backName:file.name }));
                                                } catch (error) {
                                                    showToast('No se pudo procesar la imagen del reverso.', 'error');
                                                } finally {
                                                    setTemplateImageBusy(prev=>({...prev,back:false}));
                                                    e.target.value='';
                                                }
                                            }} className="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                                            {templateImageBusy.back && <div className="mt-2 rounded-xl border border-purple-500/20 bg-purple-500/10 p-3 text-xs text-purple-200"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Procesando imagen…</div>}
                                            {!templateImageBusy.back && form.backBg && <div className="mt-2 rounded-xl border border-emerald-500/20 bg-slate-950/50 p-2.5 flex items-center gap-3">
                                                <img src={form.backBg} alt="Previsualización reverso" className="w-16 h-20 rounded-lg object-cover border border-slate-700" />
                                                <div className="min-w-0"><div className="text-xs font-semibold text-emerald-300"><i className="fa-solid fa-circle-check mr-1.5"></i>Imagen cargada</div><div className="text-[10px] text-slate-500 truncate mt-1">{form.backName||'Reverso listo'}</div></div>
                                            </div>}

                                        </div>

                                        <button type="submit" disabled={templateImageBusy.front||templateImageBusy.back||(!form.frontBg&&!form.backBg)} className="w-full py-3 bg-purple-600 disabled:bg-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold rounded-xl">{templateImageBusy.front||templateImageBusy.back?'Procesando imagen…':templateModal.isEditing?'Guardar cambios':'Guardar Plantilla Permanente'}</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 6. ADVANCED PRINT & MASSIVE A4 DUPLEX STUDIO
            const PrintView = () => {
                const printA4Sheets = async () => {
                    const root = document.getElementById('print-area-wrapper');
                    if (!root) { window.print(); return; }
                    const images = Array.from(root.querySelectorAll('img'));
                    await Promise.all(images.map(img => {
                        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                        if (typeof img.decode === 'function') return img.decode().catch(() => new Promise(resolve => {
                            img.addEventListener('load', resolve, {once:true});
                            img.addEventListener('error', resolve, {once:true});
                        }));
                        return new Promise(resolve => {
                            img.addEventListener('load', resolve, {once:true});
                            img.addEventListener('error', resolve, {once:true});
                        });
                    }));
                    requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
                };
                const [qrCodeImages, setQrCodeImages] = useState({});
                const [printBatchFilter, setPrintBatchFilter] = useState(() => {
                    const selected = qrs.filter(q => selectedQrIdsForSheet.includes(q.id));
                    const ids = [...new Set(selected.map(q=>q.batchId || 'legacy'))];
                    return selected.length && ids.length === 1 ? ids[0] : 'all';
                });
                const [printBatchPickerOpen, setPrintBatchPickerOpen] = useState(false);
                const [printBatchSearch, setPrintBatchSearch] = useState('');
                const [printDirectSearch, setPrintDirectSearch] = useState('');
                const [printDirectPage, setPrintDirectPage] = useState(1);
                const printDirectPageSize = 12;
                const [previewZoom, setPreviewZoom] = useState(58);
                const [artworkFitMode, setArtworkFitMode] = useState('cover');
                const [customTemplateFileName, setCustomTemplateFileName] = useState({ front: '', back: '' });
                const [printCardPickerOpen, setPrintCardPickerOpen] = useState(false);
                const [printTemplatePickerOpen, setPrintTemplatePickerOpen] = useState(false);
                const [printCardSearch, setPrintCardSearch] = useState('');
                const [printTemplateSearch, setPrintTemplateSearch] = useState('');
                const [printTemplateFormatFilter, setPrintTemplateFormatFilter] = useState('all');
                const [qrMoveEnabled, setQrMoveEnabled] = useState(true);
                const [qrDragPosition, setQrDragPosition] = useState(() => {
                    try {
                        const saved = JSON.parse(localStorage.getItem('tocaqui_print_qr_position_v1') || 'null');
                        return saved && Number.isFinite(saved.x) && Number.isFinite(saved.y) ? saved : null;
                    } catch { return null; }
                });
                const [qrDragDraft, setQrDragDraft] = useState(null);
                const qrDragRef = useRef(null);
                const activeQrPosition = qrDragDraft || qrDragPosition;
                const clampQr = value => Math.min(90, Math.max(10, value));
                const saveQrPosition = position => {
                    const next = {x:clampQr(position.x), y:clampQr(position.y)};
                    setQrDragPosition(next);
                    localStorage.setItem('tocaqui_print_qr_position_v1', JSON.stringify(next));
                    return next;
                };
                const nudgeQr = (dx,dy) => {
                    const current = qrDragPosition || {x:50,y:50};
                    saveQrPosition({x:current.x+dx,y:current.y+dy});
                };
                const updateQrDrag = event => {
                    const drag = qrDragRef.current;
                    if (!drag || event.pointerId !== drag.pointerId) return;
                    const rect = drag.card.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const x = clampQr(drag.start.x + (event.clientX-drag.startClientX)/rect.width*100);
                    const y = clampQr(drag.start.y + (event.clientY-drag.startClientY)/rect.height*100);
                    setQrDragDraft({x,y});
                };
                const finishQrDrag = event => {
                    const drag=qrDragRef.current;
                    if(!drag || event.pointerId!==drag.pointerId)return;
                    const rect=drag.card.getBoundingClientRect();
                    if(rect.width && rect.height) {
                        const x=clampQr(drag.start.x+(event.clientX-drag.startClientX)/rect.width*100);
                        const y=clampQr(drag.start.y+(event.clientY-drag.startClientY)/rect.height*100);
                        saveQrPosition({x,y});
                    }
                    setQrDragDraft(null);
                    qrDragRef.current=null;
                };

                const itemsPerPage = ({
                    'pvc-horizontal':10,
                    'pvc-vertical':10,
                    '10x15':2,
                    'magnet-horizontal':18,
                    'magnet-square':15
                })[printConfig.templateType] || 10;
                const printBatches = useMemo(() => [...new Map(qrs.map(q => {
                    const id=q.batchId || 'legacy';
                    return [id,{id,name:q.batchName || 'Tarjetas anteriores'}];
                })).values()].map(batch=>({
                    ...batch,
                    total:qrs.filter(q=>(q.batchId||'legacy')===batch.id).length
                })), [qrs]);
                const filteredPrintBatches = useMemo(() => {
                    const term=printBatchSearch.trim().toLowerCase();
                    if(!term)return printBatches;
                    return printBatches.filter(batch=>[batch.name,batch.id].some(v=>String(v||'').toLowerCase().includes(term)));
                }, [printBatches,printBatchSearch]);
                const visiblePrintQrs = useMemo(() => {
                    const term=printDirectSearch.trim().toLowerCase();
                    return qrs.filter(q => {
                        const matchBatch=printBatchFilter === 'all' || (q.batchId || 'legacy') === printBatchFilter;
                        const matchTerm=!term || [cardNumber(q),q.businessName,q.batchName,q.batchId]
                            .some(v=>String(v||'').toLowerCase().includes(term));
                        return matchBatch && matchTerm;
                    });
                }, [qrs, printBatchFilter, printDirectSearch]);
                useEffect(()=>{setPrintDirectPage(1)},[printBatchFilter,printDirectSearch]);
                const printDirectPageCount=Math.max(1,Math.ceil(visiblePrintQrs.length/printDirectPageSize));
                const safePrintDirectPage=Math.min(printDirectPage,printDirectPageCount);
                const pagedPrintQrs=visiblePrintQrs.slice((safePrintDirectPage-1)*printDirectPageSize,safePrintDirectPage*printDirectPageSize);
                const selectedPrintBatch=printBatchFilter==='all'?null:printBatches.find(batch=>batch.id===printBatchFilter);
                const mixTemplates = useMemo(() => {
                    const term=printTemplateSearch.trim().toLowerCase();
                    const order={ 'pvc-horizontal':0, 'pvc-vertical':1, '10x15':2, 'magnet-horizontal':3, 'magnet-square':4 };
                    return templates
                        .filter(t=>printTemplateFormatFilter==='all' || t.category===printTemplateFormatFilter)
                        .filter(t=>!term || String(t.name||'').toLowerCase().includes(term) || String(t.category||'').toLowerCase().includes(term))
                        .sort((a,b)=>{
                            const ao=order[a.category]??9, bo=order[b.category]??9;
                            if(ao!==bo)return ao-bo;
                            return String(a.name||'').localeCompare(String(b.name||''),'es');
                        });
                }, [templates, printTemplateSearch, printTemplateFormatFilter]);
                const templateFormatCounts = useMemo(() => ({
                    all: templates.length,
                    'pvc-vertical': templates.filter(t=>t.category==='pvc-vertical').length,
                    'pvc-horizontal': templates.filter(t=>t.category==='pvc-horizontal').length,
                    '10x15': templates.filter(t=>t.category==='10x15').length,
                    'magnet-horizontal': templates.filter(t=>t.category==='magnet-horizontal').length,
                    'magnet-square': templates.filter(t=>t.category==='magnet-square').length
                }), [templates]);

                const visiblePrintCards = useMemo(() => {
                    const term=printCardSearch.trim().toLowerCase();
                    return qrs.filter(card=>{
                        if(!term)return true;
                        return [cardNumber(card),card.businessName,card.batchName,card.batchId]
                            .some(value=>String(value||'').toLowerCase().includes(term));
                    });
                }, [qrs, printCardSearch]);

                const selectedPrintCard = qrs.find(card=>card.id===printMixCardId)||null;
                const selectedPrintTemplate = templates.find(t=>t.id===printMixTemplateId)||null;
                const printFormatLabel = value =>
                    value==='pvc-horizontal' ? 'PVC horizontal' :
                    value==='pvc-vertical' ? 'PVC vertical' :
                    value==='10x15' ? 'Letrero 10×15' :
                    value==='magnet-horizontal' ? 'Imán 6×4 cm' :
                    value==='magnet-square' ? 'Imán 5×5 cm' :
                    'Formato';

                const choosePrintCard = card => {
                    setPrintMixCardId(card.id);
                    setPrintCardPickerOpen(false);
                    setPrintCardSearch('');
                    // El TAG se selecciona de forma independiente del diseño.
                    // La orientación se define recién al elegir la plantilla.
                };

                const choosePrintTemplate = tpl => {
                    const changingFormat=tpl.category!==printConfig.templateType;
                    if(changingFormat && printComposition.length){
                        setPrintComposition([]);
                        showToast('Se cambió el formato de impresión y se limpió la composición anterior para evitar mezclar orientaciones.','info');
                    }
                    setPrintConfig(prev=>({
                        ...prev,
                        templateType:tpl.category,
                        selectedTemplateId:tpl.id
                    }));
                    setPrintMixTemplateId(tpl.id);
                    setPrintTemplatePickerOpen(false);
                    setPrintTemplateSearch('');
                    setPrintTemplateFormatFilter('all');
                };

                useEffect(() => {
                    if (!printMixCardId && qrs[0]) setPrintMixCardId(qrs[0].id);
                    if (!templates.some(t=>t.id===printMixTemplateId)) {
                        const firstCompatible=templates.find(t=>t.category===printConfig.templateType) || templates[0];
                        setPrintMixTemplateId(firstCompatible?.id || '');
                    }
                }, [qrs, templates, printConfig.templateType, printMixCardId, printMixTemplateId]);

                const compositionItems = useMemo(() => {
                    return printComposition.map(entry => {
                        const card = qrs.find(q => q.id === entry.cardId);
                        const tpl = templates.find(t => t.id === entry.templateId);
                        if (!card || !tpl || tpl.category !== printConfig.templateType) return null;
                        return {...card, _printEntryId:entry.id, _printTemplate:tpl};
                    }).filter(Boolean);
                }, [printComposition, qrs, templates, printConfig.templateType]);

                const selectedItems = useMemo(() => {
                    if (compositionItems.length) return compositionItems;
                    return qrs
                        .filter(q => selectedQrIdsForSheet.includes(q.id))
                        .map(q => {
                            const tpl = q.designTemplateId ? templates.find(t => t.id === q.designTemplateId) : null;
                            return tpl ? { ...q, _printTemplate:tpl } : q;
                        });
                }, [compositionItems, qrs, selectedQrIdsForSheet, templates]);

                const compositionGroups = useMemo(() => {
                    const map = new Map();
                    printComposition.forEach(entry => {
                        const card = qrs.find(q=>q.id===entry.cardId);
                        const tpl = templates.find(t=>t.id===entry.templateId);
                        if (!card || !tpl || tpl.category !== printConfig.templateType) return;
                        const key = entry.cardId + '|' + entry.templateId;
                        const prev = map.get(key) || {key,card,tpl,count:0};
                        prev.count++;
                        map.set(key,prev);
                    });
                    return [...map.values()];
                }, [printComposition,qrs,templates,printConfig.templateType]);

                const addToPrintComposition = () => {
                    const card = qrs.find(q=>q.id===printMixCardId);
                    const tpl = mixTemplates.find(t=>t.id===printMixTemplateId);
                    const qty = Math.max(1, Math.min(50, Number(printMixQty)||1));
                    if (!card || !tpl) { showToast('Selecciona una tarjeta y una plantilla.', 'warning'); return; }
                    const stamp = Date.now().toString(36);
                    const entries = Array.from({length:qty},(_,idx)=>({
                        id:'PRINT-'+stamp+'-'+idx+'-'+Math.random().toString(36).slice(2,7),
                        cardId:card.id,
                        templateId:tpl.id
                    }));
                    setPrintComposition(prev=>[...prev,...entries]);
                };

                const removeOneComposition = (cardId,templateId) => {
                    setPrintComposition(prev=>{
                        const idx=[...prev].reverse().findIndex(x=>x.cardId===cardId&&x.templateId===templateId);
                        if(idx<0)return prev;
                        const real=prev.length-1-idx;
                        return prev.filter((_,i)=>i!==real);
                    });
                };

                const addOneComposition = (cardId,templateId) => {
                    setPrintComposition(prev=>[...prev,{id:'PRINT-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),cardId,templateId}]);
                };

                const pages = useMemo(() => {
                    const result = [];
                    for (let i = 0; i < selectedItems.length; i += itemsPerPage) {
                        result.push(selectedItems.slice(i, i + itemsPerPage));
                    }
                    return result;
                }, [selectedItems, itemsPerPage]);

                useEffect(() => {
                    selectedItems.forEach(item => {
                        const tagUrl = getBaseTagUrl(item.trackingCode);
                        generateQRBase64(tagUrl, 280).then(url => {
                            setQrCodeImages(prev => ({ ...prev, [item.id]: url }));
                        });
                    });
                }, [selectedItems]);

                const toggleSelectAll = () => {
                    const visibleIds = visiblePrintQrs.map(q=>q.id);
                    const allSelected = visibleIds.every(id=>selectedQrIdsForSheet.includes(id));
                    setSelectedQrIdsForSheet(prev => allSelected ? prev.filter(id=>!visibleIds.includes(id)) : [...new Set([...prev,...visibleIds])]);
                };

                const renderCardContent = (item, side = printConfig.activeSide) => {
                    const qrImg = qrCodeImages[item.id] || '';
                    const itemTemplate = item._printTemplate || null;
                    const effectiveTheme = itemTemplate?.defaultTheme || printConfig.theme;

                    const alignY = printConfig.qrPosY === 'top' ? 'items-start pt-2' : printConfig.qrPosY === 'bottom' ? 'items-end pb-2' : 'items-center';
                    const alignX = printConfig.qrPosX === 'left' ? 'justify-start pl-2' : printConfig.qrPosX === 'right' ? 'justify-end pr-2' : 'justify-center';

                    const cardClass =
                        printConfig.templateType === 'pvc-vertical' ? "card-pvc-vertical p-3 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'pvc-horizontal' ? "card-pvc-horizontal p-3 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'magnet-horizontal' ? "card-magnet-horizontal p-2 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'magnet-square' ? "card-magnet-square p-2 flex flex-col justify-between mx-auto" :
                        "card-poster-10x15 p-5 flex flex-col justify-between mx-auto";

                    const bgToUse = itemTemplate
                        ? (side === 'front' ? itemTemplate.frontBg : itemTemplate.backBg)
                        : (side === 'front' ? printConfig.customFrontBg : printConfig.customBackBg);

                    return (
                        <div
                            key={item._printEntryId || item.id}
                            className={cardClass}
                            style={{
                                background: bgToUse
                                    ? '#ffffff'
                                    : effectiveTheme === 'gold-luxury'
                                    ? 'linear-gradient(135deg, #0f172a 0%, #312e81 100%)'
                                    : effectiveTheme === 'clean-white'
                                    ? '#ffffff'
                                    : 'linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%)',
                                color: effectiveTheme === 'clean-white' ? '#0f172a' : '#ffffff'
                            }}
                        >
                            {bgToUse && <img src={bgToUse} alt="" aria-hidden="true" className="print-artwork-img pointer-events-none" />}
                            {side === 'back' && <div className="flex justify-between items-center text-[9px] font-bold uppercase tracking-wider">
                                <span className="truncate max-w-[120px]">{item.businessName || 'NFC CARD'}</span>
                                <i className="fa-solid fa-nfc-symbol text-xs text-blue-400"></i>
                            </div>}

                            {/* Only show QR Code on Front side */}
                            {side === 'front' && (
                                <div className={activeQrPosition ? 'absolute inset-0 pointer-events-none' : `flex-1 flex ${alignY} ${alignX} my-1`}>
                                    <div
                                        onPointerDown={event => {
                                            if (!qrMoveEnabled || !event.currentTarget.closest('.a4-sheet-preview')) return;
                                            event.preventDefault();
                                            const card = event.currentTarget.closest('.card-pvc-vertical, .card-pvc-horizontal, .card-poster-10x15, .card-magnet-horizontal, .card-magnet-square');
                                            if (!card) return;
                                            const rect = card.getBoundingClientRect();
                                            const elementRect = event.currentTarget.getBoundingClientRect();
                                            const start = activeQrPosition || {x: ((elementRect.left+elementRect.width/2-rect.left)/rect.width)*100, y: ((elementRect.top+elementRect.height/2-rect.top)/rect.height)*100};
                                            qrDragRef.current = {card, pointerId:event.pointerId, start, startClientX:event.clientX, startClientY:event.clientY};
                                            event.currentTarget.setPointerCapture(event.pointerId);
                                        }}
                                        onPointerMove={event => { if (qrDragRef.current) { event.preventDefault(); updateQrDrag(event); } }}
                                        onPointerUp={finishQrDrag}
                                        onPointerCancel={() => { qrDragRef.current = null; setQrDragDraft(null); }}
                                        style={activeQrPosition ? { position: 'absolute', left: activeQrPosition.x + '%', top: activeQrPosition.y + '%', transform: 'translate(-50%, -50%)', pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default', zIndex: 5 } : { pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default' }}
                                        className={`transition-all ${
                                            printConfig.qrBgStyle === 'white-box' ? 'bg-white rounded-xl shadow-md p-1.5' :
                                            printConfig.qrBgStyle === 'glass' ? 'bg-white/25 backdrop-blur-md border border-white/30 rounded-xl p-1.5 shadow-lg' :
                                            printConfig.qrBgStyle === 'dark-box' ? 'bg-slate-900/90 text-white border border-slate-700 rounded-xl p-1.5 shadow-md' :
                                            'bg-transparent p-0'
                                        }`}
                                    >
                                        <img
                                            src={qrImg}
                                            alt="QR Code"
                                            style={{ width: `${printConfig.qrSizePx}px`, height: `${printConfig.qrSizePx}px` }}
                                            className="object-contain block"
                                        />
                                    </div>
                                </div>
                            )}

                            {side === 'back' && (
                                <div className="flex-1 flex items-center justify-center text-center p-2">
                                    <span className="text-[10px] font-semibold opacity-70 break-words">{item.businessName || 'TOCAQUI · Tarjeta NFC / QR'}</span>
                                </div>
                            )}

                            {side === 'back' && <div className="flex justify-between items-end text-[8px] font-mono">
                                <span className="text-[7px] truncate max-w-[90px]">{item.businessAddress || 'TOCAQUI'}</span>
                            </div>}
                            {(printConfig.idPosition === 'back' ? side === 'back' : side === 'front') && printConfig.idPosition !== 'hidden' && (
                                <span className={`absolute z-10 font-mono font-bold ${printConfig.idOpacity} ${printConfig.idFontSize}`}
                                    style={{
                                        ...(printConfig.idPosition === 'top-left' ? {top:'5%',left:'5%'} :
                                            printConfig.idPosition === 'top-right' ? {top:'5%',right:'5%'} :
                                            printConfig.idPosition === 'bottom-left' ? {bottom:'5%',left:'5%'} :
                                            printConfig.idPosition === 'top-center' ? {top:'5%',left:'50%',transform:'translateX(-50%)'} :
                                            printConfig.idPosition === 'bottom-center' ? {bottom:'5%',left:'50%',transform:'translateX(-50%)'} :
                                            {bottom:'5%',right:'5%'})
                                    }}>{cardNumber(item)}</span>
                            )}
                        </div>
                    );
                };

                return (
                    <div className="space-y-6">
                        <BackToDashboardButton />

                        <div className="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">Estudio de Impresión Masiva en Hoja A4 Dúplex</h1>
                                <p className="text-slate-400 text-sm mt-1">Imprime tarjetas en diseño vertical u horizontal con alineación Dúplex.</p>
                            </div>
                            <button
                                onClick={printA4Sheets}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-3 rounded-xl text-xs shadow-lg shadow-emerald-600/25 flex items-center gap-2"
                            >
                                <i className="fa-solid fa-print text-sm"></i> Imprimir Hojas A4 Dúplex
                            </button>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 no-print">
                            {/* Controls */}
                            <div className="lg:col-span-5 space-y-5">
                                {/* Side Selector (Anverso / Reverso) */}
                                <div className="glass-panel p-4 rounded-2xl flex items-center justify-between border border-blue-500/30">
                                    <span className="text-xs font-bold uppercase text-slate-300">Vista de Impresión:</span>
                                    <div className="bg-slate-900 p-1 rounded-xl flex items-center border border-slate-800">
                                        <button
                                            onClick={() => setPrintConfig(prev => ({ ...prev, activeSide: 'front' }))}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${printConfig.activeSide === 'front' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            ANVERSO (Frente)
                                        </button>
                                        <button
                                            onClick={() => setPrintConfig(prev => ({ ...prev, activeSide: 'back' }))}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${printConfig.activeSide === 'back' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}
                                        >
                                            REVERSO (Atrás)
                                        </button>
                                    </div>

                                        </div>

                            </div>

                                                        {/* Live Screen Preview */}
                            <div className="lg:col-span-7 flex flex-col items-center justify-start space-y-6 overflow-x-auto">
                                <span className="text-xs font-mono uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                    <i className="fa-solid fa-eye text-emerald-400"></i> Previsualización A4 ({printConfig.activeSide.toUpperCase()})
                                    {printBatchFilter !== 'all' && <span className="normal-case tracking-normal text-blue-300 font-semibold">· {printBatches.find(b=>b.id===printBatchFilter)?.name}</span>}
                                </span>

                                <div className="flex flex-wrap items-center gap-2 no-print text-xs text-slate-400">

                                    <button type="button" onClick={()=>setArtworkFitMode('contain')} className={`rounded-lg border px-2 py-1 ${artworkFitMode==='contain'?'border-blue-400 bg-blue-500/20 text-white':'border-slate-700'}`}>Diseño completo (sin recorte)</button>
                                    <button type="button" onClick={()=>setArtworkFitMode('cover')} className={`rounded-lg border px-2 py-1 ${artworkFitMode==='cover'?'border-blue-400 bg-blue-500/20 text-white':'border-slate-700'}`}>Sin deformar (recorta)</button>
                                    <span className="text-[10px]">Vuelve a cargar la imagen para aplicar el ajuste.</span>
                                </div>
                                <div className="w-full max-w-[780px] rounded-2xl border border-slate-700 bg-slate-900/75 p-3 sm:p-4 no-print space-y-3 shadow-lg">

                                        {[
                                            { id: 'transparent', label: 'Transparente' },

                                            { id: 'white-box', label: 'Caja Blanca' },

                                            <button

                                        </button>
                                        <p className="text-[11px] text-slate-400">El QR permanece movible después de soltarlo. Arrastra desde su posición actual sin saltos; usa las flechas para calibrar con precisión. Se guarda automáticamente para la impresión.</p>
                                        <div className="flex items-center gap-3 flex-wrap rounded-xl border border-slate-700 bg-slate-900/60 p-2.5">
                                            <span className="text-[11px] text-slate-400">Calibración fina · 1%</span>
                                            <div className="grid grid-cols-3 gap-1">
                                                <span></span><button type="button" aria-label="Subir QR" onClick={()=>nudgeQr(0,-1)} className="rounded-lg bg-slate-700 px-3 py-2 text-cyan-200"><i className="fa-solid fa-chevron-up"></i></button><span></span>
                                                <button type="button" aria-label="Mover QR a la izquierda" onClick={()=>nudgeQr(-1,0)} className="rounded-lg bg-slate-700 px-3 py-2 text-cyan-200"><i className="fa-solid fa-chevron-left"></i></button>
                                                <button type="button" aria-label="Centrar QR" onClick={()=>saveQrPosition({x:50,y:50})} className="rounded-lg bg-blue-600/30 px-3 py-2 text-blue-200" title="Centrar"><i className="fa-solid fa-crosshairs"></i></button>
                                                <button type="button" aria-label="Mover QR a la derecha" onClick={()=>nudgeQr(1,0)} className="rounded-lg bg-slate-700 px-3 py-2 text-cyan-200"><i className="fa-solid fa-chevron-right"></i></button>
                                                <span></span><button type="button" aria-label="Bajar QR" onClick={()=>nudgeQr(0,1)} className="rounded-lg bg-slate-700 px-3 py-2 text-cyan-200"><i className="fa-solid fa-chevron-down"></i></button><span></span>
                                            </div>
                                        </div>
                                        {qrDragPosition && <div className="flex items-center justify-between gap-2">
                                            <span className="text-[11px] text-emerald-400">Posición guardada: {Math.round(qrDragPosition.x)}% · {Math.round(qrDragPosition.y)}%</span>
                                            <button type="button" onClick={() => { setQrDragPosition(null); setQrDragDraft(null); localStorage.removeItem('tocaqui_print_qr_position_v1'); showToast('Posición del QR restablecida.', 'info'); }} className="text-xs text-cyan-300 underline">Restablecer</button>
                                        </div>}
                                        <div className="pt-2 border-t border-slate-800">
                                            <div className="flex justify-between text-xs text-slate-300 mb-1">
                                                <span>Tamaño del QR:</span>
                                                <span className="font-mono font-bold text-blue-400">{printConfig.qrSizePx} px</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="35"
                                                max="130"
                                                value={printConfig.qrSizePx}

                                            />

                                    </div>

                                </div>

                                <div className="flex items-center gap-2 no-print text-xs text-slate-400">

                                    <span className="text-slate-500">Impresión: 100%</span>
                                </div>
                                {pages.map((pageItems, pageIdx) => (
                                    <div key={pageIdx} className="a4-sheet-preview preview-compact rounded-lg" style={{zoom: previewZoom + '%'}}>

                                            Hoja A4 #{pageIdx + 1} - Cara: {printConfig.activeSide.toUpperCase()}
                                        </div>

                                        <div className={
                                            printConfig.templateType === 'pvc-vertical' ? "sheet-preview-grid sheet-preview-pvc-vertical" :

                    </div>

            };

            // 7. CLIENT PORTAL VIEW
            const ClientPortalView = () => {
                const currentClient = clients[0];
                const clientQrs = qrs.filter(q => q.clientId === currentClient?.id);
                const [editingQr, setEditingQr] = useState(null);
                const [newUrl, setNewUrl] = useState('');
                const activeCards = clientQrs.filter(q=>q.status==='active').length;
                const totalScans = clientQrs.reduce((sum,q)=>sum+getCardScans(q),0);

                return (
                    <div className="max-w-5xl mx-auto space-y-4">
                        <BackToDashboardButton label="Volver a Selección de Modo" />

                        <section className="rounded-2xl border border-indigo-500/20 bg-gradient-to-r from-indigo-600/10 via-slate-900/80 to-blue-500/5 p-4 sm:p-5">
                            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                                <div className="flex items-start gap-3 min-w-0">
                                    <div className="w-11 h-11 shrink-0 rounded-xl bg-indigo-500/15 border border-indigo-500/25 text-indigo-300 flex items-center justify-center">
                                        <i className="fa-solid fa-id-card text-lg"></i>
                                    </div>
                                    <div className="min-w-0">
                                        <div className="text-[10px] uppercase tracking-[.18em] text-indigo-300 font-bold">Portal Cliente TOCAQUI</div>
                                        <h1 className="text-xl sm:text-2xl font-bold text-white mt-1 truncate">{currentClient?.company || 'Mi negocio'}</h1>
                                        <p className="text-xs sm:text-sm text-slate-400 mt-1 max-w-2xl">Este portal permite administrar el destino de las tarjetas NFC/QR del negocio, comprobar su estado y revisar cuántas veces han sido escaneadas.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2 shrink-0">
                                    <div className="rounded-xl border border-slate-800 bg-slate-950/35 px-3 py-2 text-center"><div className="text-lg font-black text-white">{clientQrs.length}</div><div className="text-[9px] text-slate-500">Tarjetas</div></div>
                                    <div className="rounded-xl border border-slate-800 bg-slate-950/35 px-3 py-2 text-center"><div className="text-lg font-black text-emerald-300">{activeCards}</div><div className="text-[9px] text-slate-500">Activas</div></div>
                                    <div className="rounded-xl border border-slate-800 bg-slate-950/35 px-3 py-2 text-center"><div className="text-lg font-black text-amber-300">{totalScans}</div><div className="text-[9px] text-slate-500">Escaneos</div></div>
                                </div>
                            </div>
                        </section>

                        <section className="glass-panel rounded-2xl border border-slate-800 overflow-hidden">
                            <div className="px-3.5 sm:px-4 py-3 border-b border-slate-800 flex items-center justify-between gap-3">
                                <div><h2 className="font-bold text-white text-sm">Mis tarjetas y destinos</h2><p className="text-[10px] text-slate-500 mt-0.5">El QR/NFC conserva su identidad; aquí solo cambias el destino dinámico.</p></div>
                                <span className="text-[10px] rounded-full border border-slate-700 px-2 py-1 text-slate-400">{clientQrs.length}</span>
                            </div>
                            <div className="divide-y divide-slate-800/80">
                                {clientQrs.map(qr => (
                                    <article key={qr.id} className="p-3.5 sm:p-4 hover:bg-slate-900/35 transition-colors">
                                        <div className="grid grid-cols-1 lg:grid-cols-[minmax(160px,.8fr)_minmax(260px,1.6fr)_100px_165px] gap-3 lg:items-center">
                                            <div className="min-w-0"><div className="font-mono font-bold text-white text-sm truncate">{cardNumber(qr)}</div><span className={'inline-flex mt-1 rounded-full border px-2 py-0.5 text-[9px] font-semibold '+(qr.status==='active'?'border-emerald-500/20 bg-emerald-500/10 text-emerald-300':'border-amber-500/20 bg-amber-500/10 text-amber-300')}>{qr.status==='active'?'Activa':'Pendiente'}</span></div>
                                            <div className="min-w-0"><div className="text-xs font-semibold text-slate-200 truncate">{qr.businessName || 'Mi tarjeta'}</div><div className="mt-1 rounded-lg border border-slate-800 bg-slate-950/60 px-2.5 py-2 text-[10px] font-mono text-blue-400 truncate" title={qr.dynamicUrl || ''}>{qr.dynamicUrl || 'Sin enlace configurado'}</div></div>
                                            <div><div className="text-[9px] uppercase tracking-wider text-slate-500">Lecturas</div><div className="font-mono text-lg font-bold text-slate-200 mt-0.5">{getCardScans(qr)}</div></div>
                                            <button onClick={() => { setEditingQr(qr); setNewUrl(qr.dynamicUrl || ''); }} className="min-h-[40px] rounded-xl border border-indigo-500/25 bg-indigo-500/10 hover:bg-indigo-500/15 text-indigo-200 px-3 text-[10px] font-semibold">
                                                <i className="fa-solid fa-link mr-1.5"></i>Cambiar destino
                                            </button>
                                        </div>
                                    </article>
                                ))}
                                {clientQrs.length===0 && <div className="p-8 text-center text-sm text-slate-500">Aún no hay tarjetas vinculadas a este cliente.</div>}
                            </div>
                        </section>

                        <section className="grid sm:grid-cols-3 gap-2.5">
                            <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-3"><div className="text-[9px] uppercase text-slate-500">1 · Tarjeta física</div><p className="text-[11px] text-slate-300 mt-1">El QR y NFC mantienen siempre la misma identidad.</p></div>
                            <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-3"><div className="text-[9px] uppercase text-slate-500">2 · Destino dinámico</div><p className="text-[11px] text-slate-300 mt-1">La URL puede cambiar sin volver a imprimir ni grabar.</p></div>
                            <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-3"><div className="text-[9px] uppercase text-slate-500">3 · Seguimiento</div><p className="text-[11px] text-slate-300 mt-1">Las lecturas quedan contabilizadas por tarjeta.</p></div>
                        </section>

                        {editingQr && (
                            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-md rounded-2xl p-4 sm:p-5 border border-slate-700 space-y-4">
                                    <div className="flex items-start justify-between gap-3">
                                        <div><h3 className="font-bold text-white">Cambiar destino</h3><p className="text-[10px] text-slate-500 mt-1">El QR/NFC no cambia; solo se actualiza la URL.</p></div>
                                        <button type="button" onClick={()=>setEditingQr(null)} className="w-9 h-9 rounded-lg bg-slate-800 text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    <form onSubmit={(e) => { e.preventDefault(); updateQR(editingQr.id, { dynamicUrl: sanitizeUrl(newUrl) }); setEditingQr(null); }} className="space-y-3">

                                        <input type="url" required value={newUrl} onChange={e => setNewUrl(e.target.value)} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm font-mono" placeholder="https://..." />
                                        <button type="submit" className="w-full min-h-[44px] bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">Guardar destino</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // Local, approximate Places usage: counts requests made by this browser only.
            const PLACES_USAGE_STORAGE = 'tocaqui_places_usage_v1';
            const currentPlacesMonth = () => new Date().toISOString().slice(0, 7);
            const readPlacesUsage = () => {
                const month = currentPlacesMonth();
                try {
                    const stored = JSON.parse(localStorage.getItem(PLACES_USAGE_STORAGE) || '{}');
                    if (stored.month === month) return { month, requests: Number(stored.requests) || 0, successes: Number(stored.successes) || 0, errors: Number(stored.errors) || 0, selections: Number(stored.selections) || 0 };
                } catch (e) {}
                return { month, requests: 0, successes: 0, errors: 0, selections: 0 };
            };
            const recordPlacesUsage = (type) => {
                try {
                    const next = readPlacesUsage();
                    if (type === 'request') next.requests++;
                    if (type === 'success') next.successes++;
                    if (type === 'error') next.errors++;
                    if (type === 'selection') next.selections++;
                    localStorage.setItem(PLACES_USAGE_STORAGE, JSON.stringify(next));
                    window.dispatchEvent(new Event('tocaqui-places-usage-updated'));
                } catch (e) {}
            };

            // 8. SETTINGS VIEW
            const SettingsView = () => {
                const [pinInput, setPinInput] = useState('');
                const [oldPinInput,setOldPinInput]=useState('');
                const [keyInput, setKeyInput] = useState(googleApiKey);
                const [placesUsage, setPlacesUsage] = useState(readPlacesUsage);
                const [authorizedDevices, setAuthorizedDevices] = useState([]);
                const [currentDeviceId, setCurrentDeviceId] = useState('');
                const [devicesLoading, setDevicesLoading] = useState(false);
                const [deviceActionBusy, setDeviceActionBusy] = useState(false);
                const [pairingInfo, setPairingInfo] = useState(null);
                const [showRevokedDevices, setShowRevokedDevices] = useState(false);
                const [googleCloudBusy, setGoogleCloudBusy] = useState(false);
                const [googleCloudMessage, setGoogleCloudMessage] = useState('');
                const [cloudProjectInput, setCloudProjectInput] = useState(googleCloudConfig.projectId || '');
                const [cloudOAuthInput, setCloudOAuthInput] = useState(googleCloudConfig.oauthClientId || driveConfig.clientId || '');
                useEffect(() => {
                    const refresh = () => setPlacesUsage(readPlacesUsage());
                    window.addEventListener('tocaqui-places-usage-updated', refresh);

                const getGoogleCloudToken = async () => {
                    const projectId = cloudProjectInput.trim() || googleCloudConfig.projectId;
                    const oauthClientId = cloudOAuthInput.trim() || googleCloudConfig.oauthClientId;
                    if (!projectId || !oauthClientId) throw new Error('Guarda Project ID y OAuth Client ID primero.');
                    const cached = window.__tocaquiGoogleCloudToken;
                    if (cached?.accessToken && cached.expiresAt > Date.now() + 60000) return cached.accessToken;
                    if (!window.google?.accounts?.oauth2) throw new Error('Google Identity Services todavía no está disponible. Recarga la página.');
                    const token = await new Promise((resolve,reject)=>{
                        const client = window.google.accounts.oauth2.initTokenClient({
                            client_id: oauthClientId,
                            scope: 'https://www.googleapis.com/auth/cloud-platform',
                            callback: response => {
                                if (response?.error || !response?.access_token) reject(new Error(response?.error_description || response?.error || 'Google no entregó autorización.'));
                                else resolve(response);
                            }
                        });
                        client.requestAccessToken({ prompt:'consent' });
                    });
                    window.__tocaquiGoogleCloudToken = {
                        accessToken: token.access_token,
                        expiresAt: Date.now() + Math.max(300, Number(token.expires_in || 3600)) * 1000
                    };
                    return token.access_token;
                };

                const googleCloudFetch = async (url, token, options={}) => {
                    const response = await fetch(url, {
                        ...options,
                        headers: {
                            ...(options.body ? {'Content-Type':'application/json'} : {}),
                            ...(options.headers || {}),
                            Authorization: 'Bearer ' + token
                        }
                    });
                    const text = await response.text();
                    let data = {};
                    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw:text }; }
                    if (!response.ok) throw new Error(data?.error?.message || data?.message || ('Google Cloud respondió ' + response.status));
                    return data;
                };

                const waitGoogleOperation = async (baseUrl, operationName, token) => {
                    if (!operationName) return {};
                    for (let attempt=0; attempt<30; attempt++) {
                        const result = await googleCloudFetch(baseUrl + '/' + operationName, token);
                        if (result.done) {
                            if (result.error) throw new Error(result.error.message || 'La operación de Google Cloud falló.');
                            return result.response || result;
                        }
                        await new Promise(resolve => setTimeout(resolve, 700));

                    throw new Error('Google Cloud aún está procesando la operación. Intenta actualizar en unos segundos.');
