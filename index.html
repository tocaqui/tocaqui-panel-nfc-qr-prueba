                                            <input value={pairCode} onChange={e=>setPairCode(e.target.value.trim().toLowerCase())} className="w-full glass-input px-3 py-2.5 rounded-xl text-xs font-mono" placeholder="Código de vinculación"/>
                                            {pairError&&<p className="text-[11px] text-rose-300">{pairError}</p>}
                                            <button type="button" onClick={pairDevice} disabled={pairBusy||!/^[a-f0-9]{64}$/.test(pairCode)} className="w-full rounded-xl bg-blue-600 py-2.5 text-xs font-bold text-white disabled:opacity-40">{pairBusy?'Vinculando...':'Autorizar navegador'}</button>
                                        </div>
                                    )}
                                    <input type="password" inputMode="numeric" autoComplete="one-time-code" maxLength="4" value={pinEntered} onChange={e=>{setPinEntered(e.target.value.replace(/\D/g,'').slice(0,4));setPinError(false);setPinVerified(false);}} className={pinError?'w-full glass-input px-3.5 py-3 rounded-xl text-center text-xl font-mono font-bold tracking-[0.5em] border-rose-500/70':'w-full glass-input px-3.5 py-3 rounded-xl text-center text-xl font-mono font-bold tracking-[0.5em]'} placeholder="••••" aria-label="PIN de activación"/>
                                    {pinError&&<p className="text-[11px] text-rose-300 mt-2">PIN inválido, bloqueado o no autorizado.</p>}
                                </section>

                            </div>
                            <div className="shrink-0 border-t border-slate-800 bg-slate-950/95 backdrop-blur px-4 sm:px-5 py-3">
                                <div className="flex items-center justify-between gap-3">
                                    <div className="hidden sm:block min-w-0"><div className="text-[10px] text-slate-500">Destino</div><div className="text-[10px] text-cyan-200 truncate max-w-[280px]">{computedDestination||'Completa los datos para activar'}</div></div>
                                    <button onClick={handleConfirmActivation} disabled={activationSaving} className="w-full sm:w-auto sm:min-w-[220px] py-3 px-5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 disabled:opacity-50 text-white text-sm font-bold shadow-lg">
                                        {activationSaving?'Guardando…':qr.status==='active'?'Guardar cambios':'Confirmar activación'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Keep the activation form mounted through background panel refreshes.
            const activationModalLatest=useRef(ActivationModal);
            activationModalLatest.current=ActivationModal;
            const StableActivationModal=useMemo(()=>function StableActivationModal(){return activationModalLatest.current();},[]);

            // Preview only: does not perform a real scan or change card activation.
            const ScanSimulatorModal = () => {
                const [cameraOn,setCameraOn]=useState(false);
                const [cameraError,setCameraError]=useState('');
                const [starting,setStarting]=useState(false);
                const mode=scanSimModal.mode||'choose';
                const [manualInput,setManualInput]=useState('');
                const [businessQuery,setBusinessQuery]=useState('');
                const [businessSuggestions,setBusinessSuggestions]=useState([]);
                const [businessLoading,setBusinessLoading]=useState(false);
                const [businessError,setBusinessError]=useState('');
                const businessWizardKey='tocaqui_business_assignment_wizard_v1';
                const [businessWizardDraft]=useState(()=>{try{const d=JSON.parse(sessionStorage.getItem(businessWizardKey)||'null');return d&&d.expires>Date.now()?d:null}catch{return null}});
                const [selectedBusiness,setSelectedBusiness]=useState(businessWizardDraft?.selectedBusiness||null);
                const [businessCardSearch,setBusinessCardSearch]=useState(businessWizardDraft?.businessCardSearch||'');
                const [businessBatchFilter,setBusinessBatchFilter]=useState(businessWizardDraft?.businessBatchFilter||'all');
                const [businessDesignFilter,setBusinessDesignFilter]=useState(businessWizardDraft?.businessDesignFilter||'all');
                const [businessCardPage,setBusinessCardPage]=useState(businessWizardDraft?.businessCardPage||1);
                const businessCardPageSize=10;
                const businessRequestIdRef=useRef(0);
                useEffect(()=>{
                    if(!scanSimModal.open||mode!=='business')return;
                    try{sessionStorage.setItem(businessWizardKey,JSON.stringify({
                        selectedBusiness,businessCardSearch,businessBatchFilter,businessDesignFilter,businessCardPage,expires:Date.now()+2*60*60*1000
                    }))}catch{}
                },[scanSimModal.open,mode,selectedBusiness,businessCardSearch,businessBatchFilter,businessDesignFilter,businessCardPage]);
                const videoRef=useRef(null),streamRef=useRef(null),frameRef=useRef(null);

                const stop=()=>{
                    if(frameRef.current)clearTimeout(frameRef.current);
                    frameRef.current=null;
                    if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
                    streamRef.current=null;
                    setCameraOn(false);
                    setStarting(false);
                };
                const close=()=>{
                    stop();
                    setManualInput('');
                    setCameraError('');
                    setBusinessQuery('');
                    setBusinessSuggestions([]);
                    setBusinessError('');
                    setSelectedBusiness(null);
                    setBusinessCardSearch('');
                    setBusinessBatchFilter('all');
                    setBusinessDesignFilter('all');
                    try{sessionStorage.removeItem(businessWizardKey)}catch{}
                    setScanSimModal({open:false,mode:'choose',code:'',reviewGateStep:'stars',selectedStars:0});
                };
                const openMode=next=>{
                    stop();
                    setCameraError('');
                    setScanSimModal(prev=>({...prev,mode:next,code:''}));
                };
                const cardSearchText=card=>[
                    card.serialNumber,card.trackingCode,card.id,card.batchId,card.batchName,
                    card.businessName,clients.find(c=>c.id===card.clientId)?.name,
                    clients.find(c=>c.id===card.clientId)?.company
                ].filter(Boolean).join(' ').toLowerCase();

                const resolveExactCard=value=>{
                    const raw=String(value||'').trim();
                    if(!raw)return null;
                    const tagMatch=raw.match(/TAG-[A-Z0-9-]+/i)?.[0]?.toUpperCase();
                    const serialMatch=raw.match(/TQ-\d{4,}/i)?.[0]?.toUpperCase();
                    return qrs.find(card=>
                        (tagMatch && [card.trackingCode,card.id].some(v=>String(v||'').toUpperCase()===tagMatch)) ||
                        (serialMatch && String(card.serialNumber||'').toUpperCase()===serialMatch) ||
                        [card.trackingCode,card.id,card.serialNumber].some(v=>String(v||'').toLowerCase()===raw.toLowerCase())
                    )||null;
                };
                const openCard=card=>{
                    if(!card){setCameraError('No encontré esa tarjeta en el inventario TOCAQUI.');return;}
                    stop();
                    setCameraError('');
                    if(card.status!=='active'){
                        setScanSimModal({open:false,mode:'choose',code:'',reviewGateStep:'stars',selectedStars:0});
                        setTimeout(()=>setActivateModal({open:true,qr:card}),0);
                    }else{
                        setScanSimModal(prev=>({...prev,mode:'result',code:card.trackingCode||card.id}));
                    }
                };
                const scanValue=value=>{
                    const card=resolveExactCard(value);
                    if(!card){
                        const hasTocaqui=/TAG-|TQ-/i.test(String(value||''));
                        setCameraError(hasTocaqui?'La tarjeta es TOCAQUI, pero no está en el inventario cargado.':'El código leído no corresponde a una tarjeta TOCAQUI.');
                        return;
                    }
                    openCard(card);
                };

                useEffect(()=>{
                    if(!scanSimModal.open||mode!=='business'||selectedBusiness)return;
                    const query=businessQuery.trim();
                    if(query.length<2){
                        setBusinessSuggestions([]);
                        setBusinessLoading(false);
                        setBusinessError('');
                        return;
                    }
                    if(!placesBackendStatus.configured){
                        setBusinessSuggestions([]);
                        setBusinessLoading(false);
                        setBusinessError(placesBackendStatus.loading?'':'Google Places aún no está conectado en TOCAQUI.');
                        return;
                    }
                    const requestId=++businessRequestIdRef.current;
                    const timer=setTimeout(async()=>{
                        setBusinessLoading(true);
                        setBusinessError('');
                        try{
                            const result=await workshopApi({action:'placesAutocomplete',session:workshopSession,input:query});
                            if(requestId!==businessRequestIdRef.current)return;
                            setBusinessSuggestions(Array.isArray(result.suggestions)?result.suggestions:[]);
                        }catch(e){
                            if(requestId!==businessRequestIdRef.current)return;
                            setBusinessSuggestions([]);
                            setBusinessError(e.message||'No se pudo buscar el negocio.');
                        }finally{
                            if(requestId===businessRequestIdRef.current)setBusinessLoading(false);
                        }
                    },280);
                    return()=>clearTimeout(timer);
                },[scanSimModal.open,mode,businessQuery,selectedBusiness,placesBackendStatus.configured,placesBackendStatus.loading,workshopSession]);

                const chooseBusiness=async prediction=>{
                    setBusinessLoading(true);
                    setBusinessError('');
                    try{
                        const result=await workshopApi({action:'placesDetails',session:workshopSession,placeId:prediction.placeId});
                        if(!result.place?.placeId)throw new Error('Google no devolvió el Place ID.');
                        setSelectedBusiness(result.place);
                        setBusinessQuery('');
                        setBusinessSuggestions([]);
                        setBusinessCardSearch('');
                    }catch(e){
                        setBusinessError(e.message||'No se pudo cargar el negocio seleccionado.');
                    }finally{
                        setBusinessLoading(false);
                    }
                };

                const assignBusinessToCard=card=>{
                    if(!selectedBusiness||!card)return;
                    const business=selectedBusiness;
                    try{sessionStorage.removeItem(businessWizardKey)}catch{}
                    setScanSimModal({open:false,mode:'choose',code:'',reviewGateStep:'stars',selectedStars:0});
                    setTimeout(()=>setActivateModal({
                        open:true,
                        qr:card,
                        preselectedPlace:business,
                        preselectedDestinationType:'google_review'
                    }),0);
                };

                const start=async()=>{
                    if(starting||cameraOn)return;
                    setStarting(true);setCameraError('');
                    if(!window.isSecureContext){setCameraError('El lector necesita HTTPS.');setStarting(false);return;}
                    if(!navigator.mediaDevices?.getUserMedia){setCameraError('Este navegador no permite acceso a la cámara.');setStarting(false);return;}
                    try{
                        let detector=null;
                        if('BarcodeDetector' in window){
                            try{
                                const supported=await BarcodeDetector.getSupportedFormats();
                                if(supported.includes('qr_code')) detector=new BarcodeDetector({formats:['qr_code']});
                            }catch(e){}
                        }
                        const decoder=window.jsQR||null;
                        if(!detector&&!decoder)throw new Error('No hay decodificador QR disponible.');

                        let stream;
                        try{
                            stream=await navigator.mediaDevices.getUserMedia({
                                video:{facingMode:{ideal:'environment'},width:{ideal:1280,max:1920},height:{ideal:720,max:1080}},
                                audio:false
                            });
                        }catch(firstError){
                            if(firstError?.name==='NotAllowedError'||firstError?.name==='SecurityError')throw firstError;
                            stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
                        }
                        streamRef.current=stream;
                        const track=stream.getVideoTracks()[0];
                        try{
                            const caps=track?.getCapabilities?.();
                            if(caps?.focusMode?.includes?.('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
                        }catch(e){}

                        const video=videoRef.current;
                        if(!video){stop();return;}
                        video.srcObject=stream;
                        await video.play();
                        setCameraOn(true);setStarting(false);

                        const canvas=document.createElement('canvas');
                        const ctx=canvas.getContext('2d',{willReadFrequently:true});
                        let busy=false,passes=0;
                        const tick=async()=>{
                            if(!streamRef.current)return;
                            if(!busy&&video.readyState>=2&&video.videoWidth){
                                busy=true;
                                try{
                                    if(detector){
                                        const codes=await detector.detect(video);
                                        if(codes?.[0]?.rawValue){scanValue(codes[0].rawValue);return;}
                                    }else if(decoder){
                                        const maxWidth=720;
                                        const scale=Math.min(1,maxWidth/video.videoWidth);
                                        canvas.width=Math.max(320,Math.round(video.videoWidth*scale));
                                        canvas.height=Math.max(240,Math.round(video.videoHeight*scale));
                                        ctx.drawImage(video,0,0,canvas.width,canvas.height);
                                        const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
                                        passes++;
                                        const found=decoder(pixels.data,pixels.width,pixels.height,{inversionAttempts:passes%5===0?'attemptBoth':'dontInvert'});
                                        if(found?.data){scanValue(found.data);return;}
                                    }
                                }catch(e){}
                                finally{busy=false;}
                            }
                            frameRef.current=setTimeout(tick,detector?70:110);
                        };
                        frameRef.current=setTimeout(tick,40);
                    }catch(e){
                        stop();
                        if(e?.name==='NotAllowedError'||e?.name==='SecurityError')setCameraError('Permite el acceso a la cámara para go.tocaqui.store.');
                        else if(e?.name==='NotFoundError')setCameraError('No se encontró una cámara disponible.');
                        else if(e?.name==='NotReadableError')setCameraError('La cámara está siendo usada por otra aplicación.');
                        else setCameraError(e?.message||'No se pudo iniciar el lector QR.');
                    }
                };

                useEffect(()=>{
                    if(!scanSimModal.open||mode!=='camera'||scanSimModal.code)return;
                    const id=setTimeout(()=>start(),120);
                    return()=>{clearTimeout(id);stop();};
                },[scanSimModal.open,mode,scanSimModal.code]);

                useEffect(()=>()=>stop(),[]);
                useEffect(()=>{
                    setBusinessCardPage(1);
                },[businessCardSearch,businessBatchFilter,businessDesignFilter,selectedBusiness?.placeId]);

                if(!scanSimModal.open)return null;

                const scannedQr=qrs.find(q=>q.trackingCode===scanSimModal.code||q.id===scanSimModal.code);
                const term=manualInput.trim().toLowerCase();
                const manualMatches=term.length<1?[]:qrs.filter(card=>cardSearchText(card).includes(term)).slice(0,8);
                const pendingBusinessCards=qrs.filter(card=>card.status!=='active');
                const businessBatches=[...new Map(pendingBusinessCards.map(card=>[
                    card.batchId||card.batchName||'sin-lote',
                    {id:card.batchId||card.batchName||'sin-lote',label:card.batchName||card.batchId||'Sin lote'}
                ])).values()].sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
                const businessDesigns=[...new Map(pendingBusinessCards.map(card=>{
                    const tpl=templates.find(t=>t.id===card.designTemplateId);
                    const id=card.designTemplateId||'sin-diseno';
                    return [id,{id,label:tpl?.name||'Sin diseño asignado',category:tpl?.category||card.productType||''}];
                })).values()].sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}));
                const businessCardTerm=businessCardSearch.trim().toLowerCase();
                const availableBusinessCards=pendingBusinessCards
                    .filter(card=>businessBatchFilter==='all'||(card.batchId||card.batchName||'sin-lote')===businessBatchFilter)
                    .filter(card=>businessDesignFilter==='all'||(card.designTemplateId||'sin-diseno')===businessDesignFilter)
                    .filter(card=>{
                        if(!businessCardTerm)return true;
                        const tpl=templates.find(t=>t.id===card.designTemplateId);
                        return (cardSearchText(card)+' '+(tpl?.name||'')+' '+(tpl?.category||'')).includes(businessCardTerm);
                    })
                    .sort((a,b)=>{
                        const batchA=String(a.batchName||a.batchId||'Sin lote');
                        const batchB=String(b.batchName||b.batchId||'Sin lote');
                        const batchCmp=batchA.localeCompare(batchB,undefined,{numeric:true});
                        return batchCmp||String(cardNumber(a)).localeCompare(String(cardNumber(b)),undefined,{numeric:true});
                    });
                const businessCardPageCount=Math.max(1,Math.ceil(availableBusinessCards.length/businessCardPageSize));
                const safeBusinessCardPage=Math.min(businessCardPage,businessCardPageCount);
                const pagedBusinessCards=availableBusinessCards.slice((safeBusinessCardPage-1)*businessCardPageSize,safeBusinessCardPage*businessCardPageSize);
                const businessCardGroups=pagedBusinessCards.reduce((acc,card)=>{
                    const key=card.batchId||card.batchName||'sin-lote';
                    if(!acc[key])acc[key]={label:card.batchName||card.batchId||'Sin lote',cards:[]};
                    acc[key].cards.push(card);
                    return acc;
                },{});

                if(scannedQr?.status==='active'){
                    const owner=clients.find(c=>c.id===scannedQr.clientId);
                    return (
                        <div className="fixed inset-0 z-[70] bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
                            <div className="w-full max-w-md rounded-3xl border border-emerald-500/25 bg-slate-950 shadow-2xl p-5">
                                <div className="flex items-start justify-between gap-3">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <div className="w-11 h-11 rounded-2xl bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 flex items-center justify-center"><i className="fa-solid fa-circle-check"></i></div>
                                        <div className="min-w-0"><div className="text-[10px] uppercase tracking-[.16em] text-emerald-300 font-bold">Tarjeta activa</div><h3 className="font-bold text-white truncate">{cardNumber(scannedQr)}</h3></div>
                                    </div>
                                    <button type="button" onClick={close} className="w-9 h-9 rounded-xl bg-slate-800 text-slate-300" aria-label="Cerrar"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="grid grid-cols-2 gap-2 mt-4 text-xs">
                                    <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-3"><div className="text-[9px] uppercase text-slate-500">Negocio</div><div className="text-white font-semibold mt-1 truncate">{scannedQr.businessName||'Sin negocio'}</div></div>
                                    <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-3"><div className="text-[9px] uppercase text-slate-500">Cliente</div><div className="text-white font-semibold mt-1 truncate">{owner?.name||'Sin cliente'}</div></div>
                                    <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-3 col-span-2"><div className="text-[9px] uppercase text-slate-500">Destino</div><div className="text-cyan-200 font-mono text-[10px] mt-1 break-all">{scannedQr.dynamicUrl||'Sin destino'}</div></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <button type="button" onClick={()=>{close();setTimeout(()=>setActivateModal({open:true,qr:scannedQr}),0);}} className="rounded-xl bg-blue-600 hover:bg-blue-500 text-white py-3 text-xs font-bold"><i className="fa-solid fa-pen-to-square mr-2"></i>Gestionar</button>
                                    <button type="button" onClick={()=>openMode('choose')} className="rounded-xl bg-slate-800 text-slate-200 py-3 text-xs font-semibold"><i className="fa-solid fa-arrow-rotate-left mr-2"></i>Otra tarjeta</button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if(mode==='business'){
                    return (
                        <div className="fixed inset-0 z-[70] bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
                            <div className="w-full max-w-2xl max-h-[92dvh] rounded-3xl border border-blue-500/20 bg-slate-950 shadow-2xl overflow-hidden flex flex-col">
                                <div className="shrink-0 flex items-center justify-between px-4 sm:px-5 py-4 border-b border-slate-800">
                                    <div>
                                        <div className="text-[10px] uppercase tracking-[.16em] text-blue-300 font-bold"><i className="fa-solid fa-bolt mr-2"/>Asignación rápida</div>
                                        <h3 className="font-bold text-white text-lg mt-0.5">Conecta una tarjeta</h3>
                                        <p className="text-[11px] text-slate-400 mt-1">Selecciona el negocio, la tarjeta y confirma su destino.</p>
                                    </div>
                                    <button type="button" onClick={close} className="w-9 h-9 rounded-xl bg-slate-800 text-slate-300" aria-label="Cerrar"><i className="fa-solid fa-xmark"></i></button>
                                </div>

                                <div className="shrink-0 grid grid-cols-3 gap-1.5 px-4 sm:px-5 py-3 border-b border-slate-800/70 bg-slate-950/70">
                                    {[['1','Negocio'],['2','Tarjeta'],['3','Activar']].map(([n,label],idx)=>{
                                        const done=idx===0?!!selectedBusiness:false;
                                        const active=idx===0?!selectedBusiness:idx===1?!!selectedBusiness:false;
                                        return <div key={n} className="flex items-center gap-2 min-w-0">
                                            <span className={(done?'bg-emerald-500/15 text-emerald-300 border-emerald-500/25':active?'bg-blue-500/15 text-blue-300 border-blue-500/25':'bg-slate-900 text-slate-500 border-slate-800')+" w-7 h-7 rounded-lg border flex items-center justify-center text-[10px] font-bold shrink-0"}>{done?<i className="fa-solid fa-check"></i>:n}</span>
                                            <span className={active||done?'text-[10px] font-semibold text-slate-200 truncate':'text-[10px] text-slate-600 truncate'}>{label}</span>
                                        </div>;
                                    })}
                                </div>

                                <div className="p-4 sm:p-5 min-h-0 overflow-y-auto">
                                    {!selectedBusiness ? (
                                        <section>
                                            <label className="block text-xs font-semibold text-slate-300 mb-2">Buscar negocio en Google</label>
                                            <div className="relative">
                                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-500 text-xs"></i>
                                                <input autoFocus value={businessQuery} onChange={e=>{setBusinessQuery(e.target.value);setBusinessError('');}} className="w-full glass-input pl-9 pr-9 py-3 rounded-xl text-sm" placeholder="Ej: Café Aurora, Barbería Central…"/>
                                                {businessLoading&&<i className="fa-solid fa-spinner fa-spin absolute right-3 top-3.5 text-blue-300 text-xs"></i>}
                                            </div>
                                            {businessError&&<div className="mt-3 rounded-xl border border-amber-500/25 bg-amber-500/10 px-3 py-2.5 text-xs text-amber-200">{businessError}</div>}
                                            {!businessQuery&&<div className="mt-4 rounded-2xl border border-slate-800 bg-slate-900/40 p-4 text-xs text-slate-400"><i className="fa-solid fa-location-dot text-blue-300 mr-2"></i>Busca el local por su nombre. TOCAQUI guardará el Place ID, nombre y dirección.</div>}
                                            {businessSuggestions.length>0&&<div className="mt-3 overflow-hidden rounded-2xl border border-slate-800 bg-slate-950 divide-y divide-slate-800">
                                                {businessSuggestions.map((prediction,idx)=><button type="button" key={prediction.placeId||idx} onClick={()=>chooseBusiness(prediction)} className="w-full px-3.5 py-3.5 hover:bg-slate-900 text-left flex items-center justify-between gap-3">
                                                    <span className="min-w-0"><span className="block text-sm font-semibold text-white truncate">{prediction.mainText||prediction.text||'Negocio'}</span><span className="block text-[11px] text-slate-500 truncate mt-0.5">{prediction.secondaryText||''}</span></span>
                                                    <i className="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                                                </button>)}

                                            {templateError?<div className="rounded-xl border border-amber-500/20 bg-amber-500/[0.06] p-4 text-xs text-amber-200">No se pudieron cargar las plantillas. <button type="button" className="underline font-semibold" onClick={()=>setLoadRetry(v=>v+1)}>Reintentar</button></div>:<>
                                                <div className="flex items-center gap-2 text-xs text-slate-400"><i className="fa-solid fa-spinner fa-spin text-cyan-300"></i>Cargando biblioteca TOCAQUI…</div>
                                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">{Array.from({length:6}).map((_,i)=><div key={i} className="rounded-2xl border border-slate-800 bg-slate-900/50 p-3 animate-pulse"><div className="h-24 rounded-xl bg-slate-800"></div><div className="h-3 w-2/3 bg-slate-800 rounded mt-3"></div><div className="h-2 w-1/2 bg-slate-800 rounded mt-2"></div></div>)}</div>
                                            </>}
                                        </div>:null}
                                        {templatesReady && adminTab === 'batch' && <StableBatchView />}
                                        {templatesReady && adminTab === 'qrs' && <StableQRManagementView />}
                                        {templatesReady && (adminTab === 'clients' || adminTab === 'client-detail') && <StableClientView />}
                                        {templatesReady && adminTab === 'templates' && TemplatesView()}
                                        {templatesReady && adminTab === 'print' && <StablePrintView />}
                                        {templatesReady && adminTab === 'settings' && <StableSettingsView />}
                                    </div>
                                </main>
<nav className="tq-mobile-nav no-print" aria-label="Accesos rápidos">{[['dashboard','Inicio','fa-chart-pie'],['batch','Lotes','fa-layer-group'],['qrs','Tarjetas','fa-credit-card'],['templates','Diseños','fa-swatchbook'],['more','Más','fa-bars']].map(([id,label,icon])=><button key={id} type="button" aria-current={adminTab===id?'page':undefined} onClick={()=>{if(id==='more'){setMobileSidebarOpen(true);}else{setAdminTab(id);setMobileSidebarOpen(false);}}}><i className={'fa-solid '+icon} aria-hidden="true"/><span>{label}</span></button>)}</nav>
                            </>
                        ) : (
                            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
                                <ClientPortalView />
                            </main>
                        )}
                    </div>

                    {individualQr && (
                        <div className="fixed inset-0 z-[90] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 no-print" role="dialog" aria-modal="true" aria-label={'QR de ' + individualQr.trackingCode} onClick={() => setIndividualQr(null)}>
                            <div className="w-full max-w-md max-h-[calc(100dvh-2rem)] overflow-y-auto overscroll-contain rounded-2xl border border-slate-700 bg-slate-900 p-4 sm:p-5 shadow-2xl space-y-3" style={{WebkitOverflowScrolling:'touch'}} onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start gap-3">
                                    <div>
                                        <h2 className="font-bold text-white text-lg">QR de {individualQr.trackingCode}</h2>
                                        <p className="text-xs text-slate-400 mt-1">{individualQr.businessName || 'Tarjeta sin negocio asignado'}</p>
                                    </div>
                                    <button type="button" aria-label="Cerrar QR" onClick={() => setIndividualQr(null)} className="p-2 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                {individualQrProtectedId===individualQr.id ? <>
                                <div className="bg-white rounded-xl p-3 mx-auto w-full max-w-[250px] aspect-square flex items-center justify-center">
                                    {individualQrImage ? <img src={individualQrImage} alt={'Código QR de '+individualQr.trackingCode} className="w-full h-full object-contain" /> : <span className="text-slate-700 text-sm">Generando QR...</span>}
                                </div>
                                <div className="flex items-center justify-between text-xs">
                                    <span className={individualQr.status === 'active' ? 'text-emerald-400' : 'text-amber-400'}>{individualQr.status === 'active' ? 'Tarjeta activa' : 'Pendiente de activación'}</span>
                                    <span className="font-mono text-slate-400">{individualQr.trackingCode}</span>
                                </div>
                                <dl className="grid grid-cols-2 gap-2 premium-panel text-xs break-words">
                                    {[
                                        ['Número de serie',cardNumber(individualQr)],
                                        ['Lote',individualQr.batchName||individualQr.batchId||'Sin lote'],
                                        ['Cliente',clients.find(client=>client.id===individualQr.clientId)?.name||'Sin asignar'],
                                        ['Plantilla',templates.find(tpl=>tpl.id===individualQr.designTemplateId)?.name||individualQr.designTemplateName||'Sin asignar'],
                                        ['Escaneos',serverAnalytics.scans===null?'—':getCardScans(individualQr)],
                                        ['Destino',individualQr.dynamicUrl||'Sin configurar']
                                    ].map(([label,value])=><div key={label} className="min-w-0"><dt className="text-slate-400">{label}</dt><dd>{value}</dd></div>)}
                                </dl>
                                <details className="premium-panel text-xs">
                                    <summary className="cursor-pointer font-semibold">Historial de la tarjeta</summary>
                                    {Array.isArray(individualQr.history)&&individualQr.history.length ?
                                        <ul className="mt-2 space-y-1 text-slate-300">
                                            {individualQr.history.slice(-10).reverse().map((event,index)=><li key={index}>{event?.description||event?.type||'Evento'}</li>)}
                                        </ul> : <p className="mt-2 text-slate-400">Sin eventos en el historial.</p>}
                                </details>
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={downloadIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-blue-600 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-download mr-2"></i>Descargar PNG</button>
                                    <button type="button" onClick={shareIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-slate-700 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-share-nodes mr-2"></i>Compartir</button>
                                </div>
                                <div className="rounded-xl border border-slate-700 bg-slate-950/60 p-3 space-y-2">
                                    <div className="flex items-center gap-2 text-slate-200 text-sm font-semibold"><i className="fa-brands fa-nfc-symbol text-cyan-400"></i> Enlace NFC de esta tarjeta</div>
                                    <p className="text-[11px] text-slate-400">Este enlace lleva a la misma tarjeta que el QR y permite actualizar su destino.</p>
                                    <div className="flex gap-2 items-center">
                                        <input aria-label="URL para grabar en NFC" readOnly value={getNfcTagUrl(individualQr.trackingCode)} onFocus={e=>e.target.select()} className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-900 text-slate-200 text-xs font-mono p-2.5" />
                                        <button type="button" onClick={async()=>{try{await navigator.clipboard.writeText(getNfcTagUrl(individualQr.trackingCode));showToast('Enlace NFC copiado.','success');}catch{showToast('Mantén pulsado el enlace para copiarlo.','info');}}} className="shrink-0 bg-blue-600 text-white text-xs font-semibold rounded-lg px-3 py-2.5"><i className="fa-solid fa-copy mr-1"></i>Copiar</button>
                                    </div>
                                    <details className="text-xs text-slate-300">
                                        <summary className="cursor-pointer text-cyan-300 font-semibold py-1">Cómo grabar el NFC</summary>
                                        <p className="mt-2 text-slate-400">iPhone: abre NFC Tools → Escribir → Añadir registro → URL/URI. Pega este enlace, pulsa Escribir y acerca el chip NFC al teléfono.</p>
                                        <p className="mt-2 text-slate-400">Android compatible: utiliza el botón NFC de Gestión de Tarjetas o NFC Tools.</p>
                                        <p className="mt-2 text-amber-300">Verifica el identificador impreso antes de grabar. Cada tarjeta del lote tiene un enlace distinto.</p>
                                    </details>
                                </div>
                                <a href={getBaseTagUrl(individualQr.trackingCode)} target="_blank" rel="noopener noreferrer" className="block text-center text-cyan-300 border border-cyan-500/30 rounded-xl py-2.5 text-sm font-semibold">Probar enlace QR <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i></a>
                                <p className="text-[11px] text-slate-400 text-center">Este QR conserva su identificador dinámico. El destino se administra desde Configurar.</p>
                                </> : <p className="text-sm text-slate-400" role="status">{individualQrProtectionError?'No se pudo preparar el QR. Cierra y vuelve a abrirlo para reintentar.':'Preparando QR de forma segura…'}</p>}
                            </div>
                        </div>
                    )}
                    {activateModal.open && <StableActivationModal key={activateModal.qr?.id} />}
                    {activationResult && <div className="fixed inset-0 z-[90] bg-black/80 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Tarjeta activada"><div className="w-full max-w-sm rounded-3xl border border-emerald-500/25 bg-slate-950 p-5 space-y-4 shadow-2xl"><div className="flex items-center gap-3"><span className="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-300 flex items-center justify-center"><i className="fa-solid fa-check"></i></span><div><h2 className="font-bold text-white">Tarjeta guardada y activa</h2><p className="text-[11px] text-slate-400 font-mono break-all">{activationResult.card.trackingCode}</p></div></div><p className="text-xs text-slate-300 break-all">Destino guardado: {activationResult.card.dynamicUrl}</p><a href={getBaseTagUrl(activationResult.card.trackingCode)} target="_blank" rel="noopener noreferrer" className="block text-center rounded-xl bg-blue-600 py-3 text-sm font-bold text-white">Probar QR activado</a><p className="text-[10px] text-slate-500">Abre el enlace dinámico de la tarjeta y registra una lectura.</p><button type="button" onClick={()=>setActivationResult(null)} className="w-full rounded-xl border border-slate-700 py-3 text-sm text-slate-200">Volver a tarjetas</button></div></div>}
                    <StableScanSimulatorModal />
                    <ConfirmModal />

                    {toast.show && (
                        <div className={'fixed left-1/2 -translate-x-1/2 bottom-6 z-[120] w-[calc(100%-24px)] max-w-md border px-4 py-4 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-xl '+(toast.type==='error'?'bg-rose-950/95 border-rose-500/40':toast.type==='success'?'bg-emerald-950/95 border-emerald-500/40':'bg-slate-950/95 border-slate-600')}>
                            <i className={'fa-solid text-xl '+(toast.type==='error'?'fa-circle-exclamation text-rose-300':toast.type==='success'?'fa-circle-check text-emerald-300':'fa-circle-info text-cyan-300')}></i>
                            <span className="text-[13px] leading-5 font-bold text-white">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        };

        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('No se cargo Supabase JS. Comprueba la conexion a la biblioteca externa.');
        }
        class TocaquiErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state={error:null}; }
          static getDerivedStateFromError(error) { return {error}; }
          componentDidCatch(error, info) { console.error('TOCAQUI runtime', error, info); }
          render() { return this.state.error
            ? <div style={{padding:24,color:'white',fontFamily:'system-ui'}}><h2>Error de interfaz TOCAQUI</h2><p>{String(this.state.error.message || this.state.error)}</p><p>Los datos locales no se han eliminado.</p></div>
            : this.props.children; }
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        const cloud=window.supabase.createClient('https://nasdgjalsfxnwymqicio.supabase.co','sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3');
root.render(<TocaquiErrorBoundary><App cloud={cloud} /></TocaquiErrorBoundary>);
    </script>
</body>
</html>
