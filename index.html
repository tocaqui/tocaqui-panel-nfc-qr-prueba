        const compressImageToDataURL = (file, targetWidth = 600, targetHeight = 950, quality = 0.9, fitMode = 'stretch') => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        if (fitMode === 'cover' || fitMode === 'contain') {\n                            if (targetWidth > targetHeight && img.height > img.width) {\n                                const rotated = document.createElement('canvas');\n                                rotated.width = img.height; rotated.height = img.width;\n                                const rc = rotated.getContext('2d');\n                                rc.translate(rotated.width / 2, rotated.height / 2); rc.rotate(-Math.PI / 2);\n                                rc.drawImage(img, -img.width / 2, -img.height / 2);\n                                const scale = (fitMode === 'contain' ? Math.min : Math.max)(targetWidth / rotated.width, targetHeight / rotated.height);\n                                const rw = rotated.width * scale, rh = rotated.height * scale;\n                                ctx.drawImage(rotated, (targetWidth-rw)/2, (targetHeight-rh)/2, rw, rh);\n                            } else {
                            const scale = (fitMode === 'contain' ? Math.min : Math.max)(targetWidth / img.width, targetHeight / img.height);
                            const renderW = img.width * scale, renderH = img.height * scale;
                            ctx.drawImage(img, (targetWidth - renderW) / 2, (targetHeight - renderH) / 2, renderW, renderH);\n                            }
                        } else {
                            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                        }
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

                const batchId = 'LOTE-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + crypto.randomUUID().slice(0,8).toUpperCase();
                const existing = new Set(qrs.map(q => q.id));

                    let code;
                    do { code = 'TAG-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2,'0')).join('').toUpperCase(); } while(existing.has(code));

            // 6. ADVANCED PRINT & MASSIVE A4 DUPLEX STUDIO
            const PrintView = () => {
                const [qrCodeImages, setQrCodeImages] = useState({});
                const [printBatchFilter, setPrintBatchFilter] = useState(() => {
                    const selected = qrs.filter(q => selectedQrIdsForSheet.includes(q.id));
                    const ids = [...new Set(selected.map(q=>q.batchId || 'legacy'))];
                    return selected.length && ids.length === 1 ? ids[0] : 'all';
                });
                const [previewZoom, setPreviewZoom] = useState(58);
                const [artworkFitMode, setArtworkFitMode] = useState('cover');
                const [customTemplateFileName, setCustomTemplateFileName] = useState({ front: '', back: '' });
                const [qrMoveEnabled, setQrMoveEnabled] = useState(true);
                const [qrDragPosition, setQrDragPosition] = useState(() => {
                    try {
                        const saved = JSON.parse(localStorage.getItem('tocaqui_print_qr_position_v1') || 'null');
                        return saved && Number.isFinite(saved.x) && Number.isFinite(saved.y) ? saved : null;
                    } catch { return null; }
                });
                const [qrDragDraft, setQrDragDraft] = useState(null);
                const qrDragRef = useRef(null);
                const activeQrPosition = qrDragDraft || qrDragPosition;
                const clampQr = value => Math.min(90, Math.max(10, value));
                const saveQrPosition = position => {
                    const next = {x:clampQr(position.x), y:clampQr(position.y)};
                    setQrDragPosition(next);
                    localStorage.setItem('tocaqui_print_qr_position_v1', JSON.stringify(next));
                    return next;
                };
                const nudgeQr = (dx,dy) => {
                    const current = qrDragPosition || {x:50,y:50};
                    saveQrPosition({x:current.x+dx,y:current.y+dy});
                };
                const updateQrDrag = event => {
                    const drag = qrDragRef.current;
                    if (!drag || event.pointerId !== drag.pointerId) return;
                    const rect = drag.card.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const x = clampQr(drag.start.x + (event.clientX-drag.startClientX)/rect.width*100);
                    const y = clampQr(drag.start.y + (event.clientY-drag.startClientY)/rect.height*100);
                    setQrDragDraft({x,y});
                };
                const finishQrDrag = event => {
                    const drag=qrDragRef.current;
                    if(!drag || event.pointerId!==drag.pointerId)return;
                    const rect=drag.card.getBoundingClientRect();
                    if(rect.width && rect.height) {
                        const x=clampQr(drag.start.x+(event.clientX-drag.startClientX)/rect.width*100);
                        const y=clampQr(drag.start.y+(event.clientY-drag.startClientY)/rect.height*100);
                        saveQrPosition({x,y});
                    }
                    setQrDragDraft(null);
                    qrDragRef.current=null;
                };

                const itemsPerPage = printConfig.templateType === '10x15' ? 2 : printConfig.templateType === 'pvc-vertical' ? 9 : 10;
                const printBatches = useMemo(() => [...new Map(qrs.map(q => [q.batchId || 'legacy', {id:q.batchId || 'legacy',name:q.batchName || 'Tarjetas anteriores'}])).values()], [qrs]);
                const visiblePrintQrs = useMemo(() => qrs.filter(q => printBatchFilter === 'all' || (q.batchId || 'legacy') === printBatchFilter), [qrs, printBatchFilter]);
                const selectedItems = useMemo(() => {
                    return visiblePrintQrs.filter(q => selectedQrIdsForSheet.includes(q.id));
                }, [visiblePrintQrs, selectedQrIdsForSheet]);

                const pages = useMemo(() => {
                    const result = [];
                    for (let i = 0; i < selectedItems.length; i += itemsPerPage) {
                        result.push(selectedItems.slice(i, i + itemsPerPage));
                    }
                    return result;
                }, [selectedItems, itemsPerPage]);

                useEffect(() => {
                    selectedItems.forEach(item => {
                        const tagUrl = getBaseTagUrl(item.trackingCode);
                        generateQRBase64(tagUrl, 280).then(url => {
                            setQrCodeImages(prev => ({ ...prev, [item.id]: url }));
                        });
                    });
                }, [selectedItems]);

                const toggleSelectAll = () => {
                    const visibleIds = visiblePrintQrs.map(q=>q.id);
                    const allSelected = visibleIds.every(id=>selectedQrIdsForSheet.includes(id));
                    setSelectedQrIdsForSheet(prev => allSelected ? prev.filter(id=>!visibleIds.includes(id)) : [...new Set([...prev,...visibleIds])]);
                };

                const renderCardContent = (item, side = printConfig.activeSide) => {
                    const qrImg = qrCodeImages[item.id] || '';

                    const alignY = printConfig.qrPosY === 'top' ? 'items-start pt-2' : printConfig.qrPosY === 'bottom' ? 'items-end pb-2' : 'items-center';
                    const alignX = printConfig.qrPosX === 'left' ? 'justify-start pl-2' : printConfig.qrPosX === 'right' ? 'justify-end pr-2' : 'justify-center';

                    const cardClass = printConfig.templateType === 'pvc-vertical' ? "card-pvc-vertical p-3 flex flex-col justify-between mx-auto" :
                        printConfig.templateType === 'pvc-horizontal' ? "card-pvc-horizontal p-3 flex flex-col justify-between mx-auto" :
                        "card-poster-10x15 p-5 flex flex-col justify-between mx-auto";

                    const bgToUse = side === 'front' ? printConfig.customFrontBg : printConfig.customBackBg;

                    return (
                        <div
                            key={item.id}
                            className={cardClass}
                            style={{
                                background: bgToUse
                                    ? `#ffffff url("${bgToUse}") center/cover no-repeat`
                                    : printConfig.theme === 'gold-luxury'
                                    ? 'linear-gradient(135deg, #0f172a 0%, #312e81 100%)'
                                    : printConfig.theme === 'clean-white'
                                    ? '#ffffff'
                                    : 'linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%)',
                                color: printConfig.theme === 'clean-white' ? '#0f172a' : '#ffffff'
                            }}
                        >
                            {side === 'back' && <div className="flex justify-between items-center text-[9px] font-bold uppercase tracking-wider">
                                <span className="truncate max-w-[120px]">{item.businessName || 'NFC CARD'}</span>
                                <i className="fa-solid fa-nfc-symbol text-xs text-blue-400"></i>
                            </div>}

                            {/* Only show QR Code on Front side */}
                            {side === 'front' && (
                                <div className={activeQrPosition ? 'absolute inset-0 pointer-events-none' : `flex-1 flex ${alignY} ${alignX} my-1`}>
                                    <div
                                        onPointerDown={event => {
                                            if (!qrMoveEnabled || !event.currentTarget.closest('.a4-sheet-preview')) return;
                                            event.preventDefault();
                                            const card = event.currentTarget.closest('.card-pvc-vertical, .card-pvc-horizontal, .card-poster-10x15');
                                            if (!card) return;
                                            const rect = card.getBoundingClientRect();
                                            const elementRect = event.currentTarget.getBoundingClientRect();
                                            const start = activeQrPosition || {x: ((elementRect.left+elementRect.width/2-rect.left)/rect.width)*100, y: ((elementRect.top+elementRect.height/2-rect.top)/rect.height)*100};
                                            qrDragRef.current = {card, pointerId:event.pointerId, start, startClientX:event.clientX, startClientY:event.clientY};
                                            event.currentTarget.setPointerCapture(event.pointerId);
                                        }}
                                        onPointerMove={event => { if (qrDragRef.current) { event.preventDefault(); updateQrDrag(event); } }}
                                        onPointerUp={finishQrDrag}
                                        onPointerCancel={() => { qrDragRef.current = null; setQrDragDraft(null); }}
                                        style={activeQrPosition ? { position: 'absolute', left: activeQrPosition.x + '%', top: activeQrPosition.y + '%', transform: 'translate(-50%, -50%)', pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default', zIndex: 5 } : { pointerEvents: qrMoveEnabled ? 'auto' : 'none', touchAction: qrMoveEnabled ? 'none' : 'auto', cursor: qrMoveEnabled ? 'grab' : 'default' }}
                                        className={`transition-all ${
                                            printConfig.qrBgStyle === 'white-box' ? 'bg-white rounded-xl shadow-md p-1.5' :
                                            printConfig.qrBgStyle === 'glass' ? 'bg-white/25 backdrop-blur-md border border-white/30 rounded-xl p-1.5 shadow-lg' :
                                            printConfig.qrBgStyle === 'dark-box' ? 'bg-slate-900/90 text-white border border-slate-700 rounded-xl p-1.5 shadow-md' :
                                            'bg-transparent p-0'
                                        }`}
                                    >
                                        <img
                                            src={qrImg}
                                            alt="QR Code"
                                            style={{ width: `${printConfig.qrSizePx}px`, height: `${printConfig.qrSizePx}px` }}
                                            className="object-contain block"
                                        />
                                    </div>
                                </div>
                            )}

                            {side === 'back' && (
                                <div className="flex-1 flex items-center justify-center text-center p-2">
                                    <span className="text-[10px] font-semibold opacity-70 break-words">{item.businessName || 'TOCAQUI · Tarjeta NFC / QR'}</span>
                                </div>
                            )}

                            {side === 'back' && <div className="flex justify-between items-end text-[8px] font-mono">
                                <span className="text-[7px] truncate max-w-[90px]">{item.businessAddress || 'TOCAQUI'}</span>
                            </div>}
                            {(printConfig.idPosition === 'back' ? side === 'back' : side === 'front') && printConfig.idPosition !== 'hidden' && (
                                <span className={`absolute z-10 font-mono font-bold ${printConfig.idOpacity} ${printConfig.idFontSize}`}
                                    style={{
                                        ...(printConfig.idPosition === 'top-left' ? {top:'5%',left:'5%'} :
                                            printConfig.idPosition === 'top-right' ? {top:'5%',right:'5%'} :

            // 7. CLIENT PORTAL VIEW
            const ClientPortalView = () => {
                const currentClient = clients[0];
                const clientQrs = qrs.filter(q => q.clientId === currentClient?.id);
                const [editingQr, setEditingQr] = useState(null);
                const [newUrl, setNewUrl] = useState('');

                return (
                    <div className="max-w-4xl mx-auto space-y-6">

                                    <div className="p-3 bg-slate-900 rounded-xl text-xs font-mono text-blue-400 truncate border border-slate-800">{qr.dynamicUrl || 'Sin enlace'}</div>
                                    <button onClick={() => { setEditingQr(qr); setNewUrl(qr.dynamicUrl); }} className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl">
                                        Cambiar Enlace Dinámico
                                    </button>
                                </div>
                            ))}
                        </div>

                        {editingQr && (
                            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="glass-panel w-full max-w-md rounded-2xl p-6 border border-slate-700 space-y-4">
                                    <h3 className="font-bold text-white">Modificar URL de Destino</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); updateQR(editingQr.id, { dynamicUrl: sanitizeUrl(newUrl) }); setEditingQr(null); }} className="space-y-4">
                                        <input type="url" required value={newUrl} onChange={e => setNewUrl(e.target.value)} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm font-mono" placeholder="https://..." />
                                        <button type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">Guardar Destino</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // Local, approximate Places usage: counts requests made by this browser only.
            const PLACES_USAGE_STORAGE = 'tocaqui_places_usage_v1';
            const currentPlacesMonth = () => new Date().toISOString().slice(0, 7);
            const readPlacesUsage = () => {
                const month = currentPlacesMonth();
                try {
                    const stored = JSON.parse(localStorage.getItem(PLACES_USAGE_STORAGE) || '{}');
                    if (stored.month === month) return { month, requests: Number(stored.requests) || 0, successes: Number(stored.successes) || 0, errors: Number(stored.errors) || 0, selections: Number(stored.selections) || 0 };
                } catch (e) {}
                return { month, requests: 0, successes: 0, errors: 0, selections: 0 };
            };
            const recordPlacesUsage = (type) => {
                try {
                    const next = readPlacesUsage();
                    if (type === 'request') next.requests++;
                    if (type === 'success') next.successes++;
                    if (type === 'error') next.errors++;
                    if (type === 'selection') next.selections++;
                    localStorage.setItem(PLACES_USAGE_STORAGE, JSON.stringify(next));
                    window.dispatchEvent(new Event('tocaqui-places-usage-updated'));
                } catch (e) {}
            };

            const SettingsView = () => {

                const [placesUsage, setPlacesUsage] = useState(readPlacesUsage);

                    window.addEventListener('tocaqui-places-usage-updated', refresh);
                    return () => window.removeEventListener('tocaqui-places-usage-updated', refresh);
                }, []);


                const saveSettings = async () => {
 try{
 if(pinInput||oldPinInput){
 if(!/^[0-9]{4}$/.test(pinInput)||!/^[0-9]{4}$/.test(oldPinInput))throw new Error('Ingresa PIN actual y nuevo PIN de cuatro dígitos');
 await workshopApi({action:'changePin',session:workshopSession,currentPin:oldPinInput,newPin:pinInput});
 setMasterPin(pinInput);localStorage.removeItem('nfc_master_pin_v6');setPinInput('');setOldPinInput('');
 }
 setGoogleApiKey(keyInput);showToast('Configuración guardada. PIN actualizado en Supabase.','success');
 }catch(e){showToast(e.message,'error')}
 };

                return (

                        <div className="glass-panel p-6 rounded-2xl space-y-4">

                            </h2>
                            <div className="flex gap-2 max-w-xs">
                                <input type="password" inputMode="numeric" maxLength="4" value={oldPinInput} onChange={e=>setOldPinInput(e.target.value.replace(/\D/g,''))} placeholder="PIN actual" className="glass-input px-2 py-2 rounded-xl w-28" />

                                    inputMode="numeric"

                                <i className="fa-brands fa-google text-blue-400"></i> Google Places API Key
                            </h2>
                            <div className="flex gap-2">
                                <input
                                    type="password"
                                    value={keyInput}
                                    onChange={e => setKeyInput(e.target.value)}
                                    placeholder="AIzaSyB..."
                                    className="flex-1 glass-input px-3.5 py-2.5 rounded-xl text-sm font-mono"
                                />
                                <button onClick={saveSettings} className="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2.5 rounded-xl text-xs">
                                    Guardar Key
                                </button>
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-2xl space-y-3">
                            <h2 className="text-lg font-bold text-white"><i className="fa-solid fa-chart-simple text-cyan-400 mr-2"></i>Consultas Google Places</h2>
                            <p className="text-xs text-slate-400">Contador local del mes {placesUsage.month}. Solo registra la actividad de este navegador desde que se activó el contador; no representa el consumo total de Google Cloud ni el saldo gratuito restante.</p>
                            <div className="grid grid-cols-2 gap-2">
                                <div className="rounded-xl bg-slate-800/70 p-3"><div className="text-xl font-bold text-cyan-300">{placesUsage.selections}</div><div className="text-xs text-slate-400">Negocios seleccionados</div></div>
                                <div className="rounded-xl bg-slate-800/70 p-3"><div className="text-xl font-bold text-white">{placesUsage.requests}</div><div className="text-xs text-slate-400">Solicitudes automáticas</div></div>
                                <div className="rounded-xl bg-slate-800/70 p-3"><div className="text-xl font-bold text-emerald-300">{placesUsage.successes}</div><div className="text-xs text-slate-400">Correctas</div></div>
                                <div className="rounded-xl bg-slate-800/70 p-3"><div className="text-xl font-bold text-rose-300">{placesUsage.errors}</div><div className="text-xs text-slate-400">Errores</div></div>
                            </div>
                            <p className="text-xs text-amber-200/80">Una búsqueda escrita puede generar varias solicitudes automáticas. Las selecciones se cuentan al elegir un negocio de Google. Google factura según SKU y sesiones; estas cifras no son el saldo oficial.</p>

                                <input type="text" placeholder="Folder ID de Google Drive" value={driveConfig.folderId} onChange={e => setDriveConfig({...driveConfig, folderId: e.target.value})} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs font-mono" />

            // MODAL ACTIVATION FLOW WITH SECURITY PIN & GOOGLE PLACES
            const ActivationModal = () => {
                if (!activateModal.open) return null;
                const qr = activateModal.qr;

                const [pinEntered, setPinEntered] = useState('');
                const [pinVerified, setPinVerified] = useState(false);
                const [pinError, setPinError] = useState(false);
                const [activationSaving, setActivationSaving] = useState(false);
                const [deviceCredential,setDeviceCredential]=useState(()=>localStorage.getItem('tocaqui_device_credential_v1')||'');
                const [pairCode,setPairCode]=useState('');
                const [pairError,setPairError]=useState('');
                const [pairBusy,setPairBusy]=useState(false);
                const deviceApi=async payload=>{
                    const response=await fetch('https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-device-activation',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3'},body:JSON.stringify(payload)});
                    const result=await response.json();
                    if(!response.ok||!result.ok)throw new Error(result.error||'Solicitud rechazada');
                    return result;
                };
                const pairDevice=async()=>{
                    if(pairBusy)return;
                    setPairBusy(true);setPairError('');
                    try{
                        const result=await deviceApi({action:'pair',code:pairCode.trim().toLowerCase(),label:/iPhone|iPad/i.test(navigator.userAgent)?'iPhone TOCAQUI':'Computador TOCAQUI'});
                        localStorage.setItem('tocaqui_device_credential_v1',result.credential);
                        setDeviceCredential(result.credential);setPairCode('');
                        showToast('Dispositivo vinculado. Usa tu PIN.','success');
                    }catch(e){setPairError(e.message||'No se pudo vincular');}
                    finally{setPairBusy(false);}
                };

                const [searchQuery, setSearchQuery] = useState('');
                const [selectedPlace, setSelectedPlace] = useState(qr.businessName ? { name: qr.businessName, address: qr.businessAddress || '', placeId: qr.placeId || 'ChIJMock' } : null);
                const [presetType, setPresetType] = useState(qr.functionType || 'review_gate');
                const [customUrl, setCustomUrl] = useState(qr.dynamicUrl || '');
                const [assignedClient, setAssignedClient] = useState(qr.clientId || clients[0]?.id || '');

                const [placeSuggestions, setPlaceSuggestions] = useState([]);
                const [placesLoading, setPlacesLoading] = useState(false);
                const [placesError, setPlacesError] = useState('');
                const placesSessionTokenRef = useRef(null);
                const placesRequestIdRef = useRef(0);
                const [manualPlaceId,setManualPlaceId]=useState(qr.placeId||'');
                const [manualBusinessName,setManualBusinessName]=useState(qr.businessName||'');

                useEffect(() => {
                    const query = searchQuery.trim();
                    if (!googleApiKey || query.length < 2 || selectedPlace) {
                        setPlaceSuggestions([]);
                        setPlacesLoading(false);
                        if (!googleApiKey) setPlacesError('');
                        return;
                    }

                    const requestId = ++placesRequestIdRef.current;
                    const timer = setTimeout(async () => {
                        setPlacesLoading(true);
                        setPlacesError('');
                        try {
                            const { AutocompleteSuggestion, AutocompleteSessionToken } = await loadGooglePlacesLibrary(googleApiKey);
                            if (!placesSessionTokenRef.current) {
                                placesSessionTokenRef.current = new AutocompleteSessionToken();
                            }
                            recordPlacesUsage('request');
                            const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
                                input: query,
                                region: 'cl',
                                language: 'es-CL',
                                sessionToken: placesSessionTokenRef.current
                            });
                            recordPlacesUsage('success');
                            if (requestId !== placesRequestIdRef.current) return;
                            setPlaceSuggestions(
                                (suggestions || [])
                                    .map(item => item.placePrediction)
                                    .filter(Boolean)
                                    .slice(0, 6)
                            );
                        } catch (err) {
                            if (requestId !== placesRequestIdRef.current) return;
                            console.error('Google Places autocomplete error', err);
                            recordPlacesUsage('error');
                            setPlaceSuggestions([]);
                            setPlacesError('No se pudo consultar Google Places. Revisa la API Key y que Places API (New) esté habilitada.');
                        } finally {
                            if (requestId === placesRequestIdRef.current) setPlacesLoading(false);
                        }
                    }, 350);

                    return () => clearTimeout(timer);
                }, [searchQuery, selectedPlace, googleApiKey]);

                const selectGooglePlace = async (prediction) => {
                    setPlacesLoading(true);
                    setPlacesError('');
                    try {
                        const place = prediction.toPlace();
                        await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
                        const picked = {
                            name: place.displayName || prediction.mainText?.text || prediction.text?.text || 'Negocio',
                            address: place.formattedAddress || prediction.secondaryText?.text || '',
                            placeId: prediction.placeId
                        };
                        setSelectedPlace(picked);
                        recordPlacesUsage('selection');
                        setManualBusinessName(picked.name);
                        setManualPlaceId(picked.placeId || '');
                        setSearchQuery('');
                        setPlaceSuggestions([]);
                        placesSessionTokenRef.current = null;
                    } catch (err) {
                        console.error('Google Places selection error', err);
                        setPlacesError('No se pudieron cargar los datos del negocio seleccionado.');
                    } finally {
                        setPlacesLoading(false);
                    }
                };
                const handleConfirmActivation = async () => {
                    if (activationSaving) return;
                    setPinError(false);

                    if (presetType !== 'custom_url' && (!selectedPlace?.placeId || !selectedPlace?.name)) {
                        showToast('Debes seleccionar un negocio real con Place ID', 'error');
                        return;
                    }
                    if (presetType === 'custom_url' && !/^https:\/\//i.test(customUrl)) {
                        showToast('Introduce una URL HTTPS válida', 'error');
                        return;
                    }
                    if (!/^\d{4}$/.test(pinEntered)) {
                        setPinError(true);
                        showToast('Ingresa el PIN de activación de 4 dígitos.', 'warning');
                        return;
                    }

                    setActivationSaving(true);
                    try {
                        if(!deviceCredential)throw new Error('Vincula este dispositivo primero.');

                        let finalUrl = customUrl;
                        if ((presetType === 'google_review' || presetType === 'review_gate') && selectedPlace) {
                            finalUrl = `https://search.google.com/local/writereview?placeid=${selectedPlace.placeId}`;
                        }
                        finalUrl = sanitizeUrl(finalUrl);

                        const existingCard = qrs.find(item => item.id === qr.id) || qr;
                        const now = Date.now();
                        const history = [...(existingCard.history || [])];

                        if (finalUrl && finalUrl !== existingCard.dynamicUrl) {
                            history.push({
                                timestamp: now,
                                type: 'update',
                                description: `Cambio de URL: ${existingCard.dynamicUrl || 'vacía'} → ${finalUrl}`
                            });
                        }
                        if (assignedClient && assignedClient !== existingCard.clientId) {
                            const cl = clients.find(c => c.id === assignedClient);
                            history.push({
                                timestamp: now,
                                type: 'assignment',
                                description: `Asignada a cliente: ${cl ? cl.name : assignedClient}`
                            });
                        }
                        history.push({
                            timestamp: now,
                            type: 'activation',
                            description: `Tarjeta activada con función ${presetType}`
                        });

                        const activatedCard = {
                            ...existingCard,
                            status: 'active',
                            clientId: assignedClient,
                            businessName: selectedPlace ? selectedPlace.name : (existingCard.businessName || 'Negocio Asignado'),
                            businessAddress: selectedPlace ? selectedPlace.address : (existingCard.businessAddress || ''),
                            placeId: selectedPlace ? selectedPlace.placeId : (existingCard.placeId || null),
                            functionType: presetType,
                            dynamicUrl: finalUrl,
                            updatedAt: now,
                            history
                        };

                        try {
                            await deviceApi({action:'activate',credential:deviceCredential,pin:pinEntered,card:activatedCard});
                        } catch(error) {
                            setPinError(true);
                            if(/device not authorized/i.test(error.message||'')){
                                localStorage.removeItem('tocaqui_device_credential_v1');
                                setDeviceCredential('');
                            }
                            throw error;
                        }
                        setPinVerified(true);

                        setQrs(prev => {
                            const exists = prev.some(item => item.id === activatedCard.id);
                            return exists
                                ? prev.map(item => item.id === activatedCard.id ? activatedCard : item)
                                : [activatedCard, ...prev];
                        });

                        const previousCloud = last.current.qrs || [];
                        last.current = {
                            ...last.current,
                            qrs: previousCloud.some(item => item.id === activatedCard.id)
                                ? previousCloud.map(item => item.id === activatedCard.id ? activatedCard : item)
                                : [activatedCard, ...previousCloud]
                        };

                        showToast('Tarjeta activada y guardada en Supabase.', 'success');
                        setActivateModal({ open: false, qr: null });
                    } catch (err) {
                        console.error('Activation error', err);
                        const message = String(err?.message || err || '');
                        if (/PIN de activación requerido/i.test(message)) setPinError(true);
                        showToast('No se pudo activar la tarjeta: ' + message, 'error');
                    } finally {
                        setActivationSaving(false);
                    }
                };

                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-xl rounded-2xl p-6 border border-slate-700 max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg text-white">Configurar Tarjeta {cardNumber(qr)}</h3>
                                <button onClick={() => setActivateModal({ open: false, qr: null })} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>

                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">1. Vincular a Cliente</label>
                                        <div className="max-h-40 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2" role="group" aria-label="Seleccionar cliente">
                                            {clients.map(c => <button key={c.id} type="button" aria-pressed={assignedClient===c.id} onClick={()=>setAssignedClient(c.id)}
                                                className={`rounded-lg border p-2.5 text-left text-xs ${assignedClient===c.id?'border-blue-400 bg-blue-600/20 text-white':'border-slate-700 bg-slate-900 text-slate-300'}`}>
                                                <span className="block font-semibold truncate">{c.name}</span><span className="block text-[10px] text-slate-400 truncate">{c.company}</span>
                                            </button>)}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">2. Vincular negocio por Place ID real</label>
                                        {!googleApiKey ? (
                                            <p className="text-xs text-amber-300 mb-2">Google Places está listo para integrarse, pero falta guardar la API Key en Configuración & APIs. Mientras tanto puedes ingresar el Place ID oficial manualmente.</p>
                                        ) : (
                                            <p className="text-xs text-emerald-300 mb-2">Búsqueda real de Google Places habilitada. También puedes usar el Place ID oficial manualmente.</p>
                                        )}
                                        <input type="text" className="w-full glass-input px-3 py-2 mb-2" placeholder="Nombre comercial" value={manualBusinessName} onChange={e=>setManualBusinessName(e.target.value)}/>
                                        <input type="text" className="w-full glass-input px-3 py-2 mb-2" placeholder="Place ID (ChIJ...)" value={manualPlaceId} onChange={e=>setManualPlaceId(e.target.value)}/>
                                        <button type="button" onClick={()=>{if(manualPlaceId.trim()&&manualBusinessName.trim())setSelectedPlace({name:manualBusinessName.trim(),address:'',placeId:manualPlaceId.trim()})}} className="bg-slate-700 rounded px-3 py-2 text-xs mb-2">Aplicar Place ID</button>

                                        <div className="relative">
                                            <input
                                                type="text"
                                                placeholder={googleApiKey ? "Buscar negocio real en Google..." : "Guarda la API Key para buscar negocios..."}
                                                value={searchQuery}
                                                disabled={!googleApiKey}
                                                onChange={e => { setSearchQuery(e.target.value); setSelectedPlace(null); }}
                                                className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                                            />
                                            {placesLoading && (
                                                <i className="fa-solid fa-spinner fa-spin absolute right-3 top-3 text-blue-400 text-sm"></i>
                                            )}
                                        </div>
                                        {placesError && <p className="text-[11px] text-red-300 mt-2">{placesError}</p>}
                                        {searchQuery && !selectedPlace && placeSuggestions.length > 0 && (
                                            <div className="mt-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-800">
                                                {placeSuggestions.map((prediction, idx) => (
                                                    <button
                                                        type="button"
                                                        key={prediction.placeId || idx}
                                                        onClick={() => selectGooglePlace(prediction)}
                                                        className="w-full p-3 hover:bg-slate-800 cursor-pointer text-xs flex justify-between items-center text-left"
                                                    >
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-white truncate">{prediction.mainText?.text || prediction.text?.text || 'Negocio'}</div>
                                                            <div className="text-slate-400 truncate">{prediction.secondaryText?.text || prediction.text?.text || ''}</div>
                                                        </div>
                                                        <span className="text-blue-400 font-mono text-[10px] ml-3 flex-shrink-0">Seleccionar</span>
                                                    </button>
                                                ))}
                                                <div className="px-3 py-2 text-[10px] text-slate-500 text-right">Resultados de Google</div>
                                            </div>
                                        )}
                                        {selectedPlace && (
                                            <div className="mt-2 bg-blue-600/10 border border-blue-500/30 p-3 rounded-xl flex justify-between items-center text-xs">
                                                <div><div className="font-bold text-white">{selectedPlace.name}</div><div className="text-slate-400">{selectedPlace.address}</div></div>
                                                <button onClick={() => setSelectedPlace(null)} className="text-slate-400 hover:text-red-400">Cambiar</button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-2">3. Función de Destino</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'review_gate', name: 'Filtro 5 Estrellas (Review Gate)' },
                                                { id: 'google_review', name: 'Directo Google Reviews' },

                                    )}

                                    {!deviceCredential && <div className="glass-panel p-4 rounded-2xl border border-blue-500/20 space-y-2">
                                        <label className="block text-xs font-semibold text-slate-300 uppercase">Vincular dispositivo (una sola vez)</label>

                                        <input value={pairCode} onChange={e=>setPairCode(e.target.value.trim().toLowerCase())} className="w-full glass-input px-3.5 py-3 rounded-xl text-xs font-mono" placeholder="Código de vinculación" autoComplete="off" />
                                        {pairError && <p role="alert" className="text-[11px] text-red-300">{pairError}</p>}
                                        <button type="button" onClick={pairDevice} disabled={pairBusy||!/^[a-f0-9]{64}$/.test(pairCode)} className="w-full py-2.5 bg-blue-600 rounded-xl text-sm font-semibold text-white disabled:opacity-40">{pairBusy?'Vinculando...':'Vincular dispositivo'}</button>
                                    </div>}
                                    {deviceCredential && <p className="text-[11px] text-emerald-300">Dispositivo vinculado. Usa tu PIN para activar.</p>}
                                    <div className="glass-panel p-4 rounded-2xl border border-amber-500/20 space-y-2">

                                                <label className="block text-xs font-semibold text-slate-300 uppercase">4. PIN de activación</label>
                                                <p className="text-[10px] text-slate-500 mt-0.5">El PIN autoriza durante 5 minutos el cambio a estado activo.</p>

                                                <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">VERIFICADO</span>
                                            )}
                                        </div>
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            autoComplete="one-time-code"
                                            maxLength="4"
                                            value={pinEntered}
                                            onChange={e => {
                                                setPinEntered(e.target.value.replace(/\D/g, '').slice(0, 4));
                                                setPinError(false);
                                                setPinVerified(false);
                                            }}
                                            className={`w-full glass-input px-3.5 py-3 rounded-xl text-center text-lg font-mono font-bold tracking-[0.45em] ${pinError ? 'border-red-500/70' : ''}`}
                                            placeholder="••••"
                                            aria-label="PIN de activación"

                                    </div>

                                    <button
                                        onClick={handleConfirmActivation}
                                        disabled={activationSaving}
                                        className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 disabled:opacity-50 disabled:cursor-wait text-white font-bold rounded-xl shadow-lg"
                                    >
                                        {activationSaving ? 'Validando y activando...' : 'Guardar y Activar Tarjeta'}
                                    </button>
                                </div>
                        </div>
                    </div>
                );
            };

            // Preview only: does not perform a real scan or change card activation.
            const ScanSimulatorModal = () => {
                const [query,setQuery]=useState('');
                const [lot,setLot]=useState('all');
                const [status,setStatus]=useState('all');
                const [cameraOn,setCameraOn]=useState(false);
                const [cameraError,setCameraError]=useState('');
                const videoRef=useRef(null),streamRef=useRef(null),frameRef=useRef(null);
                const stop=()=>{if(frameRef.current)cancelAnimationFrame(frameRef.current);frameRef.current=null;if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;setCameraOn(false);};
                useEffect(()=>()=>{if(frameRef.current)cancelAnimationFrame(frameRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());},[]);
                const scanValue=value=>{
                    const match=String(value||'').match(/TAG-[A-Z0-9-]+/i);
                    if(!match){setCameraError('Este QR no contiene un TAG de TOCAQUI.');return;}
                    const card=qrs.find(q=>q.trackingCode?.toUpperCase()===match[0].toUpperCase());
                    stop();
                    if(card){setCameraError('');setScanSimModal(prev=>({...prev,code:card.trackingCode}));}
                    else setCameraError('El TAG leído no está en el inventario cargado.');
                };
                const start=async()=>{
                    setCameraError('');
                    if(!navigator.mediaDevices?.getUserMedia){setCameraError('La cámara requiere HTTPS y permisos de Safari.');return;}
                    try{
                        let decoder=window.jsQR;
                        if(!decoder) decoder=await new Promise((resolve,reject)=>{
                            const script=document.createElement('script');
                            script.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
                            script.onload=()=>window.jsQR?resolve(window.jsQR):reject(new Error('decoder'));
                            script.onerror=()=>reject(new Error('decoder'));
                            document.head.appendChild(script);
                        });
                        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
                        streamRef.current=stream;
                        const video=videoRef.current;
                        if(!video){stop();return;}
                        video.srcObject=stream;await video.play();setCameraOn(true);
                        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
                        const tick=()=>{
                            if(!streamRef.current)return;
                            if(video.readyState>=2&&video.videoWidth){
                                canvas.width=video.videoWidth;canvas.height=video.videoHeight;
                                ctx.drawImage(video,0,0);
                                const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
                                const found=decoder(pixels.data,pixels.width,pixels.height,{inversionAttempts:'attemptBoth'});
                                if(found?.data){scanValue(found.data);return;}
                            }
                            frameRef.current=requestAnimationFrame(tick);
                        };
                        frameRef.current=requestAnimationFrame(tick);
                    }catch(e){stop();setCameraError(e?.name==='NotAllowedError'?'Permite el uso de la cámara en Safari.':'No se pudo iniciar el lector. Revisa tu conexión.');}
                };
                const lots=[...new Map(qrs.map(q=>[q.batchId||'legacy',{id:q.batchId||'legacy',name:q.batchName||'Sin lote'}])).values()];
                const filtered=qrs.filter(q=>(lot==='all'||(q.batchId||'legacy')===lot)&&(status==='all'||(status==='active'?q.status==='active':q.status!=='active'))&&(!query||[q.trackingCode,q.businessName,q.batchName].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())))).slice(0,25);
                if (!scanSimModal.open) return null;
                const scannedQr = qrs.find(q => q.trackingCode === scanSimModal.code);
                const isActive = scannedQr?.status === 'active';
                const close = () => {stop();setScanSimModal({open:false,code:'',reviewGateStep:'stars',selectedStars:0});};
                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-md max-h-[90dvh] overflow-y-auto rounded-3xl p-5 sm:p-6 border border-slate-700 relative">
                            <button type="button" onClick={close} aria-label="Cerrar prueba" className="absolute top-4 right-4 w-9 h-9 rounded-lg bg-slate-800 text-slate-300"><i className="fa-solid fa-xmark"></i></button>
                            <div className="flex items-center gap-3 pr-10 mb-5">
                                <div className="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400"><i className="fa-solid fa-mobile-screen-button"></i></div>
                                <div><h3 className="font-bold text-white text-lg">Probar una tarjeta</h3><p className="text-xs text-slate-400">Vista de prueba · no registra escaneos</p></div>
                            </div>
                            <video ref={videoRef} playsInline muted autoPlay className={`w-full aspect-video object-cover bg-black rounded-xl mb-2 ${cameraOn?'block':'hidden'}`}></video>
                            <button type="button" onClick={cameraOn?stop:start} className="w-full min-h-12 bg-blue-600 text-white font-semibold rounded-xl mb-2"><i className="fa-solid fa-camera mr-2"></i>{cameraOn?'Detener cámara':'Escanear QR con cámara'}</button>
                            {cameraError&&<p role="alert" className="text-xs text-amber-300 mb-2">{cameraError}</p>}
                            <label htmlFor="scan-query" className="block text-xs font-semibold text-slate-300 mb-1">Buscar TAG o negocio</label>
                            <input id="scan-query" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar tarjeta" className="glass-input w-full rounded-xl px-3 py-2.5 mb-2"/>
                            <div className="grid grid-cols-2 gap-2 mb-3">
                              <div><label htmlFor="scan-lot" className="text-xs text-slate-400">Lote</label><select id="scan-lot" value={lot} onChange={e=>setLot(e.target.value)} className="glass-input w-full p-2 rounded-xl text-xs"><option value="all">Todos</option>{lots.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</select></div>
                              <div><label htmlFor="scan-state" className="text-xs text-slate-400">Estado</label><select id="scan-state" value={status} onChange={e=>setStatus(e.target.value)} className="glass-input w-full p-2 rounded-xl text-xs"><option value="all">Todas</option><option value="active">Activas</option><option value="pending">Pendientes</option></select></div>
                            </div>
                            <label className="block text-xs font-semibold text-slate-300 mb-2">Selecciona una tarjeta (máximo 25 resultados)</label>
                            <div className="max-h-44 overflow-y-auto space-y-1.5 rounded-xl border border-slate-700 bg-slate-950/50 p-2">
                                {filtered.length === 0 && <p className="text-xs text-slate-400 p-3">Todavía no hay tarjetas para probar.</p>}
                                {filtered.map(q => (
                                    <button key={q.id} type="button" onClick={()=>setScanSimModal(prev=>({...prev,code:q.trackingCode,reviewGateStep:'stars',selectedStars:0}))} className={`w-full flex items-center justify-between gap-2 rounded-lg px-3 py-2.5 text-left border transition-colors ${scanSimModal.code===q.trackingCode?'border-blue-500 bg-blue-500/15':'border-transparent hover:bg-slate-800'}`}>
                                        <span className="min-w-0"><span className="block text-sm font-mono text-white truncate">{cardNumber(q)}</span><span className="block text-[11px] text-slate-400 truncate">{q.businessName || q.batchName || 'Sin negocio asignado'}</span></span>
                                        <span className={`shrink-0 text-[10px] font-semibold px-2 py-1 rounded-full ${q.status==='active'?'bg-emerald-500/15 text-emerald-300':'bg-amber-500/15 text-amber-300'}`}>{q.status==='active'?'Activa':'Sin activar'}</span>
                                    </button>
                                ))}
                            </div>
                            {scannedQr ? (
                                <div className="mt-4 p-4 rounded-xl border border-slate-700 bg-slate-900/70 space-y-3">
                                    <div className="flex justify-between items-center gap-2"><span className="text-xs font-semibold text-slate-300">2. Estado de la tarjeta</span><span className={`text-xs font-bold ${isActive?'text-emerald-400':'text-amber-400'}`}>{isActive?'Activada':'Pendiente de activación'}</span></div>
                                    <p className="text-sm text-white font-semibold">{isActive?(scannedQr.businessName||'Tarjeta activada'):'Esta tarjeta todavía no está asignada a un negocio'}</p>
                                    {isActive ? (
                                        <div className="space-y-2">
                                            <p className="text-xs text-slate-400">Para comprobar el destino real, abre el enlace de la tarjeta. Esta vista no modifica su estado.</p>
                                            {scannedQr.dynamicUrl ? <a href={scannedQr.dynamicUrl} target="_blank" rel="noreferrer" className="block text-center w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">Abrir enlace de la tarjeta <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i></a> : <p className="text-xs text-amber-300">Esta tarjeta no tiene un enlace configurado.</p>}
                                        </div>
                                    ) : (
                                        <button type="button" onClick={()=>{close();setActivateModal({open:true,qr:scannedQr})}} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">Ir a activar esta tarjeta</button>
                                    )}
                                </div>
                            ) : <p className="text-xs text-slate-400 mt-4">Elige una tarjeta para consultar su estado y acceder a la acción correspondiente.</p>}
                        </div>
                    </div>
                );
            };

            const ConfirmModal = () => {
                if (!confirmModal.open) return null;
                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-sm rounded-2xl p-6 border border-slate-700">
                            <h3 className="font-bold text-lg text-white mb-2">{confirmModal.title}</h3>
                            <p className="text-xs text-slate-300 mb-5">{confirmModal.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmModal({ open: false, title: '', message: '', onConfirm: null })} className="flex-1 py-2.5 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl">Cancelar</button>
                                <button onClick={confirmModal.onConfirm} className="flex-1 py-2.5 bg-red-600 text-white text-xs font-bold rounded-xl">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    <TopHeader />
                    {!cloudReady && (
                      <div className="no-print mx-auto w-full max-w-xl p-4 sm:p-6">
                        <form onSubmit={signInAdmin} className="rounded-2xl border border-blue-500/40 bg-slate-900 p-5 shadow-xl space-y-3">
                          <h2 className="text-lg font-bold text-white">Acceso privado TOCAQUI</h2>
                          <p className="text-sm text-slate-300">Ingresa el PIN de cuatro dígitos del taller. Se verificará en Supabase desde este dispositivo autorizado.</p>
                          <input type="password" inputMode="numeric" pattern="[0-9]{4}" maxLength="4" autoComplete="off" required value={loginPin} onChange={e=>setLoginPin(e.target.value.replace(/\D/g,''))} placeholder="PIN de cuatro dígitos" className="w-full rounded-xl bg-slate-800 border border-slate-600 px-3 py-3 text-white text-center tracking-widest" />
                          <div className="space-y-2 border-t border-slate-700 pt-3">
 <p className="text-xs text-slate-400">Primera vez en este iPhone o computador: introduce el código de vinculación entregado por el administrador.</p>
 <input type="text" value={pairCodeLogin} onChange={e=>setPairCodeLogin(e.target.value.trim())} placeholder="Código de vinculación del dispositivo" className="w-full rounded-xl bg-slate-800 border border-slate-600 px-3 py-2 text-white text-xs" />
 <button type="button" disabled={pairingBusyLogin||!/^[a-f0-9]{64}$/.test(pairCodeLogin.trim().toLowerCase())} onClick={pairWorkshopDevice} className="w-full rounded-xl bg-slate-700 px-3 py-2 text-sm font-semibold text-white disabled:opacity-40">{pairingBusyLogin?'Vinculando...':'Autorizar este dispositivo'}</button>
 </div>
 {cloudError && <p role="alert" className="text-amber-300 text-xs">{cloudError}</p>}
                          <button disabled={loginBusy} type="submit" className="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white disabled:opacity-60">{loginBusy?'Verificando...':'Entrar al taller'}</button>
                        </form>
                      </div>
                    )}
                    <div className={"flex-1 flex overflow-hidden "+(!cloudReady?"hidden":"")}>
                        {roleMode === 'admin' ? (
                            <>
                                <AdminSidebar />
                                <main className="tocaqui-app-main flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
                                    <div className="max-w-7xl mx-auto">
                                        {adminTab === 'dashboard' && <DashboardView />}
                                        {adminTab === 'batch' && <BatchView />}
                                        {adminTab === 'qrs' && <QRManagementView />}
                                        {adminTab === 'clients' && <ClientView />}
                                        {adminTab === 'client-detail' && <ClientView />}
                                        {adminTab === 'templates' && <TemplatesView />}
                                        {adminTab === 'print' && <PrintView />}
                                        {adminTab === 'settings' && <SettingsView />}
                                    </div>
                                </main>
                            </>
                        ) : (
                            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
                                <ClientPortalView />
                            </main>
                        )}
                    </div>

                    {individualQr && (
                        <div className="fixed inset-0 z-[90] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 no-print" role="dialog" aria-modal="true" aria-label={'QR de ' + individualQr.trackingCode} onClick={() => setIndividualQr(null)}>
                            <div className="w-full max-w-md max-h-[calc(100dvh-2rem)] overflow-y-auto overscroll-contain rounded-2xl border border-slate-700 bg-slate-900 p-4 sm:p-5 shadow-2xl space-y-3" style={{WebkitOverflowScrolling:'touch'}} onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start gap-3">
                                    <div>
                                        <h2 className="font-bold text-white text-lg">QR de {individualQr.trackingCode}</h2>
                                        <p className="text-xs text-slate-400 mt-1">{individualQr.businessName || 'Tarjeta sin negocio asignado'}</p>
                                    </div>
                                    <button type="button" aria-label="Cerrar QR" onClick={() => setIndividualQr(null)} className="p-2 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="bg-white rounded-xl p-3 mx-auto w-full max-w-[250px] aspect-square flex items-center justify-center">
                                    {individualQrImage ? <img src={individualQrImage} alt={'Código QR de '+individualQr.trackingCode} className="w-full h-full object-contain" /> : <span className="text-slate-700 text-sm">Generando QR...</span>}
                                </div>
                                <div className="flex items-center justify-between text-xs">
                                    <span className={individualQr.status === 'active' ? 'text-emerald-400' : 'text-amber-400'}>{individualQr.status === 'active' ? 'Tarjeta activa' : 'Pendiente de activación'}</span>
                                    <span className="font-mono text-slate-400">{individualQr.trackingCode}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={downloadIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-blue-600 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-download mr-2"></i>Descargar PNG</button>
                                    <button type="button" onClick={shareIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-slate-700 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-share-nodes mr-2"></i>Compartir</button>
                                </div>
                                <div className="rounded-xl border border-slate-700 bg-slate-950/60 p-3 space-y-2">
                                    <div className="flex items-center gap-2 text-slate-200 text-sm font-semibold"><i className="fa-solid fa-nfc-symbol text-cyan-400"></i> Enlace NFC de esta tarjeta</div>
                                    <p className="text-[11px] text-slate-400">Es exactamente el mismo enlace dinámico del QR. No lo reemplaces por la dirección del negocio.</p>
                                    <div className="flex gap-2 items-center">
                                        <input aria-label="URL para grabar en NFC" readOnly value={getBaseTagUrl(individualQr.trackingCode)} onFocus={e=>e.target.select()} className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-900 text-slate-200 text-xs font-mono p-2.5" />
                                        <button type="button" onClick={async()=>{try{await navigator.clipboard.writeText(getBaseTagUrl(individualQr.trackingCode));showToast('Enlace NFC copiado.','success');}catch{showToast('Mantén pulsado el enlace para copiarlo.','info');}}} className="shrink-0 bg-blue-600 text-white text-xs font-semibold rounded-lg px-3 py-2.5"><i className="fa-solid fa-copy mr-1"></i>Copiar</button>
                                    </div>
                                    <details className="text-xs text-slate-300">
                                        <summary className="cursor-pointer text-cyan-300 font-semibold py-1">Cómo grabar el NFC</summary>
                                        <p className="mt-2 text-slate-400">iPhone: abre NFC Tools → Escribir → Añadir registro → URL/URI. Pega este enlace, pulsa Escribir y acerca el chip NFC al teléfono.</p>
                                        <p className="mt-2 text-slate-400">Android compatible: utiliza el botón NFC de Gestión de Tarjetas o NFC Tools.</p>
                                        <p className="mt-2 text-amber-300">Verifica el identificador impreso antes de grabar. Cada tarjeta del lote tiene un enlace distinto.</p>
                                    </details>
                                </div>
                                <a href={getBaseTagUrl(individualQr.trackingCode)} target="_blank" rel="noopener noreferrer" className="block text-center text-cyan-300 border border-cyan-500/30 rounded-xl py-2.5 text-sm font-semibold">Probar enlace QR <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i></a>
                                <p className="text-[11px] text-slate-400 text-center">Este QR conserva su identificador dinámico. El destino se administra desde Configurar.</p>
                            </div>
                        </div>
                    )}
                    <ActivationModal />
                    <ScanSimulatorModal />
                    <ConfirmModal />

                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-50 glass-panel border border-slate-700 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                            <span className="text-xs font-semibold text-white">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        };

        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('No se cargo Supabase JS. Comprueba la conexion a la biblioteca externa.');
        }
        class TocaquiErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state={error:null}; }
          static getDerivedStateFromError(error) { return {error}; }
          componentDidCatch(error, info) { console.error('TOCAQUI runtime', error, info); }
          render() { return this.state.error
            ? <div style={{padding:24,color:'white',fontFamily:'system-ui'}}><h2>Error de interfaz TOCAQUI</h2><p>{String(this.state.error.message || this.state.error)}</p><p>Los datos locales no se han eliminado.</p></div>
            : this.props.children; }
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        const cloud=window.supabase.createClient('https://nasdgjalsfxnwymqicio.supabase.co','sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3');
root.render(<TocaquiErrorBoundary><App cloud={cloud} /></TocaquiErrorBoundary>);
    </script>
</body>
</html>
