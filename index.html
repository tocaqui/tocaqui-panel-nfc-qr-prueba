        @media print {

            }

                justify-content: center !important;
                align-content: center !important;

            .print-grid-pvc-horizontal {

                align-content: center !important;

        /* Guillotine guides are drawn across the physical sheet without changing the grid. */
        .sheet-cut-guides { position:absolute; inset:0; width:100%; height:100%; z-index:6; pointer-events:none; overflow:hidden; }

        /* Screen Preview A4 Sheet Box */

        /* Physical Dimensions for Single Card Previews */
        .card-pvc-vertical {
            width: 54mm;
            height: 85.6mm;
            border-radius: 3.18mm;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px dashed rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .card-pvc-horizontal {
            width: 85.6mm;
            height: 54mm;
            border-radius: 3.18mm;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px dashed rgba(0, 0, 0, 0.25);

            background-size: cover;
            background-position: center;

            box-sizing: border-box;

        .card-magnet-square {
            width: 50mm;
            height: 50mm;
            border-radius: 2.5mm;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px dashed rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        /* El preview muestra el arte a borde completo.
           En impresión el fondo recibe sangrado configurable hacia afuera. */
        .print-artwork-img {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: inherit;
            z-index: 0;
        }
        .print-artwork-img > img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transform: scaleX(var(--artwork-width-scale, 1));
            transform-origin: center;
        }

        /* Exact physical A4 layout shared by screen preview and print. */
        .sheet-preview-grid { display: grid; height: 100%; justify-content: center; align-content: center; box-sizing: border-box; }
        .sheet-preview-pvc-vertical { grid-template-columns: repeat(5, 54mm); grid-template-rows: repeat(2, 85.6mm); gap: 2.5mm 2.5mm; }
        .a4-sheet-preview:has(.sheet-preview-pvc-vertical) { width: 297mm; min-height: 210mm; height: 210mm; padding: 8mm; }
        .sheet-preview-pvc-horizontal { grid-template-columns: repeat(2, 85.6mm); grid-template-rows: repeat(5, 54mm); gap: 2mm 6mm; }
        .sheet-preview-posters { grid-template-columns: repeat(2, 100mm); grid-template-rows: 150mm; column-gap: 12mm; }
        .a4-sheet-preview:has(.sheet-preview-posters) { width: 297mm; min-height: 210mm; height: 210mm; padding: 8mm; }
        .sheet-preview-magnet-horizontal { grid-template-columns: repeat(3, 60mm); grid-template-rows: repeat(6, 40mm); gap: 3mm 3mm; }
        .sheet-preview-magnet-square { grid-template-columns: repeat(3, 50mm); grid-template-rows: repeat(5, 50mm); gap: 3mm 3mm; }
        
        @media print {
            .print-page-a4:has(.print-grid-pvc-vertical) { width: 297mm !important; height: 210mm !important; padding: 8mm !important; }
            .print-page-a4:has(.print-grid-pvc-horizontal) { width: 210mm !important; height: 297mm !important; padding: 6mm 8mm !important; }
            .print-page-a4:has(.print-grid-posters) { width: 297mm !important; height: 210mm !important; padding: 8mm !important; }
            .print-page-a4:has(.print-grid-magnet-horizontal),
            .print-page-a4:has(.print-grid-magnet-square) { width: 210mm !important; height: 297mm !important; padding: 8mm !important; }
        }
        /* Only screen preview is scaled; printed A4 stays at 100% physical dimensions. */
        @media print {
            .a4-sheet-preview.preview-compact { zoom: 1 !important; }

        .metric-card {

            content: '';

            inset: 0 auto auto 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.5), transparent 55%);

        const compressImageToDataURL = (file, targetWidth = 600, targetHeight = 950, quality = 0.9, fitMode = 'stretch') => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        if (fitMode === 'cover' || fitMode === 'contain') {
                            if (targetWidth > targetHeight && img.height > img.width) {
                                const rotated = document.createElement('canvas');
                                rotated.width = img.height; rotated.height = img.width;
                                const rc = rotated.getContext('2d');
                                rc.translate(rotated.width / 2, rotated.height / 2); rc.rotate(-Math.PI / 2);
                                rc.drawImage(img, -img.width / 2, -img.height / 2);
                                const scale = (fitMode === 'contain' ? Math.min : Math.max)(targetWidth / rotated.width, targetHeight / rotated.height);
                                const rw = rotated.width * scale, rh = rotated.height * scale;
                                ctx.drawImage(rotated, (targetWidth-rw)/2, (targetHeight-rh)/2, rw, rh);
                            } else {
                            const scale = (fitMode === 'contain' ? Math.min : Math.max)(targetWidth / img.width, targetHeight / img.height);
                            const renderW = img.width * scale, renderH = img.height * scale;
                            ctx.drawImage(img, (targetWidth - renderW) / 2, (targetHeight - renderH) / 2, renderW, renderH);
                            }
                        } else {
                            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                        }
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

                        tag: el.tagName,
                        type: el.getAttribute('type') || '',
                        scopeHint: scopeHint(scope),
                        index: fields.indexOf(el),
                        selectionStart: typeof el.selectionStart === 'number' ? el.selectionStart : null,
                        selectionEnd: typeof el.selectionEnd === 'number' ? el.selectionEnd : null,
                        selectionDirection: el.selectionDirection || 'none'
                    };
                };
                const remember = event => {
                    const snap=snapshot(event.target);
                    if(snap) focusSnapshotRef.current=snap;
                };
                const clearOnNavigation = event => {
                    const target=event.target?.closest?.('button,a,[role="button"]');
                    if(target && !isEditable(event.target)) focusSnapshotRef.current=null;
                };

                document.addEventListener('focusin',remember,true);
                document.addEventListener('input',remember,true);
                document.addEventListener('keydown',remember,true);
                document.addEventListener('pointerdown',clearOnNavigation,true);
                return () => {
                    document.removeEventListener('focusin',remember,true);
                    document.removeEventListener('input',remember,true);
                    document.removeEventListener('keydown',remember,true);
                    document.removeEventListener('pointerdown',clearOnNavigation,true);
                };
            }, []);

            useLayoutEffect(() => {
                const snap=focusSnapshotRef.current;
                if(!snap) return;

                const current=document.activeElement;
                if(current && current !== document.body && current.matches?.('input,textarea,select,[contenteditable="true"]')) {
                    return;
                }

                const fields=[...document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select,[contenteditable="true"]')];
                if(!fields.length) return;

                const getScopeHint = el => {
                    const scope=el.closest?.('[role="dialog"], form, .tocaqui-operation-page, main') || document.body;
                    if(scope===document.body) return 'body';
                    return (
                        scope.getAttribute?.('aria-label') ||
                        scope.querySelector?.('h1,h2,h3,[data-focus-scope-title]')?.textContent ||
                        scope.className ||
                        scope.tagName ||
                        ''
                    ).toString().trim().slice(0,120);
                };

                let best=null,bestScore=-1;
                for(const el of fields){
                    let score=0;
                    if(snap.id && el.id===snap.id) score+=120;
                    if(snap.name && el.getAttribute('name')===snap.name) score+=70;
                    if(snap.aria && el.getAttribute('aria-label')===snap.aria) score+=55;
                    if(snap.placeholder && el.getAttribute('placeholder')===snap.placeholder) score+=50;
                    if(snap.autocomplete && el.getAttribute('autocomplete')===snap.autocomplete) score+=15;
                    if(el.tagName===snap.tag) score+=8;
                    if((el.getAttribute('type')||'')===snap.type) score+=8;
                    if(getScopeHint(el)===snap.scopeHint) score+=35;

                    const scope=el.closest?.('[role="dialog"], form, .tocaqui-operation-page, main') || document.body;
                    const scoped=[...scope.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select,[contenteditable="true"]')];
                    if(scoped.indexOf(el)===snap.index) score+=25;

                    if(score>bestScore){bestScore=score;best=el;}
                }

                if(!best || bestScore<45) return;
                try{
                    best.focus({preventScroll:true});
                    if(typeof best.setSelectionRange==='function' && snap.selectionStart!==null){
                        const max=String(best.value ?? '').length;

const cardPatch=(previous,next)=>{
 const immutable=new Set(['id','trackingCode','serialNumber','batchId','batchName','canonicalUrl']);
 const patch={};
 for(const key of new Set([...Object.keys(previous),...Object.keys(next)])){
  if(JSON.stringify(previous[key])===JSON.stringify(next[key]))continue;
  if(immutable.has(key))throw new Error('No se puede modificar la identidad de la tarjeta.');
  patch[key]=Object.prototype.hasOwnProperty.call(next,key)?next[key]:null;
 }
 return patch;
};
const reloadCardsAfterConflict=async()=>{

};
const sync=(name,table,items)=>{if(!cloudReady||!initialized.current||(name==='templates'&&!templatesReady))return;
 const prev=last.current[name];if(JSON.stringify(prev)===JSON.stringify(items))return;
 const generation=cardSyncGeneration.current;
 last.current={...last.current,[name]:items};
 queue.current=queue.current.then(async()=>{
 const kind=name==='qrs'?'cards':name;
 const changed=items.filter(x=>!prev.some(p=>p.id===x.id&&JSON.stringify(p)===JSON.stringify(x)));
 const deleted=prev.filter(x=>!items.some(y=>y.id===x.id)).map(x=>x.id);
 if(kind==='cards'){
  if(generation!==cardSyncGeneration.current)return;
  if(deleted.length||changed.some(card=>!prev.some(old=>old.id===card.id)))throw new Error('La creación y eliminación de tarjetas requieren una operación autorizada.');
  for(const card of changed){
   if(generation!==cardSyncGeneration.current)return;
   const expected=prev.find(old=>old.id===card.id), patch=cardPatch(expected,card);
   if(Object.keys(patch).length)await workshopApi({action:'patchCard',session:workshopSession,cardId:card.id,expected,patch});
  }
 }else{
  if(changed.length)await workshopApi({action:'save',session:workshopSession,kind,items:changed});
  if(deleted.length)await workshopApi({action:'delete',session:workshopSession,kind,ids:deleted});
 }
 }).catch(async e=>{
  if(name==='qrs'){try{await reloadCardsAfterConflict();}catch(reloadError){setCloudError('Error al recuperar tarjetas: '+reloadError.message);return;}}
  setCloudError('Error guardando: '+e.message);
 });
};

                        <section className="premium-panel"><div className="flex justify-between items-center mb-3"><h2 className="font-bold text-white">Últimos lotes</h2><button type="button" onClick={()=>setAdminTab('batch')} className="text-xs text-blue-300">Ver todos</button></div>{recentLots.length?recentLots.map(b=><button key={b.id} type="button" onClick={()=>setAdminTab('batch')} className="tq-recent-lot"><span className="flex items-center gap-2"><i className="fa-solid fa-layer-group text-indigo-400"/><strong>{b.name}</strong><span className="ml-auto text-xs text-emerald-300">{b.active}/{b.total}</span><i className="fa-solid fa-chevron-right text-slate-500"/></span><span className="tq-progress-track"><span style={{width:(b.active/b.total*100)+'%'}}/></span></button>):<p className="text-xs text-slate-400">No hay lotes emitidos.</p>}</section>
<section className="rounded-2xl border border-rose-500/15 bg-rose-500/[0.025] p-3.5 sm:p-4">

                        {resetOpen && (

                                        <button type="button" onClick={()=>{if(!resetBusy){setResetOpen(false);setResetConfirmText('')}}} className="w-9 h-9 rounded-xl bg-slate-800 text-slate-400"><i className="fa-solid fa-xmark"></i></button>

                                        <p className="text-emerald-300">PIN, equipos autorizados y configuración se conservan.</p>

                                    <div className="grid grid-cols-2 gap-2 mt-4">
                                        <button type="button" disabled={resetBusy} onClick={()=>{setResetOpen(false);setResetConfirmText('')}} className="min-h-[42px] rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-xs font-semibold">Cancelar</button>
                                        <button type="button" disabled={resetBusy||!cloudReady||!templatesReady||!Object.values(resetChoices).some(Boolean)||resetConfirmText!=='REINICIAR TOCAQUI'} onClick={resetTestInventory} className="min-h-[42px] rounded-xl bg-rose-600 text-white text-xs font-semibold disabled:opacity-40">{resetBusy?'Reiniciando…':'Confirmar reinicio'}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // 2. BATCH GENERATOR VIEW
            // Keep the reset dialog mounted while selecting options and typing.
            const dashboardViewLatest=useRef(DashboardView);
            dashboardViewLatest.current=DashboardView;
            const StableDashboardView=useMemo(()=>function StableDashboardView(){return dashboardViewLatest.current();},[]);

            const BatchView = () => {
                const [count, setCount] = useState(10);
                const [batchName, setBatchName] = useState('Lote nuevo');
                const [productType, setProductType] = useState('pvc-horizontal');
                const [selectedBatchId, setSelectedBatchId] = useState('');
                const [batchQuery,setBatchQuery] = useState('');
                const [batchProgress,setBatchProgress] = useState('all');
                const [batchProductFilter,setBatchProductFilter] = useState('all');
                const [batchDateFilter,setBatchDateFilter] = useState('');
                const [batchArchiveFilter,setBatchArchiveFilter] = useState('active');
                const [batchMetadata,setBatchMetadata] = useState([]);
                const [batchMetadataError,setBatchMetadataError] = useState('');
                const [batchMetadataReady,setBatchMetadataReady] = useState(false);
                const [batchMetadataRetry,setBatchMetadataRetry] = useState(0);
                const [batchEditName,setBatchEditName] = useState('');
                const [batchDescription,setBatchDescription] = useState('');
                const [batchNotes,setBatchNotes] = useState('');
                const [batchManageBusy,setBatchManageBusy] = useState(false);
                const [batchTargetQuantity,setBatchTargetQuantity] = useState(1);
                const [batchConfirmAction,setBatchConfirmAction] = useState('');
                const [batchDeleteText,setBatchDeleteText] = useState('');
                const [batchHistory,setBatchHistory] = useState([]);
                const [batchHistoryStatus,setBatchHistoryStatus] = useState('idle');
                const [batchLayout,setBatchLayout] = useState('list');
                const [creatingBatch, setCreatingBatch] = useState(false);
                const pendingReservationRequest=React.useRef(null);
                const pendingManagementRequest=React.useRef(null);
                const [selectedBatchTab, setSelectedBatchTab] = useState('summary');
                const [distributionTemplateId, setDistributionTemplateId] = useState('');
                const [distributionQty, setDistributionQty] = useState(1);
                const [distributionBusy, setDistributionBusy] = useState(false);
                const [bulkSelectedIds, setBulkSelectedIds] = useState([]);
                const [bulkPickQty, setBulkPickQty] = useState(10);
                const [bulkClientId, setBulkClientId] = useState('');
                const [bulkBusinessName, setBulkBusinessName] = useState('');
                const [bulkBusinessAddress, setBulkBusinessAddress] = useState('');
                const [bulkFunctionType, setBulkFunctionType] = useState('custom_url');
                const [bulkPlaceId, setBulkPlaceId] = useState('');
                const [bulkUrl, setBulkUrl] = useState('');
                const [bulkPin, setBulkPin] = useState('');
                const [bulkBusy, setBulkBusy] = useState(false);
                const [bulkResult, setBulkResult] = useState(null);

                const formatMeta = {
                    'pvc-horizontal': { label:'PVC horizontal · 85.6 × 54 mm', icon:'fa-address-card', perSheet:10 },
                    'pvc-vertical': { label:'PVC vertical · 54 × 85.6 mm', icon:'fa-id-card', perSheet:10 },
                    '10x15': { label:'Letrero 10 × 15 cm', icon:'fa-image', perSheet:2 },
                    'magnet-horizontal': { label:'Imán horizontal · 6 × 4 cm', icon:'fa-magnet', perSheet:18 },
                    'magnet-square': { label:'Imán cuadrado · 5 × 5 cm', icon:'fa-square', perSheet:15 }
                };
                const activeFormat = formatMeta[productType] || formatMeta['pvc-horizontal'];
                const estimatedSheets = Math.ceil(Math.max(1, Number(count)||1) / activeFormat.perSheet);

                useEffect(()=>{
                    setBatchMetadataReady(false);
                    setBatchMetadata([]);
                    setBatchMetadataError('');
                    if (!workshopSession) return;
                    let live=true;
                    workshopApi({action:'listBatches',session:workshopSession})
                        .then(result=>{if(!Array.isArray(result.batches))throw new Error('Respuesta de lotes incompleta');if(live){setBatchMetadata(result.batches);setBatchMetadataError('');setBatchMetadataReady(true);}})
                        .catch(error=>{if(live){setBatchMetadataReady(false);setBatchMetadataError(error.message||'No se pudo consultar la gestión de lotes.');}});
                    return ()=>{live=false;};
                },[workshopSession,batchMetadataRetry]);

                const batchGroups = useMemo(() => {
                    const map = new Map();
                    qrs.filter(q=>q.batchId).forEach(card => {
                        const id = card.batchId;
                        if (!map.has(id)) {
                            map.set(id, {
                                id,
                                name: card.batchName || 'Lote sin nombre',
                                productType: card.productType || 'pvc-horizontal',
                                cards: [],
                                createdAt: card.createdAt || 0
                            });
                        }
                        const group = map.get(id);
                        group.cards.push(card);
                        group.createdAt = Math.min(group.createdAt || card.createdAt || 0, card.createdAt || group.createdAt || 0);
                    });
                    batchMetadata.filter(item=>item.reserved&&!map.has(item.batchId)).forEach(item=>map.set(item.batchId,{id:item.batchId,name:item.name,productType:item.productType,cards:[],createdAt:item.createdAt||0}));
                    return [...map.values()].map(group=>{
                        const metadata=batchMetadata.find(item=>item.batchId===group.id);
                        return {...group,...(metadata||{}),id:group.id,name:metadata?.name||group.name,productType:metadata?.productType||group.productType};
                    }).sort((x,y)=>(new Date(y.createdAt||0).getTime()||0)-(new Date(x.createdAt||0).getTime()||0));
                }, [qrs,batchMetadata]);

                const visibleBatches = batchGroups.filter(batch=>{
                    const query=batchQuery.trim().toLowerCase();
                    const active=batch.cards.filter(card=>card.status==='active').length;
                    const progress=active===0?'pending':active===batch.cards.length?'active':'partial';
                    return (batchProgress==='all'||batchProgress===progress)
                        && (batchArchiveFilter==='all'||(batchArchiveFilter==='archived'?!!batch.archived:!batch.archived))
                        && (batchProductFilter==='all'||batch.productType===batchProductFilter)
                        && (!batchDateFilter||(batch.createdAt && new Date(batch.createdAt)>=new Date(batchDateFilter+'T00:00:00')))
                        && (!query||[batch.name,batch.id].some(value=>String(value).toLowerCase().includes(query)));
                });

                useEffect(()=>{
                    if(!selectedBatchId)return;
                    const close=event=>{if(event.key==='Escape')setSelectedBatchId('');};
                    window.addEventListener('keydown',close);
                    return ()=>window.removeEventListener('keydown',close);
                },[selectedBatchId]);

                const selectedBatch = batchGroups.find(batch=>batch.id===selectedBatchId) || null;
                useEffect(()=>{
                    if(!selectedBatchId||selectedBatchTab!=='history'||!batchMetadataReady)return;
                    let live=true;
                    setBatchHistoryStatus('loading');
                    workshopApi({action:'listBatchHistory',session:workshopSession,batchId:selectedBatchId})
                        .then(result=>{if(!Array.isArray(result.history))throw new Error('Historial incompleto');if(live){setBatchHistory(result.history);setBatchHistoryStatus('ready');}})
                        .catch(()=>{if(live)setBatchHistoryStatus('error');});
                    return ()=>{live=false;};
                },[selectedBatchId,selectedBatchTab,batchMetadataReady,workshopSession]);
                useEffect(()=>{
                    if(!selectedBatch)return;
                    setBatchEditName(selectedBatch.name||'');
                    setBatchDescription(selectedBatch.description||'');
                    setBatchNotes(selectedBatch.notes||'');
                    setBatchTargetQuantity(selectedBatch.reserved?selectedBatch.quantity:selectedBatch.cards.length);
                    setBatchConfirmAction('');
                },[selectedBatchId,selectedBatch?.revision]);

                const manageBatch = async (operation,payload={}) => {
                    if(!selectedBatch||batchManageBusy||!batchMetadataReady)return;
                    setBatchManageBusy(true);
                    try {
                        await queue.current;
                        const signature=JSON.stringify([selectedBatch.id,operation,selectedBatch.revision||0,payload]);
                        if(pendingManagementRequest.current?.signature!==signature)pendingManagementRequest.current={signature,id:crypto.randomUUID()};
                        const result=await workshopApi({action:selectedBatch.reserved?'manageReservation':'manageBatch',session:workshopSession,batchId:selectedBatch.id,operation,expectedRevision:selectedBatch.revision||0,payload,requestId:pendingManagementRequest.current.id});
                        if(!result.batch||result.batch.batchId!==selectedBatch.id)throw new Error('No se pudo confirmar el cambio del lote.');
                        if(!Array.isArray(result.cards)||result.cards.some(card=>!card.id||card.batchId!==selectedBatch.id)||new Set(result.cards.map(card=>card.id)).size!==result.cards.length)throw new Error('Respuesta de tarjetas incompleta. Actualiza antes de reintentar.');
                        if(operation==='resize'&&(selectedBatch.reserved?result.batch.quantity!==payload.quantity:result.cards.length!==payload.quantity))throw new Error('La cantidad no pudo confirmarse. Actualiza antes de reintentar.');
                        if(operation==='issue'&&(result.batch.reserved||result.cards.length!==selectedBatch.quantity||result.cards.some(card=>!/^TQ-\d{6,}$/.test(card.serialNumber||''))))throw new Error('No se confirmó la emisión. Actualiza antes de reintentar.');
                        if(operation==='delete'&&!result.batch.deleted)throw new Error('No se confirmó la eliminación.');
                        pendingManagementRequest.current=null;
                        setBatchMetadata(previous=>[...previous.filter(item=>item.batchId!==selectedBatch.id),...(result.batch.deleted?[]:[result.batch])]);
                        if(result.batch.deleted)setSelectedBatchId('');
                        if(Array.isArray(result.cards)){
                            const byId=new Map(result.cards.map(card=>[card.id,card]));
                            const mergeCards=previous=>{
                                if(result.batch.deleted)return previous.filter(card=>card.batchId!==selectedBatch.id);
                                const present=new Set(previous.map(card=>card.id));
                                return [...previous.map(card=>operation==='edit'&&byId.has(card.id)?{...card,batchName:byId.get(card.id).batchName}:card),...result.cards.filter(card=>!present.has(card.id))];
                            };
                            last.current={...last.current,qrs:mergeCards(last.current.qrs||[])};
                            setQrs(previous=>mergeCards(previous));
                        }
                        setBatchConfirmAction('');
                        showToast('Cambio del lote guardado.','success');
                    } catch(error) {
                        if(error.status===409){
                            try{const latest=await workshopApi({action:'listBatches',session:workshopSession});if(Array.isArray(latest.batches))setBatchMetadata(latest.batches);}catch{}
                        }
                        showToast(error.message||'No se pudo guardar el lote.','error');
                    }
                    finally {setBatchManageBusy(false);}
                };
                const selectedBatchTemplates = selectedBatch ? templates.filter(t=>t.category===selectedBatch.productType) : [];
                const distributedCards = selectedBatch ? selectedBatch.cards.filter(card=>card.designTemplateId) : [];
                const undistributedCards = selectedBatch ? selectedBatch.cards.filter(card=>!card.designTemplateId) : [];
                const selectedBulkCards = selectedBatch ? selectedBatch.cards.filter(card=>bulkSelectedIds.includes(card.id)) : [];

                const distributionGroups = useMemo(() => {
                    if (!selectedBatch) return [];
                    const map = new Map();
                    selectedBatch.cards.forEach(card => {
                        if (!card.designTemplateId) return;
                        const tpl = templates.find(t=>t.id===card.designTemplateId);
                        const key = card.designTemplateId;
                        const row = map.get(key) || {templateId:key,name:tpl?.name||card.designTemplateName||'Plantilla',count:0};
                        row.count++;
                        map.set(key,row);
                    });
                    return [...map.values()];
                }, [selectedBatchId, qrs, templates]);

                useEffect(() => {
                    setSelectedBatchTab('summary');
                    setBulkSelectedIds([]);
                    setBulkPickQty(10);
                    setBulkResult(null);
                    setDistributionTemplateId('');
                    setDistributionQty(1);
                }, [selectedBatchId]);

                const saveBatchCards = async updatedCards => {
                    if (!updatedCards.length) return;
                    const previousById=new Map(qrs.map(card=>[card.id,card]));
                    const assignments=updatedCards.map(card=>({id:card.id,expectedTemplateId:previousById.get(card.id)?.designTemplateId||null,templateId:card.designTemplateId||null}));
                    const result=await workshopApi({action:'setBatchDesign',session:workshopSession,assignments});
                    const returned=Array.isArray(result.cards)?result.cards:[];
                    const byId=new Map(returned.map(card=>[card.id,card]));
                    if(returned.length!==updatedCards.length || assignments.some(item=>!byId.has(item.id)||(byId.get(item.id).designTemplateId||null)!==item.templateId)) throw new Error('La distribución se envió, pero no se pudo confirmar. Actualiza antes de reintentar.');
                    last.current={...last.current,qrs:(last.current.qrs||[]).map(card=>byId.get(card.id)||card)};
                    setQrs(prev=>prev.map(card=>byId.get(card.id)||card));
                };

                const applyDistribution = async () => {
                    if (!selectedBatch || distributionBusy) return;
                    const tpl=selectedBatchTemplates.find(t=>t.id===distributionTemplateId);
                    if (!tpl) { showToast('Selecciona una plantilla.', 'warning'); return; }
                    const qty=Math.max(1,Math.min(Number(distributionQty)||1,undistributedCards.length));
                    if (!undistributedCards.length) { showToast('Todo el lote ya tiene diseño asignado.', 'info'); return; }
                    const now=Date.now();
                    const targets=undistributedCards.slice(0,qty).map(card=>({
                        ...card,
                        designTemplateId:tpl.id,
                        designTemplateName:tpl.name,
                        designAssignedAt:now
                    }));
                    setDistributionBusy(true);
                    try{
                        await saveBatchCards(targets);
                        setDistributionQty(1);
                        showToast(qty+' tarjeta(s) asignadas a '+tpl.name+'.','success');
                    }catch(e){
                        showToast('No se pudo guardar la distribución: '+(e.message||e),'error');
                    }finally{setDistributionBusy(false)}
                };

                const changeDistributionGroup = async (templateId, delta) => {
                    if(!selectedBatch || distributionBusy)return;
                    const template=selectedBatchTemplates.find(item=>item.id===templateId);
                    const card=delta>0 ? undistributedCards[0] : selectedBatch.cards.filter(item=>item.designTemplateId===templateId).slice(-1)[0];
                    if(!card || (delta>0 && !template)){showToast('No hay tarjetas disponibles para este cambio.','info');return;}
                    const next={...card};
                    if(delta>0){next.designTemplateId=template.id;next.designTemplateName=template.name;}
                    else{delete next.designTemplateId;delete next.designTemplateName;delete next.designAssignedAt;}
                    setDistributionBusy(true);
                    try{await saveBatchCards([next]);showToast(delta>0?'Tarjeta agregada al diseño.':'Tarjeta devuelta a pendientes de diseño.','success');}
                    catch(e){showToast('No se pudo actualizar la distribución: '+(e.message||e),'error');}
                    finally{setDistributionBusy(false);}
                };

                const removeDistributionGroup = async templateId => {
                    if (!selectedBatch || distributionBusy) return;
                    const targets=selectedBatch.cards.filter(card=>card.designTemplateId===templateId).map(card=>{
                        const next={...card};
                        delete next.designTemplateId; delete next.designTemplateName; delete next.designAssignedAt;
                        return next;
                    });
                    if(!targets.length)return;
                    setDistributionBusy(true);
                    try{await saveBatchCards(targets);showToast('Distribución retirada.','success')}
                    catch(e){showToast('No se pudo actualizar el lote.','error')}
                    finally{setDistributionBusy(false)}
                };

                const clearDistribution = async () => {
                    if (!selectedBatch || distributionBusy) return;
                    const targets=selectedBatch.cards.filter(card=>card.designTemplateId).map(card=>{
                        const next={...card};
                        delete next.designTemplateId; delete next.designTemplateName; delete next.designAssignedAt;
                        return next;
                    });
                    if(!targets.length)return;
                    setDistributionBusy(true);
                    try{await saveBatchCards(targets);showToast('Distribución del lote limpiada.','success')}
                    catch(e){showToast('No se pudo limpiar la distribución.','error')}
                    finally{setDistributionBusy(false)}
                };

                const selectBulkCount = countToSelect => {
                    if (!selectedBatch) return;
                    const source=selectedBatch.cards.filter(card=>card.status!=='active');
                    if(!source.length){setBulkSelectedIds([]);showToast('No hay tarjetas pendientes en este lote.','info');return;}
                    const amount=countToSelect==='all' ? source.length : Math.max(1,Math.min(Number(countToSelect)||1,source.length));
                    setBulkSelectedIds(source.slice(0,amount).map(card=>card.id));
                };

                const selectBulkByTemplate = templateId => {
                    if (!selectedBatch) return;
                    setBulkSelectedIds(selectedBatch.cards.filter(card=>card.designTemplateId===templateId).map(card=>card.id));
                };

                const bulkDeviceApi = async payload => {
                    const response=await fetch('https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-device-activation',{
                        method:'POST',
                        headers:{'Content-Type':'application/json','apikey':'sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3'},
                        body:JSON.stringify(payload)
                    });
                    const result=await response.json();
                    if(!response.ok||!result.ok)throw new Error(result.error||'Solicitud rechazada');
                    return result;
                };

                const activateSelectedBatchCards = async () => {
                    if (!selectedBatch || bulkBusy || !selectedBulkCards.length) return;
                    const credential=localStorage.getItem('tocaqui_device_credential_v1')||'';
                    if(!credential){showToast('Este navegador no está autorizado.','error');return}
                    if(!/^[0-9]{4}$/.test(bulkPin)){showToast('Ingresa el PIN de 4 dígitos.','warning');return}
                    if(!bulkBusinessName.trim()){showToast('Ingresa el nombre del negocio.','warning');return}
                    let finalUrl='';
                    if(bulkFunctionType==='custom_url'){
                        finalUrl=sanitizeUrl(bulkUrl);
                        if(!/^https:\/\//i.test(finalUrl)){showToast('Ingresa una URL HTTPS válida.','warning');return}
                    }else{
                        if(bulkPlaceId.trim().length<8){showToast('Ingresa un Google Place ID válido.','warning');return}
                        finalUrl='https://search.google.com/local/writereview?placeid='+encodeURIComponent(bulkPlaceId.trim());
                    }
                    const now=Date.now();
                    const client=clients.find(c=>c.id===bulkClientId);
                    const cards=selectedBulkCards.map(card=>{
                        const history=[...(card.history||[])];
                        if(finalUrl!==card.dynamicUrl)history.push({timestamp:now,type:'update',description:'Destino actualizado por activación masiva'});
                        if(bulkClientId&&bulkClientId!==card.clientId)history.push({timestamp:now,type:'assignment',description:'Asignada a cliente: '+(client?.name||bulkClientId)});
                        history.push({timestamp:now,type:'activation',description:'Activación masiva · '+bulkFunctionType});
                        return {
                            ...card,
                            status:'active',
                            clientId:bulkClientId||card.clientId||null,
                            businessName:bulkBusinessName.trim(),
                            businessAddress:bulkBusinessAddress.trim(),
                            placeId:bulkFunctionType==='custom_url'?null:bulkPlaceId.trim(),
                            functionType:bulkFunctionType,
                            dynamicUrl:finalUrl,
                            updatedAt:now,
                            history
                        };
                    });
                    setBulkBusy(true);setBulkResult(null);
                    try{
                        const result=await bulkDeviceApi({action:'bulkActivate',credential,pin:bulkPin,cards});

                            last.current={...last.current,qrs:(last.current.qrs||[]).map(card=>byId.get(card.id)||card)};
                        }
                        setBulkResult({requested:result.requested||cards.length,successCount:result.successCount||0,failureCount:result.failureCount||0,failures:result.failures||[],at:Date.now()});
                        setBulkPin('');
                        if((result.failureCount||0)===0)showToast((result.successCount||0)+' tarjetas activadas correctamente.','success');
                        else showToast((result.successCount||0)+' correctas · '+(result.failureCount||0)+' con error.','warning');
                    }catch(e){
                        setBulkResult({requested:cards.length,successCount:0,failureCount:cards.length,failures:[{error:e.message||String(e)}],at:Date.now()});
                        showToast('No se completó la activación masiva: '+(e.message||e),'error');
                    }finally{setBulkBusy(false)}
                };

                        if(!result.batch?.batchId||!result.batch.reserved||result.batch.quantity!==quantity||!Array.isArray(result.cards)||result.cards.length)throw new Error('No se confirmó la reserva. Actualiza antes de reintentar.');

                                        </button>
                                    </form>
                                </section>

                                <section className="min-w-0">

                                                        </div>

                        {selectedBatch && (

                                            <button type="button" autoFocus aria-label="Cerrar detalle del lote" onClick={()=>setSelectedBatchId('')} className="w-9 h-9 rounded-xl bg-slate-800 text-slate-300"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                        <div className="px-3 sm:px-5 overflow-x-auto">
                                            <div className="flex min-w-max gap-1 pb-2">
                                                {[
                                                    ['summary','Resumen','fa-list-check'],

                                                        className={selectedBatchTab===tab[0]?'px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold':'px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800 text-xs font-semibold'}>

                                    {(()=>{

                                        return (

                                                        <div className="grid grid-cols-4 gap-3 border-b border-slate-800 pb-5">

                                                            {!selectedBatch.reserved&&<button type="button" onClick={()=>setSelectedBatchTab('distribution')} className="flex-1 rounded-xl bg-cyan-600 hover:bg-cyan-500 px-4 py-3 text-sm font-bold text-white">Distribuir diseños</button>}
                                                            {!selectedBatch.reserved&&<button type="button" onClick={()=>setSelectedBatchTab('activation')} className="flex-1 rounded-xl bg-blue-600 hover:bg-blue-500 px-4 py-3 text-sm font-bold text-white">Activar tarjetas</button>}

            // Keep the batch editor mounted while App state changes, while reading the latest data.
            const batchViewLatest=useRef(BatchView);

            const StableBatchView=useMemo(()=>function StableBatchView(){return batchViewLatest.current();},[]);

            // 3. QR MANAGEMENT VIEW
            const QRManagementView = () => {
                const [search, setSearch] = useState(inventoryRoute.search);
                const [statusFilter, setStatusFilter] = useState(inventoryRoute.status);
                const [activityFilter,setActivityFilter] = useState(inventoryRoute.activity);
                const [batchFilter, setBatchFilter] = useState('all');
                const [batchPickerOpen, setBatchPickerOpen] = useState(false);
                const [batchSearch, setBatchSearch] = useState('');
                const [cardPage, setCardPage] = useState(1);
                const [nfcProgrammerOpen, setNfcProgrammerOpen] = useState(false);
                const [nfcProgrammerBatchId, setNfcProgrammerBatchId] = useState('');
                const [nfcProgrammerIndex, setNfcProgrammerIndex] = useState(0);
                const [nfcProgrammerBusy, setNfcProgrammerBusy] = useState(false);
                const pageSize = 20;

                const batchOptions = useMemo(() => [...new Set(qrs.map(q => q.batchId || 'legacy'))], [qrs]);
                const batchStats = useMemo(() => batchOptions.map(id => ({
                    id,
                    name: qrs.find(q => (q.batchId || 'legacy') === id)?.batchName || (id === 'legacy' ? 'Tarjetas anteriores' : id),
                    total: qrs.filter(q => (q.batchId || 'legacy') === id).length,
                    pending: qrs.filter(q => (q.batchId || 'legacy') === id && q.status !== 'active').length,
                    active: qrs.filter(q => (q.batchId || 'legacy') === id && q.status === 'active').length
                })), [batchOptions, qrs]);

                const filteredBatchStats = useMemo(() => {
                    const term=batchSearch.trim().toLowerCase();
                    if(!term)return batchStats;
                    return batchStats.filter(batch=>[batch.name,batch.id].some(v=>String(v||'').toLowerCase().includes(term)));
                }, [batchStats,batchSearch]);

                const filteredQrs = useMemo(() => {
                    const term=search.trim().toLowerCase();
                    return qrs.filter(q => {
                        if(activityFilter==='scanned'&&getCardScans(q)===0)return false;
                        if(activityFilter==='activated'&&!(Array.isArray(q.history)&&q.history.some(event=>event?.type==='activation')))return false;
                        const client=clients.find(c=>c.id===q.clientId);
                        const matchCode = !term || [q.id,q.serialNumber,q.trackingCode,q.businessName,q.batchName,q.batchId,client?.name]
                            .some(value=>String(value||'').toLowerCase().includes(term));
                        const matchStatus = statusFilter === 'all' || q.status === statusFilter;
                        const matchBatch = batchFilter === 'all' || (q.batchId || 'legacy') === batchFilter;
                        return matchCode && matchStatus && matchBatch;
                    });
                }, [qrs, clients, search, statusFilter, batchFilter, activityFilter, serverAnalytics.perCard]);

                    .filter(q=>(q.batchId||'legacy')===nfcProgrammerBatchId)

                const currentNfcCard=nfcProgrammerCards[Math.min(nfcProgrammerIndex,Math.max(0,nfcProgrammerCards.length-1))]||null;
                const nfcProgrammedCount=nfcProgrammerCards.filter(q=>['programmed','verified'].includes(q.nfcProgramming?.status)).length;
                const nfcVerifiedCount=nfcProgrammerCards.filter(q=>q.nfcProgramming?.status==='verified').length;

                useEffect(()=>{
                    if(!nfcProgrammerCards.length){setNfcProgrammerIndex(0);return;}

                },[nfcProgrammerBatchId,nfcProgrammerCards.length]);

                    const cards=qrs.filter(q=>(q.batchId||'legacy')===preferred).sort((a,b)=>String(cardNumber(a)).localeCompare(String(cardNumber(b)),undefined,{numeric:true}));
                    const firstPending=Math.max(0,cards.findIndex(q=>q.nfcProgramming?.status!=='verified'));
                    setNfcProgrammerIndex(firstPending<0?0:firstPending);
                    setNfcProgrammerOpen(true);
                };

                const saveNfcProgramming=async(card,status)=>{
                    if(!card||nfcProgrammerBusy)return;
                    try{
                        setNfcProgrammerBusy(true);
                        if(!workshopSession)throw new Error('Se requiere una sesión autorizada.');
                        const result=await workshopApi({action:'markNfcProgramming',session:workshopSession,cardId:card.id,status});
                        if(!result?.card)throw new Error('No se recibió la tarjeta actualizada.');
                        setQrs(prev=>prev.map(q=>q.id===result.card.id?result.card:q));
                        if(status==='verified'){
                            showToast('NFC verificado · '+cardNumber(card)+' lista para activar.','success');
                            setTimeout(()=>setNfcProgrammerIndex(i=>Math.min(i+1,Math.max(0,nfcProgrammerCards.length-1))),180);
                        }else if(status==='programmed'){
                            showToast('NFC marcado como grabado · '+cardNumber(card)+'.','success');
                        }else{
                            showToast('Estado NFC reiniciado · vuelve a grabar y verificar esta tarjeta.','info');
                        }
                    }catch(error){
                        showToast('No se pudo actualizar el NFC: '+(error.message||error),'error');
                    }finally{setNfcProgrammerBusy(false);}
                };

                const copyProgrammerUrl=async(card)=>{
                    if(!card)return;
                    const url=getNfcTagUrl(card.trackingCode);
                    try{await navigator.clipboard.writeText(url);showToast('Enlace NFC copiado · '+cardNumber(card)+'. Pégalo en NFC Tools para grabarlo.','success');}
                    catch{showToast('Mantén pulsado el enlace para copiarlo.','info');}
                };

                const writeProgrammerWebNfc=async(card)=>{
                    if(!card)return;
                    if(!('NDEFReader' in window)){showToast('En iPhone usa NFC Tools. Web NFC no está disponible en Safari.','info');return;}
                    try{
                        setNfcProgrammerBusy(true);
                        const ndef=new NDEFReader();
                        await ndef.write({records:[{recordType:'url',data:getNfcTagUrl(card.trackingCode)}]});
                        setNfcProgrammerBusy(false);
                        await saveNfcProgramming(card,'programmed');

                                                <button onClick={()=>writeWebNFC(qr.trackingCode)} className="min-h-[38px] rounded-xl bg-violet-500/10 border border-violet-500/25 text-violet-200 px-2 text-[10px] font-semibold"><i className="fa-brands fa-nfc-symbol mr-1"></i>NFC</button>

                                {filteredClients.map(client => {

                                                <div className="hidden md:block min-w-0 text-xs text-indigo-300 truncate">{client.company || 'Sin empresa'}</div>
                                                <div className="min-w-0 text-[11px] text-slate-400">
                                                    <div className="truncate"><i className="fa-solid fa-envelope w-4 text-slate-600"></i>{client.email || 'Sin correo'}</div>

                                                <button onClick={() => { setSelectedClientDetailId(client.id); setAdminTab('client-detail'); }} className="min-h-[38px] rounded-xl border border-slate-700 bg-slate-800/70 hover:bg-slate-700 text-slate-200 text-[10px] font-semibold px-3">
                                                    <i className="fa-solid fa-folder-open text-indigo-300 mr-1.5"></i>Ver expediente

                                {filteredClients.length===0 && <div className="p-8 text-center text-sm text-slate-500">No se encontraron clientes.</div>}

                        </section>

                        {showAddModal && (

                                        <div><h3 className="font-bold text-white">Nuevo Cliente</h3><p className="text-[10px] text-slate-500 mt-0.5">Datos para vincular tarjetas y mantener el expediente.</p></div>

                                        <input type="email" placeholder="Correo electrónico" required value={form.email} onChange={e => setForm({...form, email:e.target.value})} className="w-full glass-input px-3 py-2.5 rounded-xl text-sm" />

            const TemplatesView = () => {
                const visibleTemplates=templates.filter(tpl=>(templateCategory==='all'||tpl.category===templateCategory)

                    form.category === '10x15' ? [1200,1800] :
                    form.category === 'pvc-horizontal' ? [1712,1080] :
                    form.category === 'magnet-horizontal' ? [1500,1000] :
                    form.category === 'magnet-square' ? [1200,1200] :
                    [1080,1712];

                const handleSaveTemplate = async (e) => {
                    e.preventDefault();
                    const editing = !!templateModal.isEditing && !!templateModal.data?.id;
                    if (!workshopSession || !cloudReady || templateSaveLock.current) return;
                    const existing = editing ? templates.find(t=>t.id===templateModal.data.id) : null;
                    if(editing&&!existing){showToast('La plantilla ya no está disponible.','error');return;}
                    const source = existing || templateModal.data;
                    const nextTpl = {
                        ...(existing || {}),
                        ...(source?.printQrLayout ? {printQrLayout:source.printQrLayout} : {}),
                        id: editing ? templateModal.data.id : 'TPL-' + crypto.randomUUID().toUpperCase(),
                        name: form.name.trim(),
                        category: form.category,
                        frontBg: form.frontBg,
                        backBg: form.backBg,
                        defaultTheme: source?.defaultTheme || 'custom',
                        qrBgStyle: source?.qrBgStyle || 'white-box',
                        qrSizePx: source?.qrSizePx || 55,
                        qrPosY: source?.qrPosY || 'center',
                        qrPosX: source?.qrPosX || 'center',
                        updatedAt:Date.now()
                    };
                    if (!nextTpl.name) return;
                    templateSaveLock.current=true;
                    setTemplateSaving(true);
                    try {
                        const result=await workshopApi({action:'saveOne',session:workshopSession,kind:'templates',item:nextTpl});
                        let saved=result.item;
                        if(saved?.id!==nextTpl.id){
                            const verified=await workshopApi({action:'listTemplates',session:workshopSession});
                            saved=verified.templates?.find(item=>item.id===nextTpl.id);
                        }
                        if(!saved)throw new Error('No se pudo recuperar la plantilla guardada.');
                        const current=last.current.templates;
                        const confirmed=current.some(item=>item.id===saved.id)
                            ? current.map(item=>item.id===saved.id?saved:item)
                            : [...current,saved];
                        last.current={...last.current,templates:confirmed};
                        setTemplates(confirmed);
                        setTemplateDraft({name:'',category:'pvc-horizontal',frontBg:'',backBg:'',frontName:'',backName:''});
                        setTemplateModal({open:false,isEditing:false,data:null});
                        showToast(editing?'Plantilla actualizada.':'Plantilla guardada.','success');
                    } catch(error) {
                        showToast('No se confirmó la plantilla: '+error.message,'error');
                    } finally {
                        templateSaveLock.current=false;
                        setTemplateSaving(false);
                    }
                };

                const openTemplateEditor = (tpl,duplicate=false) => {
                    setTemplateDraft({
                        name:duplicate?'Copia de '+(tpl.name||'plantilla'):tpl.name||'',
                        category:tpl.category||'pvc-horizontal',
                        frontBg:tpl.frontBg||'',
                        backBg:tpl.backBg||'',
                        frontName:tpl.frontBg?'Imagen actual':'',
                        backName:tpl.backBg?'Imagen actual':''
                    });
                    setTemplateModal({open:true,isEditing:!duplicate,data:tpl});
                };

                const deleteTemplate = (tpl) => {
                    const affected=qrs.filter(card=>card.designTemplateId===tpl.id);
                    if(affected.length){
                        showToast('La plantilla está asignada a '+affected.length+' tarjeta(s). Retira sus asignaciones antes de eliminarla.','warning');
                        return;
                    }
                    setConfirmModal({
                        open:true,
                        title:'Eliminar plantilla',
                        message:'¿Deseas eliminar permanentemente la plantilla “'+tpl.name+'” de la biblioteca?',
                        onConfirm:async()=>{
                            try{
                                if(workshopSession){
                                    await workshopApi({action:'delete',session:workshopSession,kind:'templates',ids:[tpl.id]});
                                }
                                if(workshopSession){
                                    const verify=await workshopApi({action:'list',session:workshopSession});
                                    if(verify.templates?.some(t=>t.id===tpl.id)) throw new Error('El servidor todavía conserva la plantilla.');
                                }

                                last.current={...last.current,templates:nextTemplates};

                                showToast('Plantilla eliminada de la nube.','warning');

                                setConfirmModal({open:false,title:'',message:'',onConfirm:null});

                            <InternalSelect label="Categoría de plantilla" value={templateCategory} onChange={setTemplateCategory} options={[["all","Todas las categorías"],...[...new Set(templates.map(tpl=>tpl.category).filter(Boolean))].sort().map(category=>[category,category])]} />

                        <div className="tq-library-table">

                        {templatePreview && (

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                                    {[['Anverso',templatePreview.frontBg],['Reverso',templatePreview.backBg]].map(([label,src])=>
                                        <figure key={label} className="min-w-0">

                                            {src ? <img src={src} alt={label+' de '+templatePreview.name} /> : <p className="p-4 text-sm text-slate-400">Sin imagen</p>}
                                        </figure>

                        {templateModal.open && (
                            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="tq-template-dialog glass-panel w-full max-w-lg max-h-[calc(100dvh-2rem)] overflow-y-auto overscroll-contain rounded-2xl p-4 sm:p-6 border border-slate-700 space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="font-bold text-white">{templateModal.isEditing?'Editar plantilla':templateModal.data?'Duplicar plantilla':'Crear Nueva Plantilla Guardada'}</h3>
                                        <button type="button" disabled={templateSaving} onClick={() => { setTemplateModal({open:false,isEditing:false,data:null}); setTemplateDraft({name:'',category:'pvc-horizontal',frontBg:'',backBg:'',frontName:'',backName:''}); }} className="text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    <form onSubmit={handleSaveTemplate} className="space-y-4">
                                        <input type="text" placeholder="Nombre de la Plantilla (ej: Barberías Oro)" required value={form.name} onChange={e=>setForm(prev=>({...prev,name:e.target.value}))} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm" />
                                        
                                        <div>
                                            <label className="block text-xs text-slate-300 mb-1">Formato de la plantilla</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[
                                                    ['pvc-horizontal','PVC horizontal'],
                                                    ['pvc-vertical','PVC vertical'],
                                                    ['10x15','Letrero 10×15'],
                                                    ['magnet-horizontal','Imán 6×4'],
                                                    ['magnet-square','Imán 5×5']
                                                ].map(([value,label])=>(
                                                    <button key={value} type="button" onClick={()=>setForm(prev=>prev.category===value?prev:{...prev,category:value,frontBg:'',backBg:'',frontName:'',backName:''})} className={`rounded-lg border px-2 py-2 text-[11px] font-semibold ${form.category===value?'border-blue-400 bg-blue-500/20 text-white':'border-slate-700 bg-slate-900 text-slate-400'}`}>{label}</button>

                                        <div>

                                                try {
                                                    const b64 = await compressImageToDataURL(file, ...templateImageSize, 0.92, 'cover');
