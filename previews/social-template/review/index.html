<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TOCAQUI · Tu experiencia</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:#0b1427;border:1px solid #1e3a5f;border-radius:24px;padding:28px;box-shadow:0 24px 70px #02061799}.brand{display:inline-block;background:#132341;color:#93c5fd;padding:9px 13px;border-radius:100px;font-weight:800;font-size:12px;letter-spacing:.08em}h1{font-size:26px;line-height:1.2;margin:18px 0 12px}.muted{color:#a5b4cc;line-height:1.5}.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:24px 0}.star{font-size:28px;text-align:center;text-decoration:none;color:#fbbf24;background:#111c31;border:1px solid #334155;border-radius:12px;padding:12px 0}.star:focus-visible,.btn:focus-visible{outline:3px solid #60a5fa}textarea{width:100%;min-height:130px;background:#08101f;border:1px solid #334155;color:#fff;padding:14px;border-radius:12px;font:inherit}.btn{display:block;width:100%;background:#2563eb;color:#fff;text-align:center;border:0;border-radius:12px;padding:14px;text-decoration:none;font-weight:700;font:inherit;cursor:pointer}.secondary{background:#182439;border:1px solid #334155;margin-top:10px}.small{font-size:12px;color:#94a3b8}#feedback{display:none}</style></head><body><main class="card"><div class="brand">TOCAQUI · NFC / QR</div><h1 id="heading">¿Cómo fue tu experiencia?</h1><p class="muted">Selecciona una calificación para continuar.</p><div id="stars" class="stars"><a class="star" href="#" data-rating="1" aria-label="1 estrella">★</a><a class="star" href="#" data-rating="2" aria-label="2 estrellas">★</a><a class="star" href="#" data-rating="3" aria-label="3 estrellas">★</a><a class="star" href="#" data-rating="4" aria-label="4 estrellas">★</a><a class="star" href="#" data-rating="5" aria-label="5 estrellas">★</a></div><section id="feedback"><p class="muted">Puedes dejar un comentario privado sobre tu experiencia.</p><form id="feedbackForm"><textarea name="comment" required maxlength="1500" placeholder="Tu comentario..." aria-label="Comentario privado"></textarea><button class="btn" type="submit">Enviar comentario privado</button></form><a id="publicReview" class="btn secondary" href="#" rel="noopener noreferrer">También puedes dejar una reseña pública</a><p id="feedbackStatus" class="small" role="status"></p></section><p class="small">Tu opinión es importante.</p></main><script>const q=new URLSearchParams(location.search);const card=q.get('card')||'';const name=q.get('name')||'';const target=q.get('target')||'';const base='https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-admin-qr-test-r/';const valid=/^TAG-[A-Z0-9]{5,32}$/.test(card);const reviewTarget=(()=>{try{const u=new URL(target);return u.protocol==='https:'?u.href:null}catch{return null}})();document.getElementById('heading').textContent='¿Cómo fue tu experiencia'+(name?' en '+name:'')+'?';document.getElementById('publicReview').href=reviewTarget||base+encodeURIComponent(card)+'?rating=5';let rating=0;document.querySelectorAll('[data-rating]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(!valid)return;rating=Number(a.dataset.rating);if(rating>=4){location.href=base+encodeURIComponent(card)+'?rating='+rating;return}document.getElementById('stars').style.display='none';document.getElementById('feedback').style.display='block'}));document.getElementById('feedbackForm').addEventListener('submit',async e=>{e.preventDefault();if(!valid||rating<1||rating>3)return;const status=document.getElementById('feedbackStatus');status.textContent='Enviando...';const comment=e.target.elements.comment.value.trim();if(!comment)return;try{const body=new URLSearchParams({stars:String(rating),comment});const res=await fetch(base+encodeURIComponent(card),{method:'POST',body});if(!res.ok)throw Error();status.textContent='Gracias. Tu comentario fue registrado.';e.target.style.display='none'}catch{status.textContent='No se pudo guardar. Intenta nuevamente.'}});</script></body></html>
