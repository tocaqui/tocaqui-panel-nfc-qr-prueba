        const compressImageToDataURL = (file, targetWidth = 600, targetHeight = 950, quality = 0.85) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);

                        const imgRatio = img.width / img.height;
                        const targetRatio = targetWidth / targetHeight;
                        let renderW = targetWidth;
                        let renderH = targetHeight;
                        let offsetX = 0;
                        let offsetY = 0;

                        if (imgRatio > targetRatio) {
                            renderW = targetHeight * imgRatio;
                            offsetX = (targetWidth - renderW) / 2;
                        } else {
                            renderH = targetWidth / imgRatio;
                            offsetY = (targetHeight - renderH) / 2;
                        }

                        ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

                const [pairError,setPairError]=useState('');
                const [pairBusy,setPairBusy]=useState(false);
                const deviceApi=async payload=>{
                    const response=await fetch('https://nasdgjalsfxnwymqicio.supabase.co/functions/v1/tocaqui-device-activation',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3'},body:JSON.stringify(payload)});
                    const result=await response.json();
                    if(!response.ok||!result.ok)throw new Error(result.error||'Solicitud rechazada');

                const pairDevice=async()=>{
                    if(pairBusy)return;

                    try{

                const [searchQuery, setSearchQuery] = useState('');

                const [placeSuggestions, setPlaceSuggestions] = useState([]);
                const [placesLoading, setPlacesLoading] = useState(false);
                const [placesError, setPlacesError] = useState('');
                const placesSessionTokenRef = useRef(null);
                const placesRequestIdRef = useRef(0);
                const [manualPlaceId,setManualPlaceId]=useState(qr.placeId||'');
                const [manualBusinessName,setManualBusinessName]=useState(qr.businessName||'');

                useEffect(() => {
                    const query = searchQuery.trim();
                    if (!googleApiKey || query.length < 2 || selectedPlace) {
                        setPlaceSuggestions([]);
                        setPlacesLoading(false);
                        if (!googleApiKey) setPlacesError('');
                        return;
                    }

                    const requestId = ++placesRequestIdRef.current;
                    const timer = setTimeout(async () => {
                        setPlacesLoading(true);
                        setPlacesError('');
                        try {
                            const { AutocompleteSuggestion, AutocompleteSessionToken } = await loadGooglePlacesLibrary(googleApiKey);
                            if (!placesSessionTokenRef.current) {
                                placesSessionTokenRef.current = new AutocompleteSessionToken();
                            }
                            const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
                                input: query,
                                region: 'cl',
                                language: 'es-CL',
                                sessionToken: placesSessionTokenRef.current
                            });
                            if (requestId !== placesRequestIdRef.current) return;
                            setPlaceSuggestions(
                                (suggestions || [])
                                    .map(item => item.placePrediction)
                                    .filter(Boolean)
                                    .slice(0, 6)
                            );
                        } catch (err) {
                            if (requestId !== placesRequestIdRef.current) return;
                            console.error('Google Places autocomplete error', err);
                            setPlaceSuggestions([]);
                            setPlacesError('No se pudo consultar Google Places. Revisa la API Key y que Places API (New) esté habilitada.');
                        } finally {
                            if (requestId === placesRequestIdRef.current) setPlacesLoading(false);
                        }
                    }, 350);

                    return () => clearTimeout(timer);
                }, [searchQuery, selectedPlace, googleApiKey]);

                const selectGooglePlace = async (prediction) => {
                    setPlacesLoading(true);
                    setPlacesError('');
                    try {
                        const place = prediction.toPlace();
                        await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
                        const picked = {
                            name: place.displayName || prediction.mainText?.text || prediction.text?.text || 'Negocio',
                            address: place.formattedAddress || prediction.secondaryText?.text || '',
                            placeId: prediction.placeId
                        };
                        setSelectedPlace(picked);
                        setManualBusinessName(picked.name);
                        setManualPlaceId(picked.placeId || '');
                        setSearchQuery('');
                        setPlaceSuggestions([]);
                        placesSessionTokenRef.current = null;
                    } catch (err) {
                        console.error('Google Places selection error', err);
                        setPlacesError('No se pudieron cargar los datos del negocio seleccionado.');

                        setPlacesLoading(false);

                const handleConfirmActivation = async () => {
                    if (activationSaving) return;

                    if (presetType !== 'custom_url' && (!selectedPlace?.placeId || !selectedPlace?.name)) {
                        showToast('Debes seleccionar un negocio real con Place ID', 'error');
                        return;

                    if (presetType === 'custom_url' && !/^https:\/\//i.test(customUrl)) {
                        showToast('Introduce una URL HTTPS válida', 'error');
                        return;
                    }
                    if (!/^\d{4}$/.test(pinEntered)) {
                        setPinError(true);
                        showToast('Ingresa el PIN de activación de 4 dígitos.', 'warning');
                        return;
                    }

                    setActivationSaving(true);
                    try {
                        if(!deviceCredential)throw new Error('Vincula este dispositivo primero.');

                        let finalUrl = customUrl;
                        if ((presetType === 'google_review' || presetType === 'review_gate') && selectedPlace) {
                            finalUrl = `https://search.google.com/local/writereview?placeid=${selectedPlace.placeId}`;
                        }
                        finalUrl = sanitizeUrl(finalUrl);

                        const existingCard = qrs.find(item => item.id === qr.id) || qr;
                        const now = Date.now();
                        const history = [...(existingCard.history || [])];

                        if (finalUrl && finalUrl !== existingCard.dynamicUrl) {
                            history.push({
                                timestamp: now,
                                type: 'update',
                                description: `Cambio de URL: ${existingCard.dynamicUrl || 'vacía'} → ${finalUrl}`
                            });
                        }
                        if (assignedClient && assignedClient !== existingCard.clientId) {
                            const cl = clients.find(c => c.id === assignedClient);
                            history.push({
                                timestamp: now,
                                type: 'assignment',
                                description: `Asignada a cliente: ${cl ? cl.name : assignedClient}`
                            });
                        }
                        history.push({
                            timestamp: now,
                            type: 'activation',
                            description: `Tarjeta activada con función ${presetType}`
                        });

                        const activatedCard = {
                            ...existingCard,
                            status: 'active',
                            clientId: assignedClient,
                            businessName: selectedPlace ? selectedPlace.name : (existingCard.businessName || 'Negocio Asignado'),
                            businessAddress: selectedPlace ? selectedPlace.address : (existingCard.businessAddress || ''),
                            placeId: selectedPlace ? selectedPlace.placeId : (existingCard.placeId || null),
                            functionType: presetType,
                            dynamicUrl: finalUrl,
                            updatedAt: now,
                            history
                        };

                        try {
                            await deviceApi({action:'activate',credential:deviceCredential,pin:pinEntered,card:activatedCard});
                        } catch(error) {
                            setPinError(true);
                            if(/device not authorized/i.test(error.message||'')){
                                localStorage.removeItem('tocaqui_device_credential_v1');
                                setDeviceCredential('');
                            }
                            throw error;
                        }
                        setPinVerified(true);

                        setQrs(prev => {
                            const exists = prev.some(item => item.id === activatedCard.id);
                            return exists
                                ? prev.map(item => item.id === activatedCard.id ? activatedCard : item)
                                : [activatedCard, ...prev];
                        });

                        const previousCloud = last.current.qrs || [];
                        last.current = {
                            ...last.current,
                            qrs: previousCloud.some(item => item.id === activatedCard.id)
                                ? previousCloud.map(item => item.id === activatedCard.id ? activatedCard : item)
                                : [activatedCard, ...previousCloud]
                        };

                        showToast('Tarjeta activada y guardada en Supabase.', 'success');
                        setActivateModal({ open: false, qr: null });
                    } catch (err) {
                        console.error('Activation error', err);
                        const message = String(err?.message || err || '');
                        if (/PIN de activación requerido/i.test(message)) setPinError(true);
                        showToast('No se pudo activar la tarjeta: ' + message, 'error');
                    } finally {
                        setActivationSaving(false);
                    }
                };

                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-xl rounded-2xl p-6 border border-slate-700 max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg text-white">Configurar Tarjeta {qr.trackingCode}</h3>
                                <button onClick={() => setActivateModal({ open: false, qr: null })} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>

                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">1. Vincular a Cliente</label>
                                        <select value={assignedClient} onChange={e => setAssignedClient(e.target.value)} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm">
                                            {clients.map(c => (
                                                <option key={c.id} value={c.id} className="bg-slate-900 text-white">{c.name} ({c.company})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">2. Vincular negocio por Place ID real</label>
                                        {!googleApiKey ? (
                                            <p className="text-xs text-amber-300 mb-2">Google Places está listo para integrarse, pero falta guardar la API Key en Configuración & APIs. Mientras tanto puedes ingresar el Place ID oficial manualmente.</p>
                                        ) : (
                                            <p className="text-xs text-emerald-300 mb-2">Búsqueda real de Google Places habilitada. También puedes usar el Place ID oficial manualmente.</p>
                                        )}
                                        <input type="text" className="w-full glass-input px-3 py-2 mb-2" placeholder="Nombre comercial" value={manualBusinessName} onChange={e=>setManualBusinessName(e.target.value)}/>
                                        <input type="text" className="w-full glass-input px-3 py-2 mb-2" placeholder="Place ID (ChIJ...)" value={manualPlaceId} onChange={e=>setManualPlaceId(e.target.value)}/>
                                        <button type="button" onClick={()=>{if(manualPlaceId.trim()&&manualBusinessName.trim())setSelectedPlace({name:manualBusinessName.trim(),address:'',placeId:manualPlaceId.trim()})}} className="bg-slate-700 rounded px-3 py-2 text-xs mb-2">Aplicar Place ID</button>

                                        <div className="relative">
                                            <input
                                                type="text"
                                                placeholder={googleApiKey ? "Buscar negocio real en Google..." : "Guarda la API Key para buscar negocios..."}
                                                value={searchQuery}
                                                disabled={!googleApiKey}
                                                onChange={e => { setSearchQuery(e.target.value); setSelectedPlace(null); }}
                                                className="w-full glass-input px-3.5 py-2.5 rounded-xl text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                                            />
                                            {placesLoading && (
                                                <i className="fa-solid fa-spinner fa-spin absolute right-3 top-3 text-blue-400 text-sm"></i>
                                            )}
                                        </div>
                                        {placesError && <p className="text-[11px] text-red-300 mt-2">{placesError}</p>}
                                        {searchQuery && !selectedPlace && placeSuggestions.length > 0 && (
                                            <div className="mt-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden divide-y divide-slate-800">
                                                {placeSuggestions.map((prediction, idx) => (
                                                    <button
                                                        type="button"
                                                        key={prediction.placeId || idx}
                                                        onClick={() => selectGooglePlace(prediction)}
                                                        className="w-full p-3 hover:bg-slate-800 cursor-pointer text-xs flex justify-between items-center text-left"
                                                    >
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-white truncate">{prediction.mainText?.text || prediction.text?.text || 'Negocio'}</div>
                                                            <div className="text-slate-400 truncate">{prediction.secondaryText?.text || prediction.text?.text || ''}</div>
                                                        </div>
                                                        <span className="text-blue-400 font-mono text-[10px] ml-3 flex-shrink-0">Seleccionar</span>
                                                    </button>
                                                ))}
                                                <div className="px-3 py-2 text-[10px] text-slate-500 text-right">Resultados de Google</div>
                                            </div>
                                        )}
                                        {selectedPlace && (
                                            <div className="mt-2 bg-blue-600/10 border border-blue-500/30 p-3 rounded-xl flex justify-between items-center text-xs">
                                                <div><div className="font-bold text-white">{selectedPlace.name}</div><div className="text-slate-400">{selectedPlace.address}</div></div>
                                                <button onClick={() => setSelectedPlace(null)} className="text-slate-400 hover:text-red-400">Cambiar</button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-2">3. Función de Destino</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'review_gate', name: 'Filtro 5 Estrellas (Review Gate)' },
                                                { id: 'google_review', name: 'Directo Google Reviews' },
                                                { id: 'custom_url', name: 'URL Personalizada / PDF' }
                                            ].map(fn => (
                                                <button key={fn.id} type="button" onClick={() => setPresetType(fn.id)} className={`p-3 rounded-xl border text-xs font-semibold text-left ${presetType === fn.id ? 'bg-blue-600/30 border-blue-500 text-white' : 'bg-slate-800/40 border-slate-700/60 text-slate-400'}`}>
                                                    {fn.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {presetType === 'custom_url' && (
                                        <input type="url" value={customUrl} onChange={e => setCustomUrl(e.target.value)} className="w-full glass-input px-3.5 py-2.5 rounded-xl text-xs font-mono" placeholder="https://..." />
                                    )}

                                    {!deviceCredential && <div className="glass-panel p-4 rounded-2xl border border-blue-500/20 space-y-2">
                                        <label className="block text-xs font-semibold text-slate-300 uppercase">Vincular dispositivo (una sola vez)</label>
                                        <p className="text-[11px] text-slate-400">Código de autorización, sin correo ni contraseña.</p>
                                        <input value={pairCode} onChange={e=>setPairCode(e.target.value.trim().toLowerCase())} className="w-full glass-input px-3.5 py-3 rounded-xl text-xs font-mono" placeholder="Código de vinculación" autoComplete="off" />
                                        {pairError && <p role="alert" className="text-[11px] text-red-300">{pairError}</p>}
                                        <button type="button" onClick={pairDevice} disabled={pairBusy||!/^[a-f0-9]{64}$/.test(pairCode)} className="w-full py-2.5 bg-blue-600 rounded-xl text-sm font-semibold text-white disabled:opacity-40">{pairBusy?'Vinculando...':'Vincular dispositivo'}</button>
                                    </div>}
                                    {deviceCredential && <p className="text-[11px] text-emerald-300">Dispositivo vinculado. Usa tu PIN para activar.</p>}
                                    <div className="glass-panel p-4 rounded-2xl border border-amber-500/20 space-y-2">
                                        <div className="flex items-center justify-between gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 uppercase">4. PIN de activación</label>
                                                <p className="text-[10px] text-slate-500 mt-0.5">El PIN autoriza durante 5 minutos el cambio a estado activo.</p>
                                            </div>
                                            {pinVerified && (
                                                <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">VERIFICADO</span>
                                            )}
                                        </div>
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            autoComplete="one-time-code"
                                            maxLength="4"
                                            value={pinEntered}
                                            onChange={e => {
                                                setPinEntered(e.target.value.replace(/\D/g, '').slice(0, 4));
                                                setPinError(false);
                                                setPinVerified(false);
                                            }}
                                            className={`w-full glass-input px-3.5 py-3 rounded-xl text-center text-lg font-mono font-bold tracking-[0.45em] ${pinError ? 'border-red-500/70' : ''}`}
                                            placeholder="••••"
                                            aria-label="PIN de activación"
                                        />
                                        {pinError && <p className="text-[11px] text-red-300">PIN inválido, bloqueado o no autorizado.</p>}
                                        {!cloudReady && cloudError && (
                                            <p className="text-[11px] text-amber-300">{cloudError}</p>
                                        )}
                                    </div>

                                    <button
                                        onClick={handleConfirmActivation}
                                        disabled={activationSaving}
                                        className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 disabled:opacity-50 disabled:cursor-wait text-white font-bold rounded-xl shadow-lg"
                                    >
                                        {activationSaving ? 'Validando y activando...' : 'Guardar y Activar Tarjeta'}
                                    </button>
                                </div>
                        </div>
                    </div>
                );
            };

            // SCAN SIMULATOR MODAL
            const ScanSimulatorModal = () => {
                if (!scanSimModal.open) return null;
                const scannedQr = qrs.find(q => q.trackingCode === scanSimModal.code) || { trackingCode: scanSimModal.code, status: 'pending', dynamicUrl: '' };

                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-sm rounded-3xl p-6 border border-slate-700 text-center relative">
                            <button onClick={() => setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 })} className="absolute top-4 right-4 text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>

                            <div className="w-16 h-16 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 animate-bounce">
                                <i className="fa-solid fa-mobile-screen"></i>
                            </div>

                            <span className="text-[10px] font-mono uppercase bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full">
                                Escaneado: {scannedQr.trackingCode}
                            </span>

                            {scannedQr.status === 'active' ? (
                                <div className="mt-5 space-y-4">
                                    <h3 className="font-bold text-white text-lg">{scannedQr.businessName || 'Tarjeta Conectada'}</h3>
                                    
                                    {scannedQr.functionType === 'review_gate' && scanSimModal.reviewGateStep === 'stars' ? (
                                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                                            <p className="text-xs text-slate-300 font-semibold">¿Cómo fue tu experiencia en el local?</p>
                                            <div className="flex justify-center gap-2 text-2xl text-amber-400">
                                                {[1, 2, 3, 4, 5].map(star => (
                                                    <button
                                                        key={star}
                                                        onClick={() => {
                                                            if (star >= 4) {
                                                                window.open(scannedQr.dynamicUrl, '_blank');
                                                            } else {
                                                                setScanSimModal(prev => ({ ...prev, reviewGateStep: 'feedback', selectedStars: star }));
                                                            }
                                                        }}
                                                        className="hover:scale-125 transition-transform"
                                                    >
                                                        ★
                                                    </button>
                                                ))}
                                            </div>
                                            <span className="text-[10px] text-slate-500 block">4-5 ★ redirige a Google Maps • 1-3 ★ formulario privado</span>
                                        </div>
                                    ) : scannedQr.functionType === 'review_gate' && scanSimModal.reviewGateStep === 'feedback' ? (
                                        <div className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                                            <p className="text-xs text-slate-300 font-semibold">Déjanos tu sugerencia privada:</p>
                                            <textarea rows="3" placeholder="Escribe aquí tu comentario..." className="w-full glass-input p-2.5 rounded-xl text-xs"></textarea>
                                            <button onClick={() => { showToast('Gracias por tu opinión privada.', 'success'); setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 }); }} className="w-full py-2 bg-blue-600 text-white font-bold rounded-xl text-xs">Enviar Feedback</button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="p-3 bg-slate-900 rounded-xl text-xs font-mono text-blue-400 break-all border border-slate-800">{scannedQr.dynamicUrl}</div>
                                            <a href={scannedQr.dynamicUrl} target="_blank" rel="noreferrer" className="block w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm">Abrir Enlace Final &rarr;</a>
                                        </>
                                    )}
                                </div>
                            ) : (
                                <div className="mt-5 space-y-4">
                                    <h3 className="font-bold text-amber-400 text-lg">Tarjeta Virgen Por Activar</h3>
                                    <p className="text-xs text-slate-400">Al escanear esta tarjeta en blanco se requiere ingresar el PIN maestro para asignarla a un local.</p>
                                    <button onClick={() => { setScanSimModal({ open: false, code: '', reviewGateStep: 'stars', selectedStars: 0 }); setActivateModal({ open: true, qr: scannedQr }); }} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl">Activar e Ingresar PIN</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ConfirmModal = () => {
                if (!confirmModal.open) return null;
                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="glass-panel w-full max-w-sm rounded-2xl p-6 border border-slate-700">
                            <h3 className="font-bold text-lg text-white mb-2">{confirmModal.title}</h3>
                            <p className="text-xs text-slate-300 mb-5">{confirmModal.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmModal({ open: false, title: '', message: '', onConfirm: null })} className="flex-1 py-2.5 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl">Cancelar</button>
                                <button onClick={confirmModal.onConfirm} className="flex-1 py-2.5 bg-red-600 text-white text-xs font-bold rounded-xl">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    <TopHeader />
                    <div className="flex-1 flex overflow-hidden">
                        {roleMode === 'admin' ? (
                            <>
                                <AdminSidebar />
                                <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
                                    <div className="max-w-7xl mx-auto">
                                        {adminTab === 'dashboard' && <DashboardView />}
                                        {adminTab === 'batch' && <BatchView />}
                                        {adminTab === 'qrs' && <QRManagementView />}
                                        {adminTab === 'clients' && <ClientView />}
                                        {adminTab === 'client-detail' && <ClientView />}
                                        {adminTab === 'templates' && <TemplatesView />}
                                        {adminTab === 'print' && <PrintView />}
                                        {adminTab === 'settings' && <SettingsView />}
                                    </div>
                                </main>
                            </>
                        ) : (
                            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 no-print">
                                <ClientPortalView />
                            </main>
                        )}
                    </div>

                    {individualQr && (
                        <div className="fixed inset-0 z-[90] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 no-print" role="dialog" aria-modal="true" aria-label={'QR de ' + individualQr.trackingCode} onClick={() => setIndividualQr(null)}>
                            <div className="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-5 sm:p-6 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start gap-3">
                                    <div>
                                        <h2 className="font-bold text-white text-lg">QR de {individualQr.trackingCode}</h2>
                                        <p className="text-xs text-slate-400 mt-1">{individualQr.businessName || 'Tarjeta sin negocio asignado'}</p>
                                    </div>
                                    <button type="button" aria-label="Cerrar QR" onClick={() => setIndividualQr(null)} className="p-2 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="bg-white rounded-xl p-4 mx-auto w-full max-w-[320px] aspect-square flex items-center justify-center">
                                    {individualQrImage ? <img src={individualQrImage} alt={'Código QR de '+individualQr.trackingCode} className="w-full h-full object-contain" /> : <span className="text-slate-700 text-sm">Generando QR...</span>}
                                </div>
                                <div className="flex items-center justify-between text-xs">
                                    <span className={individualQr.status === 'active' ? 'text-emerald-400' : 'text-amber-400'}>{individualQr.status === 'active' ? 'Tarjeta activa' : 'Pendiente de activación'}</span>
                                    <span className="font-mono text-slate-400">{individualQr.trackingCode}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={downloadIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-blue-600 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-download mr-2"></i>Descargar PNG</button>
                                    <button type="button" onClick={shareIndividualQr} disabled={!individualQrImage} className="rounded-xl bg-slate-700 text-white font-semibold text-sm py-3 disabled:opacity-50"><i className="fa-solid fa-share-nodes mr-2"></i>Compartir</button>
                                </div>
                                <a href={getBaseTagUrl(individualQr.trackingCode)} target="_blank" rel="noopener noreferrer" className="block text-center text-cyan-300 border border-cyan-500/30 rounded-xl py-2.5 text-sm font-semibold">Probar enlace QR <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i></a>
                                <p className="text-[11px] text-slate-400 text-center">Este QR conserva su identificador dinámico. El destino se administra desde Configurar.</p>
                            </div>
                        </div>
                    )}
                    <ActivationModal />
                    <ScanSimulatorModal />
                    <ConfirmModal />

                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-50 glass-panel border border-slate-700 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                            <span className="text-xs font-semibold text-white">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        };

        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('No se cargo Supabase JS. Comprueba la conexion a la biblioteca externa.');
        }
        class TocaquiErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state={error:null}; }
          static getDerivedStateFromError(error) { return {error}; }
          componentDidCatch(error, info) { console.error('TOCAQUI runtime', error, info); }
          render() { return this.state.error
            ? <div style={{padding:24,color:'white',fontFamily:'system-ui'}}><h2>Error de interfaz TOCAQUI</h2><p>{String(this.state.error.message || this.state.error)}</p><p>Los datos locales no se han eliminado.</p></div>
            : this.props.children; }
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        const cloud=window.supabase.createClient('https://nasdgjalsfxnwymqicio.supabase.co','sb_publishable_b2pGQWqC4OtByq_l8r86oA_ZxLWZty3');
root.render(<TocaquiErrorBoundary><App cloud={cloud} /></TocaquiErrorBoundary>);
    </script>
</body>
</html>
